# 대조군 — 무엇과 견주어 palimpsest가 값을 냈다고 말할 것인가
#
# **이 파일이 대조군의 단일 진실이다.** 다른 곳(criteria.toml 등)은 `id` 로만 참조한다.
# 같은 것을 두 곳에 적으면 그것이 곧 drift다(README §7).
#
# 대조군이 없으면 "palimpsest가 답을 냈다"는 문장은 검사되지 않는다. 기성 도구가
# 이미 내는 답을 다시 내면서 값을 주장하는 것이 이 제품의 가장 조용한 실패 경로다.
#
# **여기서 등록하는 것은 팔의 정의·조작법·기권 조건이고 숫자가 아니다**
# (P0-preflight §5.1 — 수치 합격선은 각 기능의 첫 코드 커밋 이전에 등록한다).
#
# 판정 기록: docs/gates/preflight.md §T5

schema_version = 1
registered_at = "2026-08-11"
registered_in_issue = 30

# ═════════════════════════════════════════════════════════════════════════════
# 두 축을 구분한다
#
#   능력 축 (C*) — "기성 수단으로 이 질문에 답할 수 있는가"
#                  → 답할 수 있으면 그 과제에서 palimpsest 는 값이 없다
#   결과 축 (A*) — "그 산출을 본 뒤 코드가 나아졌는가" (G7 · T11)
#
# 둘을 한 표에 접으면 안 된다. **능력 축 통과가 결과 축 통과를 함의하지 않는다** —
# goals §0.1 이 "그 산출이 정확하다"를 통과 사유에서 뺀 것과 같은 이유다.
# ═════════════════════════════════════════════════════════════════════════════

# ─────────────────────────────────────────────────────────────────────────────
# 능력 축 — 인수 기준이 요구한 대조군 셋 (P0-preflight §5)
# ─────────────────────────────────────────────────────────────────────────────

[[arm]]
id = "C1"
axis = "capability"
name = "문서 한 장"
definition = """
대상 프로젝트가 이미 가진 사람이 쓴 개괄 문서 하나를 읽고 답한다. 도구를 쓰지 않는다.
**이것이 가장 정직한 대조군이다** — 실제로 대부분의 팀이 쓰는 수단이고,
palimpsest 가 이겨야 하는 최저선이 여기다.
"""
instances = [
  { corpus = "boxwood", artifact = "CONTEXT.md @ b4985d8fb93d", size = "339행", measured_in = "T6" },
  { corpus = "ditto",   artifact = "docs/features/<name>.md",   size = "38건",  measured_in = "T10ⓑ 부가관측" },
]
answers_well = """
· 개념이 대략 어디에 있는가 (T6 실측: 문서가 코드 이름을 함께 적어 준 개념은 8/8 지목됨)
· 아키텍처의 의도·큰 갈래
"""
answers_poorly = """
· **좌표가 없다.** '어느 심볼'이 아니라 '어느 영역'까지만 간다
· **낡음을 모른다.** 문서 자신이 낡았는지 문서는 말하지 않는다(goals §3.3)
· **역방향이 없다.** "여기를 바꾸면 무엇이 깨지나"에 답하지 않는다
"""
bias = """
**이 팔은 T6에서 이미 편향이 실측됐다.** 문서가 코드 이름을 함께 적어 준 개념은
100% 지목되고 그렇지 않은 것은 83.3%다(16.7%p). 즉 **C1 은 문서가 잘 쓰인 프로젝트에서
과대평가된다.** 과제를 그런 개념에만 걸면 palimpsest 의 값이 과소평가된다.
대조 시 `doc_named_code` 여부로 층을 갈라 보고한다.
"""

[[arm]]
id = "C2"
axis = "capability"
name = "기성 코드그래프 · 심볼 인덱스 도구"
definition = """
LSP / 언어 서버가 이미 내는 심볼 인덱스와 참조 검색으로 답한다.
**이 팔이 이 제품에서 가장 위험한 대조군이다** — goals §4가 "코드 검색 도구가 아니다"라고
적었고, 참조·정의 이동은 기성 도구가 이미 잘 한다.
"""
instances = [
  { tool = "typescript-language-server", scope = "TypeScript", availability = "설치 확인됨 (claude-plugins-official/typescript-lsp)" },
  { tool = "jdtls",                      scope = "Java/Kotlin", availability = "설치 확인됨 (claude-plugins-official/jdtls-lsp)" },
]
answers_well = """
· 정의로 이동 · 참조 찾기 · 심볼 목록 — **이 셋은 대체로 palimpsest 보다 정확하다**
  (언어 서버는 타입 해석을 하고 palimpsest 는 goals §3.4 대로 빌드하지 않는다)
"""
answers_poorly = """
· **결박이 없다.** 결정·계획·ADR이 좌표에 붙어 있지 않다 — 이 제품의 판매 논거(goals §0)
· **낡음이 없다.** 심볼은 알아도 그 심볼에 걸린 결정이 유효한지는 모른다
· **모르는 것을 말하지 않는다.** 못 푼 참조를 조용히 버린다(goals §3.1) —
  `UnresolvedRef` 가 1급 노드인 것이 이 대비다
· **임의 과거 커밋에서 안 선다.** 빌드·의존성 설치를 요구한다
"""
abstain_when = """
**E2(역방향 참조)에서 C2가 palimpsest 를 이기면 그것은 정상이고 기록한다.**
이 팔의 목적은 이기는 것이 아니라 **어디서 지는지를 드러내는 것**이다.
E2에서 지면 goals §4('코드 검색 도구가 아니다')가 실제로 지켜지는지 다시 묻는다.
"""

[[arm]]
id = "C3"
axis = "capability"
name = "기존 정적 분석 도구"
definition = """
대상 프로젝트가 **이미 돌리고 있는** 린터·타입체커의 산출로 답한다.
새로 도입하지 않는다 — 도입하면 그것은 조달이 아니라 저작이다(F16b의 전제).
"""
instances = [
  { corpus = "ditto",   tools = "biome check · tsc --noEmit", coordinates = "예 — 단 biome format 규칙은 파일까지만", measured_in = "T9" },
  { corpus = "boxwood", tools = "eslint · svelte-check (frontend 만)", coordinates = "로그에서만", measured_in = "T9" },
]
answers_well = """
· 규칙 위반의 좌표 — 그 도구가 아는 규칙 안에서는 정확하다
"""
answers_poorly = """
· **프로젝트 고유 관용구를 모른다.** T4가 실측했다 — 프레임워크 표준 규칙(R2)은 코드 줄 2건,
  프로젝트 고유 관용구(R1·R7·R8)는 76건이다. **도구가 기본으로 아는 것에는 팩이 필요 없고,
  팩이 필요한 곳에는 도구가 모르는 것이 있다**
· **결정·계획을 모른다.** 규칙 위반이지 결정 위반이 아니다
"""
abstain_when = """
**T9가 이 팔의 가용성을 이미 반증에 가깝게 실측했다.**
SAST 조달원 0/4 · 아티팩트 0/4 · SARIF 0/4 이고, (b)의 판정 대상인 boxwood Kotlin
백엔드에는 분석 CI가 하나도 없다.

그러므로 **C3 는 코퍼스마다 성립 여부가 다르다.** 성립하지 않는 코퍼스에서는
그 과제를 '대조 불가'로 적는다 — **없는 팔을 0점으로 세지 않는다.**
0점으로 세면 palimpsest 가 이긴 것처럼 보이고 그것은 측정이 아니라 착시다.
"""

# ─────────────────────────────────────────────────────────────────────────────
# 결과 축 — G7. T11이 criteria.toml 에 임시로 두었던 것을 여기로 옮겼다
#
# **이 이관이 T11이 남긴 잔여의 처분이다.** criteria.toml 은 이제 id 로만 참조한다.
# ─────────────────────────────────────────────────────────────────────────────

[[arm]]
id = "A0"
axis = "outcome"
name = "도구 없음"
definition = "palimpsest 없이 같은 좌표·같은 과제. 재발률(M1)에서는 **역사 그 자체가 이 팔이다**"
moved_from = "criteria.toml [[outcome.arm]] — T11(d5f29b9)이 임시로 정의했던 자리"

[[arm]]
id = "A1"
axis = "outcome"
name = "palimpsest 있음"
definition = "같은 좌표·같은 과제에 `touch`(F11)를 먼저 돌린 뒤 진행"
moved_from = "criteria.toml [[outcome.arm]] — T11(d5f29b9)이 임시로 정의했던 자리"

[arm_limitation]
statement = """
**세 지표 중 회고로 두 팔을 다 얻는 것은 M1 하나뿐이다.**

M1은 과거 스냅샷에서 `touch` 를 돌릴 수 있으므로 arm B가 회고로 성립한다.
M2·M3은 **과거 작업을 palimpsest로 다시 돌릴 수 없으므로 arm B가 전향적 실행을 요구한다** —
즉 사람이 실제로 도구를 쓰면서 일해야 값이 생긴다.

**이것을 등록에 적어 두지 않으면 나중에 "M2·M3도 쟀다"가 회고 계산 하나로 채워진다.**
회고 계산은 arm A이지 대조가 아니다.
"""
moved_from = "criteria.toml [outcome.arm_limitation]"

# ─────────────────────────────────────────────────────────────────────────────
# 팔을 운용하는 규칙
# ─────────────────────────────────────────────────────────────────────────────

[operation]

same_input = """
모든 팔에 **같은 질문·같은 좌표·같은 스냅샷**을 준다. 팔마다 질문을 고쳐 주면
그것이 곧 게이트 오염이다(P0-preflight §5 규칙 1).
"""

blind_scoring = """
채점 입력에서 팔 라벨을 제거한다. 등록하는 사람과 채점하는 사람이 같다는 R-18은
닫히지 않으므로 **줄일 수 있는 것만 줄인다**(criteria.toml `step_3_blind` 와 같은 규율).
"""

report_losses = """
**palimpsest 가 진 과제를 반드시 보고한다.** 특히 C2 는 E2(역방향 참조)에서 이길 수 있고
그것이 정상이다. 이긴 과제만 보고하는 것이 이 축의 가장 조용한 실패 경로다.
"""

abstention = """
팔이 그 코퍼스에서 성립하지 않으면 **'대조 불가'로 적고 통과로 처리하지 않는다**
(P0-preflight §5 규칙 3). **없는 팔을 0점으로 세지 않는다.**
"""

# ─────────────────────────────────────────────────────────────────────────────
# 되돌림 조건
# ─────────────────────────────────────────────────────────────────────────────

falsified_if = """
**C1(문서 한 장)이 과제 대부분에서 palimpsest 와 같은 답을 내면 이 제품의 논거가 무너진다** —
goals §0의 "파는 것은 그래프가 아니라 결박과 신선도"가 거짓이 된다.

**C2(기성 코드그래프)가 결박·낡음 과제까지 답하면** 그 두 자리가 이 제품의 유일한 자리이므로
(goals §4) 제품의 차별점을 다시 정의해야 한다.

둘 다 지금은 반증되지 않았다 — 다만 **아직 시험되지도 않았다.** 이 파일은 시험의 등록이지
시험의 결과가 아니다.
"""
