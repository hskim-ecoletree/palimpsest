**바뀌는 것은 실행 단위이지 판정 단위가 아니다** — 넷을 한 세션에서 닫고 지붕까지
판정한다. 조각마다 세션을 나누면 발견을 따라가다 방향이 바뀌고 끝까지 완수하지 못한다.
