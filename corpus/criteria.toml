# 합격선 — 이 파일의 커밋 시각이 등록 증거다
#
# **이 파일은 아직 완성되지 않았다.** T5(코퍼스·과제·합격선 사전 등록)는 수행되지 않았고,
# 지금 여기 있는 것은 절 여섯이다 — 각 절은 그것을 재는 작업이 착수하면서 등록했다:
#   [outcome]  — T11 이 등록 (2026-08-11). 판정 기록: docs/gates/preflight.md §T11
#   [s0]       — S0 슬라이스가 등록 (2026-08-12). 판정 기록: docs/gates/S0-symbols.md
#   [s1]       — S1 슬라이스가 등록 (2026-08-12). 판정 기록: docs/gates/S1-ledger.md
#   [s2]       — S2 슬라이스가 등록 (2026-08-12). 판정 기록: docs/gates/S2-touch.md
#   [s3]       — S3 슬라이스가 등록 (2026-08-12). 판정 기록: docs/gates/S3-intent.md
#   [f22]      — F22 가 등록 (2026-08-12). 하위 넷. 판정 기록: docs/gates/F22*.md
#
# 기능별 수치 합격선은 여기에 미리 적지 않는다 — [P0-preflight §5.1](../docs/plan/features/P0-preflight.md)이
# 정한 대로 그것은 **그 기능의 첫 코드 커밋 이전**에 등록된다. 아무도 측정한 적 없는 값에
# 미리 선을 그으면 그것은 근거가 아니라 소원이다.
#
# **`[s0]` 은 그 규율이 처음 적용된 자리다.** palimpsest 에 코드가 한 줄도 없는 상태에서
# 등록됐고, 등록 증거는 이 커밋이 워크스페이스 커밋보다 앞선다는 사실이다.

schema_version = 1
registered_at = "2026-08-11"

# ═════════════════════════════════════════════════════════════════════════════
# [outcome] — T11. G7("산출은 정확한데 코드가 나아지지 않는다")의 저울
#
# 채점 기준을 올려 놓고 저울이 없는 것이 R-29다. 승격만 하고 측정을 안 하면
# 그것은 기준이 아니라 수사다. 여기가 그 저울의 등록 자리다.
# ═════════════════════════════════════════════════════════════════════════════

[outcome]
gate = "G7"
risk = "R-29"
registered_before_any_result = true
grounds = """
등록 시점에 palimpsest에는 코드가 한 줄도 없다. 따라서 arm B(도구 있음)의 결과는
존재할 수 없다.

**arm A(도구 없음)의 기준선 수치도 일부러 계산하지 않았다.** 데이터는 있다 —
아래 각 지표의 `corpus_available` 이 그것을 센 것이다 — 그러나 **수치를 알고 나서 합격선을
그으면 그것이 R-18이 경고한 자기 판정이다.** 기준선은 각 지표의 합격선을 등록하는 시점에
같은 커밋에서 계산한다.

여기서 등록하는 것은 **지표의 정의 · 대조군 · 채점 절차**이고 **숫자가 아니다.**
"""

# ─────────────────────────────────────────────────────────────────────────────
# 지표 — 넷을 검토해 셋을 등록하고 하나를 기권했다
#
# 단일 지표는 게이밍된다(R-29 §대응2). 재발률만 재면 재발을 재정의하는 압력이 생긴다.
# 그래서 여럿을 두고, **못 재는 것은 "대조 불가"로 1급 기록한다**(§대응3).
# ─────────────────────────────────────────────────────────────────────────────

[[outcome.metric]]
id = "M1"
name = "재발 검출률"
status = "등록"
definition = """
`corpus/tasks/recurrence.toml` 이 고정한 재발 사례 N건 각각에 대해, **그 커밋의 부모
스냅샷에서** 해당 좌표로 `touch` 를 돌렸을 때 `rule_that_should_have_fired` 에 대응하는
결박이 **점진 회상 상한 안에** 나오는가. 값 = 나온 건수 / N.
"""
corpus_available = "n = 5 (recurrence.toml의 [[case]])"
data_source = "corpus/tasks/recurrence.toml · ditto @ aded7ce7"
arm_a = "역사 그 자체 — 도구 없이 실제로 일어난 일"
arm_b = "같은 좌표·같은 스냅샷에서 palimpsest의 `touch`"
retro_executable = true   # 유일하게 arm B를 회고로 돌릴 수 있는 지표다
caveat = """
**arm A의 재발률이 5/5인 것은 측정이 아니라 선정 규칙의 산물이다.**
사례를 '재발한 것'이라는 조건으로 골랐으므로 arm A는 정의상 전건 재발이다
(종속변수 위에서 표본을 고른 것).

따라서 **이 지표는 효과 추정치가 아니라 검출률이다.** "palimpsest를 썼으면 재발이
n% 줄었다"로 읽으면 안 되고, "재발이 일어난 그 순간에 규칙이 눈앞에 왔는가"로만 읽는다.
이 문장을 지표 정의에 붙여 두는 것이 오독을 막는 유일한 장치다.
"""

[[outcome.metric]]
id = "M2"
name = "계획 이탈률"
status = "등록"
definition = """
한 작업 단위에 대해 **착수 시점에 선언된 좌표 집합** D 와 **완료 시점의 실제 변경 좌표
집합** A 가 있을 때, 이탈률 = |A ∖ D| / |A|.
선언이 없으면 그 단위는 분모에서 제외하고 **제외 건수를 함께 보고한다**(조용히 빼지 않는다).
"""
corpus_available = """
n = 17 — ditto 워킹트리에서 D(autopilot 그래프의 `change_surface`)와
A(`record.json` 의 `changed_files`)가 **둘 다 비어 있지 않은** 작업 단위.
(autopilot 그래프 보유 54건 중 17건. 작업 단위 총수는 146건)
"""
data_source = "ditto — .ditto/local/work-items/<wi>/autopilot.json + .ditto/work-items/<wi>/record.json"
arm_a = "ditto의 과거 17건 — 회고로 계산 가능"
arm_b = "**전향적 실행이 필요하다.** 과거 작업을 palimpsest로 다시 돌릴 수 없다"
retro_executable = false
caveat = """
**D의 출처가 gitignored 워킹트리 산물이다.** `.ditto/local/` 아래에 있고 저장소에
커밋되지 않는다 — [T9](../docs/gates/preflight.md#t9--조달-가능성-실측)의 조달원,
[T10ⓑ](../docs/gates/preflight.md#t10--여정결함의-올라탈-곳)의 여정과 같은 형태다.
**이 작업본이 지워지면 M2의 arm A는 재현되지 않는다.** 측정 시점에 D·A 쌍을
`corpus/` 로 떠 두어야 한다.
"""
caveat_realized = """
**2026-08-11 — 발동했다. 17쌍 중 9쌍만 남았고 git 에 보존된 D 는 0건이다.**
남은 9쌍을 `tasks/plan-drift-pairs.toml` 로 떴다. **그 파일로 M2 를 계산하면 안 된다** —
생존 편향이 걸려 있다(그 파일 머리말 참조). arm A 의 n=17 은 이제 재현 불가다.

그리고 9쌍 중 3쌍이 D==A 완전일치다. D 가 A 에서 사후 기입된 것이라면 M2 는
아무것도 재지 않는다. **D 의 기입 시점 확인이 M2 를 쓰기 전의 선결 조건이다.**
"""

[[outcome.metric]]
id = "M3"
name = "수정 소요"
status = "등록 — 신뢰도 상한을 함께 낸다"
definition = """
한 결함에 대해 **도입 `Change` 시각**과 **해소 `Change` 시각**의 차. 분포로 보고하며
평균 하나로 접지 않는다.
"""
corpus_available = "도입 커밋 결박이 성립해야 계산된다 — [T10ⓐ] 표본에서 4/5, 임계 민감도 반영 하한 2/5"
data_source = "ditto — 모집단 U(149건)에서 도입 커밋을 blame으로 역추적"
arm_a = "ditto의 과거 결함 — 회고로 계산 가능"
arm_b = "**전향적 실행이 필요하다**"
retro_executable = false
caveat = """
**도입 커밋 결박의 신뢰도가 삭제 줄 수에 걸린다**([T10ⓐ](../docs/gates/preflight.md#t10--여정결함의-올라탈-곳)).
줄이 적으면 blame 과반은 신호가 아니고, 임계를 `>50%` 로 조이면 결박률이 4/5에서 2/5로 떨어진다.
**M3을 보고할 때는 그 건의 blame 과반 비율을 함께 실어야 한다** — 비율을 숨기면
수정 소요가 정밀한 값처럼 보인다.
"""

[[outcome.metric]]
id = "M4"
name = "리뷰 지적 수"
status = "**기권 — 대조 불가**"
definition = "한 변경에 대해 리뷰가 낸 지적의 건수"
corpus_available = "**없다**"
data_source = ""
arm_a = ""
arm_b = ""
retro_executable = false
abstain_reason = """
**코퍼스에 리뷰 트레일이 없다.**
· ditto의 PR은 **1건**이다 — 리뷰 코멘트를 계열로 볼 표면이 없다.
· 커밋 메시지에 '지적' 표기가 있는 것은 **3건**, 'finding' 은 **6건**이다.
· boxwood는 [T9](../docs/gates/preflight.md#t9--조달-가능성-실측)가 이미 분석 CI 부재를 실측했고,
  리뷰 산출을 보존하는 아티팩트도 0건이다.

n ≥ 5([P0-preflight §5 규칙 2](../docs/plan/features/P0-preflight.md))를 만족할 표본이
어느 코퍼스에도 없다. **대표값으로 채우지 않고 기권한다.**

이것을 등록에서 빼지 않고 `기권`으로 남기는 이유는 R-29 §대응3이다 —
**"대조 불가"는 1급 판정이고, 생략하고 통과로 처리하는 것이 가장 조용한 실패 경로다.**
"""

# ─────────────────────────────────────────────────────────────────────────────
# 대조군 — **정의는 여기 없다.** `arms.toml` 이 단일 진실이다 (T5, 2026-08-11)
#
# T11 이 이 자리에 A0·A1 을 임시로 정의해 두고 *"arms.toml 이 서면 옮기고 id 로만
# 참조해야 한다 — 안 옮기면 이 자리가 drift 의 시작점"* 이라고 잔여에 적었다.
# **T5 에서 옮겼다.** 이 절은 이제 참조만 한다.
# ─────────────────────────────────────────────────────────────────────────────

[outcome.arms]
source = "arms.toml"
uses = ["A0", "A1"]              # 결과 축(G7)이 쓰는 팔. 정의는 arms.toml `[[arm]]`
limitation = "arms.toml `[arm_limitation]`"
moved_in = "T5 — 이슈 #30"
note = """
능력 축의 팔(C1 문서 한 장 · C2 기성 코드그래프 · C3 기존 정적 분석)도 같은 파일에 있다.
**능력 축 통과가 결과 축 통과를 함의하지 않는다** — goals §0.1 이 "그 산출이 정확하다"를
통과 사유에서 뺀 것과 같은 이유이며, `g7_vs_g2` 와 같은 형태의 구분이다.
"""

# ─────────────────────────────────────────────────────────────────────────────
# 채점 절차
# ─────────────────────────────────────────────────────────────────────────────

[outcome.procedure]

step_1_freeze = "지표의 계산을 스크립트로 고정하고 그 스크립트를 `corpus/` 에 커밋한다. 계산을 손으로 하면 재현되지 않는다."
step_2_baseline = "arm A의 기준선을 계산한다. **그 지표의 수치 합격선을 등록하는 커밋과 같은 커밋에서 한다** — 기준선을 먼저 보고 나중에 선을 그으면 R-18이다."
step_3_blind = """
판정 입력에서 arm 라벨을 제거한 뒤 채점한다. 등록하는 사람과 판정하는 사람이 같다는
[R-18](../docs/plan/00-risks.md#r-18)은 닫히지 않으므로, **줄일 수 있는 것만 줄인다.**
"""
step_4_report = """
지표마다 **값 · n · 제외 건수 · 그 지표의 caveat** 을 함께 낸다.
값 하나만 내는 보고는 이 절의 위반이다.
"""
step_5_verdict = "**통과 · 반증 · 대조 불가** 셋 중 하나를 `docs/gates/` 에 적는다."

abstention_rule = """
아래 중 하나라도 해당하면 그 지표는 **대조 불가**로 적고 통과로 처리하지 않는다.
  · n < 5
  · arm A 또는 arm B가 성립하지 않는다
  · 지표의 caveat이 값의 해석을 뒤집을 만큼 크다 (예: M3의 결박 신뢰도가 하한으로 떨어진 경우)
"""

g7_vs_g2 = """
**G2 통과가 G7 통과를 함의하지 않는다**([R-29 §대응4](../docs/plan/00-risks.md#r-29)).
G2는 *다음 행동이 바뀌었는가*이고 G7은 *코드가 나아졌는가*다. 둘을 같은 표에 적되
**한 값으로 접지 않는다.** G1~G6은 그대로 서 있고 G7은 그 위에 선다.
"""

# ── 되돌림 조건 ──
falsified_if = """
G7의 지표를 하나도 등록할 수 없으면 **채점 기준을 [G2](../docs/plan/00-goals.md)로 되돌리고
되돌렸다는 사실을 적는다.**

**이번에는 해당하지 않는다** — 넷 중 셋을 등록했다. 다만 그 셋이 서 있는 조건이 얇다:
M1은 n=5, M2는 gitignored 산물 위에 서 있고, M3은 신뢰도 상한이 붙는다.
**조건이 무너지면 그때 되돌린다.**
"""

# ═════════════════════════════════════════════════════════════════════════════
# [s0] — S0 슬라이스 `pal symbols <파일>` 의 합격선
#
# 이슈 #37 · 위험 R-01(소유자가 Rust에 미숙하다 · 치명)
#
# **코드보다 먼저 등록한다.** 등록 시점에 palimpsest 에는 Rust 코드가 한 줄도 없다.
# 계획 §7.5 가 요구하는 것은 "코드보다 먼저"가 아니라 **"결과보다 먼저"** 이지만,
# S0 은 그 둘이 같은 자리다 — 결과가 곧 코드의 산출이기 때문이다.
#
# 판정 기록: docs/gates/S0-symbols.md
# ═════════════════════════════════════════════════════════════════════════════

[s0]
issue = 37
risk = "R-01"
registered_at = "2026-08-12"
registered_before_any_code = true
decided_by = "소유자"

judges = """
**추출 품질이 아니라 R-01 이다.** S0 이 묻는 것은 "소유자가 Rust 로 tree-sitter 를
몰 수 있는가" 하나이고, 대조의 일은 그 판정의 "완료"가 눈대중이 아니게 만드는 것이다.
대조가 없으면 S0 은 `돌긴 돈다` 로 끝나고 R-01 은 판정되지 않는다.

**추출 품질은 S0 의 질문이 아니다.** 계획 §5 의 오라클 표가 그것을 별도로 배정해 뒀다
— *"심볼 리콜 표본 — 손으로 센 선언 수 대 추출 수"*.
"""

# ─────────────────────────────────────────────────────────────────────────────
# 오라클 — 단일 백분율을 쓰지 않는 이유가 여기 적혀 있다
# ─────────────────────────────────────────────────────────────────────────────

[s0.oracle]
unit = "파일별 최상위 선언 수 벡터"
n = 1122
corpus = "corpus/manifest.toml [corpus.pin] 의 저장소 셋 @ 고정 SHA · .kt · git worktree 제외"

why_not_a_single_percentage = """
**T7 의 94.30% 는 이진값의 비율이다** — `선언을 하나라도 뽑을 수 있는 파일 1,058 / 1,122`.
파일에 최상위 선언이 17개 있는데 1개만 뽑아도 그 파일은 성공으로 집계된다.

그래서 **파일당 첫 선언 하나만 뽑는 고장 난 추출기도 1,058/1,122 를 정확히 재현한다.**
단일 백분율 대조는 그 버그를 못 잡는다. 벡터는 잡는다.

벡터가 잡고 백분율이 못 잡는 것 셋:
  · 파일당 첫 선언만 뽑는 버그
  · 선언 종류 하나를 통째로 누락 (총수로도 잡히나 어느 종류인지는 벡터만 안다)
  · 상쇄 오류 — N 건 놓치고 N 건 지어내기
"""

reference = """
**T7 이 발표한 집계값에 대는 것이 아니라, CLI 레퍼런스를 직접 다시 돌려 얻은 벡터에 댄다.**
T7 은 파일별 값을 남기지 않았으므로 재실행이 필요하고, 재실행에는 덤이 붙는다 —
