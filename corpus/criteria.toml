F03 §3.1 의 지우는 것 여섯을 **한 행씩** 시험한다. 등록 시점의 실측:

| 행 | 지금 |
|---|---|
| 공백·줄바꿈·들여쓰기 | **선다** — 리프 토큰만 모으므로 자동으로 사라진다 |
| 주석 | **선다** |
| 선택적 세미콜론 | **선다** |
| **후행 쉼표** | **안 선다** — `,` 가 리프 토큰이라 그대로 실린다 |
| **리터럴 따옴표 종류** (`'x'` ↔ `"x"`) | **안 선다** — 따옴표 토큰이 그대로 실린다 |
| 지역 변수명·파라미터명 | **선다 — 조건부**(`identity_grade == exact`) |

**넷이 서고 둘이 안 선다.** 이 표가 이 항목의 판정 대상이고, 안 서는 둘이
`prettier` 가 **가장 자주 바꾸는 것**이라 ① 의 100% 는 그것 없이 성립하지 않는다.

그리고 **지우지 않는 것 다섯**(리터럴 값 · 연산자 · 호출 대상 이름 · 멤버 이름 ·
타입 주석)도 각각 시험한다 — 지우는 쪽만 세면 *"전부 지운다"* 가 통과한다.
"""

# ③ De Bruijn — **판단하고 근거를 적는다.** 어느 쪽으로 고쳤는지가 산출이다
de_bruijn_judgment_recorded = true
de_bruijn_grounds = """
F03 §7 은 *"지역 변수 **De Bruijn 색인** 치환"* 이라 적고, §3.1 은 *"선언 순서 기반
**De Bruijn 유사** 색인"* 이라 적는다. 실물(`normalize_erasing`)은 **선언 순서의 자리
번호**로 치환한다.

**같은 것인지 판단하고 근거를 게이트에 적는다.** 그리고 —

> **문서를 코드에 맞추지도, 코드를 문서에 맞추지도 않는다.**

먼저 *"어느 쪽이 옳은가"* 를 판정하고, 그 판정에 따라 한쪽을 고친다. F02 가 §4 를
정정한 것(*"ERROR 안쪽도 순회한다"* → 실물 0 건 → 문서를 고쳤다)이 그 형태다.

**판정 기준은 낱말이 아니라 불변식이다** — 두 치환 방식이 §6.1 의 양방향 속성에서
다른 답을 내는 입력이 존재하는가. 존재하면 어느 답이 옳은지가 판정이고, 존재하지
않으면 낱말의 문제이므로 문서를 고친다.
"""

# ④ proptest 양방향
proptest_bidirectional_passes = true
proptest_grounds = """
F03 §6.1 의 둘을 그대로 세운다. **한쪽만 세우면 안 된다** — 문서 자신이
*"← 한쪽만 검사하면 「항상 같은 값 반환」도 통과한다"* 라고 적었다.

**생성기는 실물에서 온다.** 무작위 TypeScript 를 지어내면 문법에 맞는 것을 만드는 데
힘이 다 가고 정작 변형이 얕아진다. 코퍼스의 실제 선언을 씨앗으로 삼고 **변형을**
무작위화한다.
"""

# ⑤ 객체 리터럴 키·구조분해 이름을 지우지 않는다 (§4.2) ★
object_literal_keys_preserved = true
object_key_grounds = """
**★ 반대 방향이고, 등록 시점에 이것이 깨져 있다.**

F03 §4.2 가 *"지역 변수명을 지웠는데 그 이름이 계약인 경우(구조분해·객체 리터럴 키) —
객체 리터럴 키·구조분해 이름은 **지우지 않는다**(외부에서 보이는 형태)"* 라고 적었다.

실물에서 `scopes.rs` 는 `shorthand_property_identifier`(`{ a }` 의 `a`)를 **값 참조로
센다**, 그리고 그것이 `exact` 심볼 안의 지역이면 정규화가 **지운다.** 그러면

```
function f() { const alpha = 1; return { alpha }; }
function f() { const beta  = 1; return { beta  }; }
```

**둘이 같은 digest 를 갖는다** — 밖에서 보이는 객체의 키 이름이 다른데도. R-22 가
경고한 *"서로 다른 코드가 같은 digest"* 의 정확한 형태이고, **이 기능의 문서가 스스로
지목해 둔 자리다.**

**참조로 세는 것 자체는 옳다** — `{ a }` 의 `a` 는 값 참조가 맞다. 틀린 것은 **그것을
지우는 것**이다. 해소는 그대로 두고 정규화에서만 보호한다.
"""

# ⑥ 두 언어에서 정규화가 갈리지 않는다
normalization_is_language_independent = true
language_independent_grounds = """
`pal-extract::parse` 가 두 언어의 정규형을 **같은 함수**로 만든다(모듈 주석 —
*"언어마다 따로 쓰면 두 언어의 `body_digest` 가 서로 다른 규칙 위에 서게 되고, 그러면
같은 리팩터가 한 언어에서만 결박을 `stale` 로 만든다"*).

**이 기능이 그것을 깨지 않는다.** 후행 쉼표와 따옴표는 두 언어에 다 있으므로 공통
자리에 선다. **Kotlin 산출이 움직이는 것이 정상이고**, 움직인 것을 목록으로 적는다.
"""

on_failure = """
어긋난 것을 **전부** 목록으로 — 불변율이면 **어긋난 (파일, 심볼, 변형) 삼중쌍**을,
표의 행이면 어느 행이 왜 안 서는지를. **건수만 적는 것은 위반이다.**

**그리고 ① 이 100 이 아니면 그 자리에서 멈춘다.** ②·③·④ 를 먼저 채워 넘어가지 않는다.
"""

[f03.2.does_not_prove]
not_r07_closed = """
**[R-07](../docs/plan/00-risks.md#r-07)이 여기서 닫히지 않는다.** ① 이 100 이어도 그것은
**우리가 가한 변형**에 대한 값이다. 실 이력의 거짓 양성률은 ② 로 기록되고 **그 합격선은
F09 에서 확정된다** — 이 구별이 없으면 이 계획은 F03 에서 영구히 멈춘다(F03 §6.2).
"""
not_semantic_equivalence = """
**의미 등가를 보증하지 않는다.** F03 §4.2 의 그대로 — `foo(CONST)` 에서 `CONST` 의 값만
바뀌면 이 심볼의 digest 는 안 움직인다. **이 기능이 거르는 것은 「텍스트만 변했다」까지**
이고 나머지는 결박 반경(F09)의 문제다.
"""
not_kotlin_local_erasure = """
**Kotlin 에서 지역 이름이 지워지지 않는다.** L1 이고 `identity_grade` 가 `ordinal` 이다.
그러므로 ① 의 「리네임」 변형은 **TypeScript 에서만** 재어지고, boxwood 셋에서는 나머지
변형만 재어진다. 그 비대칭을 게이트에 적는다.
"""
not_tsx = """
**`.tsx` 는 여전히 잘못된 문법으로 읽힌다**(F02 가 넘긴 빚 · 두 코퍼스에 0 개).
그 파일들에서 정규화가 무엇을 하는지 이 조각은 답하지 않는다.
"""

