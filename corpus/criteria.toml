    정하는 것이지 캐시가 정하는 것이 아니다. 그래서 ⑦ 은 시나리오마다 **정확한 등식**을
    건다(미스 = 바뀐 파일 수). 등식은 반증 가능하고 코퍼스에 안 휘둘린다

**이 판단을 에이전트가 했다는 사실을 게이트에 적는다**([R-18]).
