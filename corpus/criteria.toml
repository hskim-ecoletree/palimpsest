  3. **★ 자동 적용 경로가 존재하지 않는다.** 신호를 받아 결박을 고쳐 쓰는 함수가
     `pal-intent` 에 없다

**정확도 ≥ 90% 는 여기서 판정하지 않는다** — 아래 [`f03.3.abstain`].
