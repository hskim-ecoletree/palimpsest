key_correction = """
**① 키가 기능 문서와 다르다. 그리고 코드 쪽이 옳다. 할 일은 문서를 고치고 값을 재는
것이다.**

F04 문서 §2 는 `(blob_hash, extractor_version)` 이라 적었다. 실물은 넷이다 —
`CacheKey::new(blob, version, path, declared)`. 근거는 코드에 이미 적혀 있고
**[ADR-0004] 가 그것을 정본화했다**: 캐시가 담는 것은 추출 결과가 아니라 분류 결과이고,
분류는 확장자·경로 패턴·`.gitattributes` 를 본다. 빈 `.kt` 와 `.gitkeep` 은 같은
blob(`e69de29`)이다.

**그러므로 문서를 정본으로 읽고 코드를 거기 맞추면 F01 이 고친 버그가 되살아난다.**
방향은 반대다 — **문서를 고치고, 치른 값을 잰다.**

깨진 약속은 **하나**다. 문서 §2 의 세 줄 중 둘은 그대로 참이고(브랜치 전환 ·
과거 커밋 · 워킹트리 편집 — 셋 다 경로가 안 바뀐다) **「파일을 옮기면 적중」만 깨진다.**
그 손실을 ⑦ 의 넷째 시나리오로 **재고 적는다**. 재지 않고 넘기면 문서가 약속한 것과
실물이 다른 채로 남는다.

**그리고 같은 파일 안에 모순이 하나 더 있다** — `CacheKey` 의 구조체 주석은 아직
*"`(blob 이름, 추출기 버전)`"* 이라 적고 `new` 의 주석은 넷이라 적는다. `cache.rs` 의
모듈 주석도 둘이다. **셋을 고친다.**
"""

corruption_disposition = """
**③ 손상 엔트리 처분이 문서와 코드가 반대다. 둘 다 근거가 있고, 답은 셋째다.**

  · **문서 §4**: *"역직렬화 실패 시 그 엔트리만 버리고 재계산 + 경고 로그"*
  · **코드**(`BlobCache::get`): *"깨진 캐시를 조용히 미스로 만들지 않는다 — 그러면
    손상이 성능 저하로만 보이고 영원히 발견되지 않는다"* → 지금은 `Err` 를 낸다

**축출이 생기면 문제가 한 겹 깊어진다.** 축출 뒤에는 **없는 엔트리가 정상**이 되고,
그러면 *"없다"* 와 *"깨졌다"* 가 같은 값으로 접히면 안 된다. 지금 코드는 그 둘을
`Ok(None)` 과 `Err` 로 가르지만, `Err` 는 **진행을 멈춘다** — 디스크 오류 하나가
대장 전체를 실패시키는 것은 1층이 *"순수 캐시"* 라는 문서 §3.1 의 판단과 어긋난다.

**등록하는 답: 조회 결과를 셋으로 가른다.** [ADR-0005](부재는 종류를 싣는다)를 조회에
그대로 적용한 것이다.

    Hit(T)        적중
    Miss          없다 — **정상이다**(축출·첫 회차)
    Corrupt{..}   깨졌다 — **사건이다.** 엔트리를 격리(따로 옮김)하고 재계산하되
                  그 수를 산출에 싣는다

문서(진행한다)와 코드(조용하지 않다)를 **둘 다** 지킨다. `CacheStats` 에 `corrupt` 가
늘고, 그것이 0 이 아니면 대장 화면에 보인다. **격리는 삭제가 아니다** — 깨진 바이트를
지우면 사후에 무엇이 깨졌는지 아무도 못 본다.
"""

capability_axis = """
**④ `FileGraph` 에 `Deserialize` 가 없고, 없는 데 이유가 있다. F02 가 넘긴 빚 셋이
한 문제다.**

넘어온 것 셋 — [F02-1](../docs/gates/F02-1-extractor.md) *"`Deserialize` 가 없다 →
능력 축을 키로"* · [F02-2](../docs/gates/F02-2-partial.md) *"회복 자리가 1층 캐시에 안
실린다"* · [F02-3](../docs/gates/F02-3-scope.md) *"스코프 체인이 안 실린다"*.
셋이 같은 자리다: **`Capable` 을 되읽으면 안 만든 능력이 위장한다**(F22-3 이 고친 병).

**등록하는 답: 「능력 축을 키로」다. 그리고 그 축을 손으로 유지하지 않는다.**

[ADR-0004] 가 요구한 것이 *"산출을 정하는 입력을 전부 키에"* 이고, **이 빌드가 무슨
능력을 만드는가는 산출을 정하는 입력이다.** 그것이 키에 있으면 다른 능력을 가진
빌드가 쓴 항목은 **애초에 다른 키**이고, 되읽기가 안전해진다.

**그런데 [ADR-0004] 자신이 경고한 자리가 여기다** — *"자라는 목록을 키에 손으로
유지하면 그 목록이 낡는 순간 같은 결함이 돌아온다."* 그래서 능력 목록을 **선언하지
않고 재현한다**: 언어마다 **빈 소스를 한 번 추출해** 어느 자리가 `NotBuilt` 로
나오는지 읽고 그 집합을 요약한다. 능력은 소스에 의존하지 않는 **빌드의 사실**이므로
빈 소스로 충분하고, 추출기가 스코프를 만들기 시작하면 **다음 실행이 즉시 안다.**

**형태가 바뀌므로 층 표시를 올린다**(`pal2` → `pal3`) — [ADR-0004] 가 정한 그대로다.
**`EXTRACTOR_REV` 는 올리지 않는다**: 바뀌는 것은 키의 형태이지 추출 산출이 아니다.
F03 의 `coordinate_shift` 가 한 판단의 **정확한 반대 방향**이고 같은 규칙의 두 얼굴이다.

**그래서 이 기능은 골든을 하나도 움직이지 않아야 한다**(⑪). 움직이면 능력 축이 산출로
샌 것이다.
"""

numeric_targets = """
**⑧⑨ 적중률·크기·벤치의 목표값을 어디까지 합격선으로 거는가 — 소유자가 프롬프트 밖에
남긴 긴장이고, 착수 세션이 판단해 여기 적는다.**

F04 문서 §6 은 셋을 적어 두었다: **파일당 2KB(압축 후)** · **콜드 10³ 30초** ·
