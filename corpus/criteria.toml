judges = """
**질의가 자기가 못 본 것과 자른 것을 함께 낼 수 있는가. 그리고 2층에 원본이 없는가.**

두 문장이 아니라 하나다. 이 기능이 자체 인덱스를 만드는 **유일한 결정적 이유**가
[스택 §2.3](../docs/plan/00-stack.md) 에 적혀 있다 — *"질의 도중 잘라내고 **얼마나 무슨
이유로 잘랐는지 응답에 실어야** 한다. `LIMIT` 은 그것을 표현하지 못한다."* 그러므로
이 기능의 산출은 「빠르다」가 아니라 **「잘랐다고 정확히 말한다」** 이다.

그리고 그 주장이 성립하려면 2층이 **캐시여야 한다.** 2층에만 있는 값이 하나라도 있으면
*"자체 구현의 최대 비용(마이그레이션·백업)이 0"* 이라는 §2.3 의 네 번째 근거가 무너지고,
그 순간 이 기능은 **자기가 고른 저장 기술을 자기가 정당화한** 것이 된다.

이 기능이 거짓말하는 방향은 셋이다:

  · **덜 자른 척** — 자르고 안 적는다. `Elision::none()` 이 강제이므로 *"명시했다"* 는
    이미 서 있지만 **명시한 값이 정확한가**는 아직 아무도 안 쟀다
  · **늘 자르는 척** — 반대로 자르지 않아도 되는데 자르고 적으면 ①이 통과한다.
    그래서 **넉넉하면 절단 0** 이 짝으로 선다
  · **원본을 2층에 남기기** — 색인 하나를 파생이 아닌 실체로 만들면 재구축이 그것을
    지우고, **재구축 등가성 검사는 그 상태에서도 통과한다**([R-21]). F04 가 그 형태를
    한 번 잡았고(옛 판이 *"그 외 출처는 복원되지 않는가"* 였다) 여기서 **결박 색인**이
    같은 자리에 선다

**F05 가 끝나면 무엇이 도는가**(문서 §0): `ledger.snapshot` · `symbol.resolve` ·
`symbol.contains` · 파일 **내** 호출 관계. 파일 경계를 넘는 질의는 빈 답이 아니라
**미해소로 정직하게** 답한다 — 그것이 이 제품의 정상 상태다.

[R-21]: ../docs/plan/00-risks.md#r-21
"""

