promotion_shape = """
**승격은 필드를 고쳐 쓰는 것이 아니다. 승격 함수가 새 결박을 낳고 `inferred` 제안은
남는다.** 문서 §3.3 · §4(*"대응이 안 되면 **타입으로 강제(승격이 새 노드 반환)**"*).

**절반이 이미 타입이다** — `Producer::Agent.fits(p)` 가 `Provenance::Inferred` 에만
참이고(`graph.rs`), `Provenance` 에 setter 가 없다. **없는 절반이 승격이다.**

### 가. `promoted_by` 를 **새 노드**에 싣는다 — 문서의 문장을 여기서 가른다

문서 §3.3 은 *"원본은 `promoted_by` 와 함께 남는다"* 라고 적었고 그것은 두 가지로
읽힌다. **여기서 가르고 근거를 적는다:**

  · **원본에 쓰면 원본이 변한다.** `graph.rs` 가 *"고쳐 쓰는 경로가 없는 것 자체가
    세탁 방지의 구현 형태"* 라고 적었다. 승인이 원본을 만지면 그 문장이 깨진다
  · **§3.3 의 목적 ②가 새 노드 쪽을 요구한다** — *"**원래 누구의 추론이었는가**가
    계보에 남아야 한다"* 는 `asserted` 쪽에서 `inferred` 를 **가리켜야** 성립한다.
    원본에 적으면 결박에서 출발해 계보를 못 읽는다
  · **목적 ①(되돌릴 수 있다)은 새 노드를 지우면 성립한다** — 원본이 안 변했으므로

**그러므로 `Binding` 에 `promoted_by` 를 더하고, 원본은 손대지 않는다.**

### 나. **`Option` 이 아니다** — `xtask check` 의 「선택 필드 금지」가 막는다

이 빌드에 선택 필드가 **0** 이다(검사 9 · `pub struct` 86 개). 그러므로:

    pub enum PromotedBy {
        Hand,                                   // 사람이 이름으로 직접 걸었다
        Proposal { item: EntityId, signal: … },  // 문서 조각의 제안을 승인했다
    }

**[ADR-0005] 의 형태다** — 부재가 자기 종류를 진다. 그리고 이것이 **④(승인 없이
`asserted` 가 되는 경로 부재)를 타입으로 세우는 자리**다: 결박이 서는 길이 **둘뿐**이고
둘 다 사람의 행위다. 셋째 길이 생기면 열거를 늘려야 하고, **늘리는 커밋이 사람에게
보인다.**

