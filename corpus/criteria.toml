**그러므로 이 조각이 지는 것은 신호를 계산하는 데까지다.** 승인 흐름도 적용도 F09 다.

**합격선 셋**:
  1. `orphaned` 가 된 심볼에 대해 **같은 `body_digest` 를 가진 새 심볼**을 후보로 낸다
  2. **★ 후보가 없으면 0 을 낸다.** 억지로 이름 유사도로 채우지 않는다 — 채우면 그것이
