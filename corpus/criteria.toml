[f03.3.oracle]
unit = "재배치 앞뒤의 결박 상태 + 골든 스냅샷의 차이"
corpus = "ditto @ aded7ce7f88f · boxwood 셋 — 그리고 우리가 만든 이동"

why = """
**여기에도 바깥 정본이 없다.** *"이 심볼이 저 심볼로 옮겨간 것인가"* 를 말해 줄 표는
없다 — 있으면 그것이 곧 제품이다.

그래서 오라클을 **두 방향의 불변식**으로 잡는다:
  · **흡수된다** — 별칭이 걸린 재배치에서 결박이 살아남는다
