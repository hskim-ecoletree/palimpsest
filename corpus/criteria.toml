[F09 게이트](../docs/gates/F09.md) §8 이 스스로 적었다 — *"`approve_batch` 와 시험 넷은
서 있고 거부 규칙이 검사된다. **그러나 코퍼스 규모의 대규모 이동에 대고는 안 쟀다.**"*
**F10 이 그 함수를 처음 규모로 부른다**(같은 파일의 조각들을 묶는다 · 문서 §4).

**하한**: 거부가 **1 건 이상** 나야 한다. 0 이면 그 함수는 이 코퍼스에서 **아무것도
안 가린 것**이고, 그러면 *"일괄 승인이 옳은 것만 승인한다"* 가 **공짜로 통과한다.**
