judges = """
**존재하는 것을 빠짐없이 뽑고, 못 뽑은 자리를 값으로 남기는가.**

F02 문서 §1 이 적었다: *"무엇이 존재하는가가 없으면 아무것도 없다."* 그런데 이 저장소가
이미 판정해 온 형태로 다시 적으면 한 문장이 더 붙는다 — **빠뜨린 것을 빠뜨렸다고 적지
않으면, 빠짐없이 뽑았는지를 아무도 물을 수 없다.**

그래서 이 기능의 가장 좋은 증거는 심볼 수가 아니라 넷이다:
  · 손으로 센 표본과 추출 심볼이 맞는가 (골든은 *변하지 않았음*만 말한다 — F02 §6)
  · 깨진 파일에서 건진 것과 못 건진 자리가 **둘 다** 산출에 있는가
  · 스코프 해소에 실패한 심볼이 `ordinal` 로 **내려앉는가** (언어 등급이 그것을 가리지 않고)
  · 같은 입력이 같은 산출을 내는가

넷은 답이 서로 독립이다. 그것이 이 기능을 쪼갠 이유다.
"""

why_split = """
**넷으로 쪼갠다.** [`f22`].`why_split` 의 기준 둘을 그대로 댄 결과이고, **F01 과 반대
결론이 나왔다.** 그 차이를 적는 것이 이 항목의 절반이다.

**기준 ① — 완료 체크리스트가 슬라이스 하나보다 큰가: 그렇다.**
F02 문서 §7 은 **11 항목**이고, 실물을 대 보면 **선 것이 사실상 0 이다**(마지막
*"(후속) Kotlin"* 만 부분). F01 은 10 중 다섯이 이미 서서 **남은 것이 여섯**이었고 그래서
