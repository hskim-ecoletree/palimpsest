mutation_grounds = """
**`[f10.1.pass].mutation_kinds` 가 다섯을 등록했는데 `f10-verify.py` 가 안 센다** —
F10 이 넘긴 것 중 **유일하게 이슈로도 안 적힌 것**이다. **여기서 세운다.**

⚠ **신호를 줄였으므로 「무엇이 바뀌어야 하나」가 달라진다. 옛 표를 고치지 않고 다시 적는다:**

| 변형 | 무엇이 바뀌어야 하나 | **안 바뀌어야 하는 것** |
|---|---|---|
| **헤딩 텍스트** | 그 조각의 **앵커**와 개체(새 개체가 생긴다) | 다른 조각 전부 |
| **산문 한 줄** | 그 조각의 **본문**만 | 앵커 · 개체 · **좌표 후보** |
| **코드 블록 안의 경로** | 그 조각의 **후보**(확정은 안 된다 — 거리가 있다) | 본문 밖 · 다른 조각 |
| **인라인 코드 스팬의 이름** | 그 조각의 **후보**(확정은 안 된다) | 앵커 · 개체 |
| **프론트매터의 `grounds:`** | 그 문서 첫 조각의 **확정 좌표** ← 거리 0 이라 확정된다 | 나머지 조각 |

★ **표에서 셋째·넷째가 「후보」로 바뀐 것이 이 절의 설계가 실물에서 확인되는 자리다** —
경로나 이름을 바꿔도 **확정이 안 생기면** 거리 있는 신호가 정말 확정을 못 하는 것이다.

★ **그리고 「안 바뀌어야 하는 것」이 이 표의 절반이다** — 산문을 고쳤는데 좌표 후보가
움직이면 **자연어를 보고 있다는 뜻**이고 `[f10.pass]` ②(유사도 금지)의 실측 반증이다.

**하한**: 변형마다 **바뀐 파일 ≥ 1 · 바이트 차이 ≥ 1.** 0 이면 **그 자리에서 멈춘다.**
"""

