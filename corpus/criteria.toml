  2. **변형기를 우리가 만들지 않는다.** ① 의 합성 포매팅은 `prettier` 다 —
     F03-2 가 쓴 것과 같은 것이고, *"이 코퍼스가 실제로 쓰는 포매터"* 다
  3. **표본 선정을 측정보다 먼저 등록한다.** 실 이력 20 건을 **고르는 규칙**이
