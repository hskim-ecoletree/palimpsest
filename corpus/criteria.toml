self_judged = """
[R-18](../docs/plan/00-risks.md#r-18)(게이트를 스스로 판정한다 · 구조적·영구)이 그대로
걸리고, **이 기능에서 F05 와도 F06 과도 모양이 다르다.**

F05 는 바깥 오라클(SQLite CTE)을 댈 수 있었고 F06 은 *"댈 바깥이 없다"* 였다.
**여기는 바깥이 있는데 그것이 사람의 판단이다** — *"이 커밋 뒤에도 이 메모가 유효한가"*
는 어떤 표도 답해 주지 않는다. 그리고 **그 판단을 하는 것도 에이전트다.**

줄이는 방법 일곱:

  1. **합격선을 재기 전에 확정한다.** 이 기능에서 가장 무거운 자리다 — 거짓 양성률과
     `Undeterminable` 비율은 **값을 보고 정하면 게이트가 아니다.** `[f09.pass]` 가
