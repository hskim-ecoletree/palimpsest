  · **재결박 제안** — `propose`·`propose_with_shape`·`MatchSignals` 가 **있다**(F03-3) ·
    **일괄 승인이 없다.** 문서 §8 이 *"이 기능이 유일한 소유자"* 라고 적었다
  · **노드·엣지 타입을 데이터로** — 스키마는 이미 파일이다(F22-1 · `schema/graph.toml`) ·
    **`EntityKind` 등록형이 없다**

**없다 (여덟)**: `Undeterminable`+사유 4 · 커밋 시각 동반 · `Radius` 4종 + 예산 거부 ·
증분 상태 갱신 · `EntityId`/`EntityKind` · 일괄 승인 · `binding.status` 질의 ·
거짓 양성률 합격선 · 반경별 벤치.

**딸린 것 하나** — F03-3 이 `propose_with_shape` 에 *"이름과 컨테이너를 함께 저장해 두면
후보가 좁아진다. **그 저장은 F09 의 결박 스키마가 정한다**"* 라고 적어 두었다.
`[f09.3]` 이 그 자리다.
"""

# ─────────────────────────────────────────────────────────────────────────────
# ① 경계 — **등록에서 가른다. 서로를 가리키면 아무도 안 세운다**
# ─────────────────────────────────────────────────────────────────────────────

freshness_boundary = """
**`CodeFreshness` 여섯 중 F09 가 세우는 것은 넷이다. 나머지 둘의 소유자를 여기서
가른다** — `[f05].envelope_boundary` 와 같은 자리이고, 같은 실패를 막는다:
**서로를 가리키면 아무도 안 세운다.**

| 변형 | 처분 | 근거 |
|---|---|---|
| `Live` · `Stale{triggered_by}` · `Orphaned{missing}` | **선다** (이미) | S3 |
| **`Undeterminable{reason}` + 사유 넷** | **F09 가 세운다** | 순수하게 이 기능의 것이다 |
| `Pending` | **안 세운다** | 아래 ⓐ |
| `StaleDerived{via}` | **안 세운다. 그러나 문서가 물은 것에는 답한다** | 아래 ⓑ |
| `Lineage::Superseded{by}` | **세운다 — 픽스처가 산출한다** | 아래 ⓒ |

**ⓐ `Pending` 을 안 세우는 근거 — 타입이 그것을 만들 수 없다.**

`Pending` 은 *"좌표가 아직 없다"* 이다. 그런데 `Binding` 은 `target: SymbolId` 를
**요구**하고, 그것이 F03 §3.3 이 **타입으로** 세운 것이다 — *"`Unavailable` 에는 실린
좌표가 없으므로 L0 에서 결박을 시도하는 코드가 컴파일되지 않는다."*
**좌표 없는 결박은 이 빌드에서 타입상 존재할 수 없다.**

`Pending` 이 태어나려면 `subject` 만 있고 `target` 이 없는 결박(계획 항목에 건 결박)이
있어야 하고, 그것은 **F10(문서 인입)·F12** 의 것이다. 지금 세우면
[ADR-0012] 가 금한 형태다 — **짝이 없는 이름**이고, 그 변형에 대해 *"있는데 안 나온다"*
가 된다. `binding.rs` 의 머리 주석이 이미 같은 판단을 적어 두었다.

**ⓑ `StaleDerived` — 합치지 않는다. 그리고 미룬다. 그러나 §2 가 물은 것에는 답한다.**

F09 문서 §2 가 *"둘을 합치는 것은 F09 의 몫이다"* 라고 적었다. **합치지 않는 것이
답이고, 그 근거를 적는 것이 F09 의 몫을 다하는 것이다.**

  · **모집단이 다르다.** `NodeFreshness`(F22-4)는 **그래프 노드**(`NodeKey`) 위에 서고
    `CodeFreshness` 는 **결박** 위에 선다. 합치면 `NodeFreshness` 에
    `Orphaned`·`Undeterminable` 이 딸려 들어가고 **F22-4 의 불변식 8 의 모집단이 바뀐다.**
    남의 게이트의 판정을 움직이는 것이고, 한 줄이 싸다는 이유로 해서는 안 된다
  · **`NodeFreshness::Stale` 에 `triggered_by` 가 없는 것은 빠뜨린 것이 아니다** —
    노드에는 감시 집합이 없다. 합치면 한쪽이 영원히 빈 자리를 진다
  · **미루는 근거**: 결박의 **파생 입력을 주는 것이 이 빌드에 없다.** `cascade` 는
    그래프 노드 위에서 돌고 결박의 `subject` 는 아직 그 그래프의 노드가 아니다
    (의도층 노드는 F12). 세우면 `Pending` 과 같은 「있는데 안 나오는」 자리다

  · ★ **그러나 §2 가 물은 질문에는 여기서 답한다** — *"파생 노드의 입력 좌표가 **사라진**
    경우가 `stale-derived` 인지 `orphaned` 인지"*:
    **`Orphaned` 다.** 근거는 **기계가 닫을 수 있는가**이다. `cascade.rs` 의 머리 표가
    이미 갈라 두었다 — `StaleDerived` 는 *"대개 **기계** — 입력을 갱신하면 닫힌다"* 이고
    `Stale` 은 *"**사람** — 재판정 큐"* 다. **사라진 좌표는 기계가 못 닫는다** —
    갱신할 입력이 없다. 그러므로 사람을 부르는 쪽이고 그것이 `Orphaned` 다.
    **그 판정을 `NodeFreshness` 에 반영하려면 거기에 `Orphaned` 를 더해야 하고 그것이
    F22-4 의 모집단을 바꾼다 — F22 후속으로 넘긴다.**

**ⓒ `Lineage::Superseded{by}` — 세운다. 만드는 흐름은 F12 다.**

`Pending`·`StaleDerived` 와 **다르게** 처분하는 근거 셋:

  1. **두 축의 독립성은 F09 의 설계 결정이다**(§2). 한 축이 값 하나뿐이면
     *"두 축이다"* 라는 주장이 **산출로 서지 않는다** — 그것이 §6 의 기각 사유
     (*"한 열거에 다섯이면 `superseded ∧ stale` 을 표현할 수 없다"*)의 짝이다
  2. **문서 §7 이 산출 방법을 이름으로 적었다** — *"두 축의 독립성 —
     `superseded ∧ stale` 조합이 실제로 산출되는가(**픽스처**)"*. 픽스처가 산출하면
     그 변형은 **거주 가능**하고, [ADR-0012] 가 금한 것은 **값을 만들 수 없는 이름**이다
  3. **값을 만드는 자리가 하나뿐이고 명시적이다** — `BindingStatus::evaluate` 가
     `lineage` 를 **인자로 받는다.** 결박에 **저장**하지 않는다(§4.4 가 대체를
     *"이벤트를 덧붙이는 형태"* 라고 적었고 그 이벤트는 F12 다)

**그래서 이 빌드에서 `Superseded` 를 만드는 경로는 픽스처뿐이고, 그 사실을 게이트에
적는다.** 승인 흐름이 F12 에서 서면 인자가 저장값이 된다 — **인자로 두었기 때문에
그때 열거를 안 건드린다.**
"""

# ─────────────────────────────────────────────────────────────────────────────
# ★ 이 기능에서 가장 무거운 판단 — **문서가 틀렸다**
# ─────────────────────────────────────────────────────────────────────────────

ordinal_is_not_undeterminable = """
**⚠ `ordinal` 등급은 `Undeterminable` 이 아니다. 문서 §2.1 과 어긋나고, 어긋난 것은
문서다.** 이것이 이 기능에서 가장 무거운 판단이고 **재기 전에 적는다.**

문서 §2.1 이 사유를 이렇게 적었다:

    IdentityGrade,   // L0 심볼 / ordinal 이라 digest 비교가 무의미

**`ordinal` 을 여기 넣으면 이 코퍼스 전체가 「판정 불가」가 된다.** 실물:

| 코퍼스 | 등급 | `ordinal` 비율 |
|---|---|---|
| portal-backend (Kotlin) | **L1 → 전부 `Ordinal`** (`ExtractGrade::L1.identity()`) | **100%** |
| ditto (TypeScript) | L2 · 심볼별 | 4,578 중 **325 = 7.1%** ([F03-1 게이트](../docs/gates/F03-1-identity.md)) |

**즉 문서대로 구현하면 Kotlin 코퍼스에서 `Undeterminable` 이 100% 다.** 그것이 정확히
DESIGN §15-42 가 경고한 *"지배하면 정직하지만 쓸모없다"* 이고, **S3 게이트가 이미 그
반증을 갖고 있다** — Kotlin 결박에서 `live → stale` 이 본문 변경으로 실제로 켜졌고
포매팅 변경에서 안 켜졌다(`s3-verify` ③).

**약한 것과 불가능한 것을 뭉개면 안 된다.** 갈라 적는다:

| | `ordinal` 이 뜻하는 것 | 처분 |
|---|---|---|
| 정체성 | 좌표가 **선언 순서**에 의존한다 — 재정렬하면 같은 `SymbolId` 가 **다른 심볼**을 가리킬 수 있다 | **약하다.** 숨기지 않고 **산출에 싣는다** |
| 정규화 | 지역 이름을 **안 지운다**(ADR-0006) — 리네임에 digest 가 움직인다 | **약하다.** 거짓 양성의 원천이고 `[f09.pass]` 의 비율이 그것을 잰다 |
| 비교 가능성 | 요약 값이 **있다** | **가능하다.** `Undeterminable` 이 아니다 |

**그러므로 `Undeterminable{IdentityGrade}` 는 「비교할 값이 아예 없을 때」만 켠다** —
즉 감시 집합 원소의 등급이 **`Unavailable`(L0)** 일 때다. 대상(`target`)은 타입상
`Unavailable` 일 수 없으므로(F03 §3.3) 이 사유는 **반경이 `symbol` 보다 넓을 때** 처음
하중을 진다.

**대신 `ordinal` 의 약함을 숨기지 않는다.** `binding.status` 산출에 **감시 집합 원소의
등급 분포**를 함께 싣는다. *"이 결박은 `ordinal` 좌표 위에 서 있다"* 가 산출에 남는
것이 **반경을 산출에 싣는 것과 정확히 같은 자리다**(§3) — 닫히지 않는 것을 선언으로
다룬다.

**처분**: **문서 §2.1 을 고친다.** 코드를 문서에 맞추지 않는다 —
`[f03.2.pass].de_bruijn_grounds` 가 적은 그대로 *"먼저 어느 쪽이 옳은가를 판정하고,
그 판정에 따라 한쪽을 고친다."* 여기서는 **실측이 문서를 반증한다.**

**이 판단이 틀렸다면 어떻게 드러나는가**: `ordinal` 좌표 위의 결박에서 거짓 양성률이
`exact` 좌표보다 **현저히** 높게 나오면, 그때는 *"비교가 가능하지만 못 믿는다"* 는
뜻이고 `Undeterminable` 이 아니라 **별도의 표시**가 필요하다는 신호다.
그래서 `[f09.4]` 가 **거짓 양성률을 등급별로 갈라서 잰다.**
"""

# ─────────────────────────────────────────────────────────────────────────────
# ② `WATCH` 를 어디에 둘 것인가 — F05 의 뒤집는 조건이 걸린다
# ─────────────────────────────────────────────────────────────────────────────

watch_placement = """
**`WATCH`(감시 원소 → 결박)를 **의도 저장소 안에** 세운다. 2층에는 안 세운다.**

**왜 지금 결정해야 하나**: 반경이 `symbol` 이면 `BOUND_BY`(대상 → 결박)와 `WATCH` 가
같아서 필요 없었다. **`Radius` 를 들이는 순간 둘이 갈린다** — 감시 집합에 대상이 아닌
심볼이 들어오고, 재추출이 그 심볼의 digest 를 바꿨을 때 **어느 결박을 다시 계산해야
하는지** 알 길이 `BINDING` 전수 훑기밖에 없어진다(문서 §4.1 의 증분 갱신).

**`[f05].bound_by_placement` 가 2층에 안 세웠고 뒤집는 조건을 명시했다:**

> 파일 간 조인 비용이 `[f05.3]` 의 벤치에서 실측으로 문제가 되면 그때 세운다 —
> **재생 경로와 같은 커밋에서.**

**★ 그 조건이 여기서 걸리지 않는다. 반대 근거가 「2층 복제」였기 때문이다.**
F05 가 든 근거 둘을 그대로 대 보면:

| F05 의 근거 | 의도 저장소 안에 두면 |
|---|---|
| `Projection::rebuild` 가 지우는데 **재생 코드가 없다** | **안 걸린다.** 2층 재구축이 의도 저장소를 안 건드린다 |
| [R-21] — *"다시 안 만드는 재구축"* | **안 걸린다.** 같은 파일이라 재생 경로가 `BINDING` 훑기 **하나**이고, 그 하나를 `import_jsonl` 이 이미 지난다 |

**즉 F05 의 결정을 뒤집는 것이 아니라 그 결정이 닿지 않는 자리다.** 2층에는 여전히
안 세운다. `[f05.2]` ④(*"2층의 모든 테이블이 1층+의도에서 재생되는가"*)의 모집단이
**안 늘어난다** — 그것이 이 배치가 F05 의 합격선을 안 건드린다는 증거다.

**그리고 재생 경로를 같은 커밋에서 세운다** — F05 가 요구한 형태 그대로:
`IntentStore::record` 가 `BINDING`·`BOUND_BY`·**`WATCH` 셋을 한 트랜잭션에서** 쓴다.
셋 중 하나만 쓰이는 경로가 있으면 그것이 곧 조용한 유실이다.

**이 결정이 고장 나면 어떻게 드러나는가**: `WATCH` 가 `BINDING` 과 어긋나도 결박 건수는
안 변하므로 **왕복 검사가 통과한다**(F04 가 발견한 그 형태). 그래서 `[f09.1]` 이
**`WATCH` 를 `BINDING` 에서 재계산한 것과 대조**한다 — 두 곳에 같은 것이 적혀 있으면
그 둘이 갈리는지를 세는 것이 유일한 검사다.
"""

# ─────────────────────────────────────────────────────────────────────────────
# ③ 구조적 선행 — **F06 이 실측해서 넘긴 결함**
# ─────────────────────────────────────────────────────────────────────────────

bind_erases_edges = """
**⚠ `pal bind` 가 `Projection::rebuild` 를 불러 2층의 엣지를 지운다. F09 가 고친다.**
[F06 게이트](../docs/gates/F06.md) §6-가-2 가 실측해서 넘겼다:

    pal query  → stitch   (파일 노드 · 엣지 · EXPORTS 전부)
    pal touch  → stitch
    pal bind   → rebuild  ← 엣지를 지운다 · built_for 를 빈 문자열로 갈아 끼운다
    pal doctor → rebuild  ← 같은 원인 · **소유자가 다르다**

**F09 가 고쳐야 하는 이유**: `Radius::Callers` 가 **엣지를 요구한다.** `pal bind` 가
엣지를 지우는 채로 반경을 세우면 **감시 집합이 조용히 빈다** — 그리고 빈 감시 집합은
언제나 `Live` 를 내므로 **①②③④ 를 전부 통과하면서 아무것도 안 지켜본다.**
이것이 이 기능에서 「대조가 꺼지는 형태」의 가장 위험한 얼굴이다.

**Tidy First — 구조적 변경을 자기 커밋으로 보낸다.** `rebuild` → `stitch` 는 산출을
바꾸는 동작 변경이므로 *구조적*이 아니다. 그러므로 순서는 이렇다:

  1. **구조적** — 두 표면이 2층을 세우는 자리를 **한 함수로 모은다**(F05 가 `2307069`
     에서 트랜잭션 여는 자리를 모은 것과 같은 형태). 산출 불변
  2. **동작** — 그 한 자리를 `stitch` 로 바꾼다. **엣지가 살아남는 것이 산출의 변화다**

**⚠ `pal doctor` 는 여기서 안 고친다.** 원인이 같고 **한 줄이 싸 보이지만**, 그 명령의
불변식 **모집단이 바뀌면 `[f22.4]` 의 판정이 움직인다.** 남의 게이트를 건드리는 것이
범위가 새는 가장 흔한 형태다 — **F22 후속으로 갈라 적는다.**

**이 수정이 고장 나면 어떻게 드러나는가**: `stitch` 로 바꿔도 엣지가 0 이면 아무것도
안 바뀐 것과 구별이 안 된다. 그래서 `[f09.1]` 이 **하한**을 박는다 —
`pal bind` **뒤에** 엣지 수가 **1 건 미만이면 멈춘다.** 그리고 `built_for_this_snapshot`
이 **true 로 남는지**를 함께 센다(F06 의 `--read-only` 가 없었으면 이 증상 자체가
안 보였다 — `pal query` 가 다시 `stitch` 를 돌려 복구해 버린다).
"""

# ─────────────────────────────────────────────────────────────────────────────
# ④ 카탈로그 — ADR-0012 의 첫 실전
# ─────────────────────────────────────────────────────────────────────────────

catalog_registration = """
**`binding.status` 를 카탈로그에 등록한다 — [ADR-0012] 가 *"각 기능이 자기 이름을 자기
종료 시점에 등록한다"* 라고 적은 그 첫 자리다.**

넷을 **함께** 움직여야 하고, 안 하면 `cargo xtask check` 의 「카탈로그 정합」이 막는다:

    pal_core::QueryName 에 변형 + summary/arg_names/arg_types/returns/introduced
    surface/queries.toml 에 절 하나
    cargo xtask query-doc  → docs/query-catalog.md 를 다시 낸다
    pal_query::NamedQuery + 실행 경로

**★ 이것이 F06 게이트의 사후 검증이다.** F06 이 세운 장치가 여기서 **처음 실제 하중을
진다.** 그래서 등록이 요구하는 것 하나:

> **넷 중 셋만 움직인 상태를 일부러 만들어 `cargo xtask check` 가 막는지 확인하고,
> 막으면 그 사실을 게이트에 적는다.**

이 저장소에 *"남이 세운 장치가 실제로 일했다"* 는 기록이 아직 적고, **그 기록이 다음
기능이 그 장치를 신뢰할 근거다.** 안 막으면 그것은 F06 의 **반증**이고 F06 게이트에
소급해 적는다.

**그리고 `binding.status` 는 질의 로그를 쓴다.** F06 이 *"`pal touch`·`pal doctor` 가
질의 로그를 안 쓴다"* 를 F17 로 넘겼는데, **새로 태어나는 이름이 그 공백을 물려받으면
안 된다.** 안 쓰면 `LogStatus::NotRecorded{SurfaceDoesNotLog}` 가 아니라 **그냥 빠진
것**이 된다.
"""

