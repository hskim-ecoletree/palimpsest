**「같은 심볼인가」와 「변했는가」가 서로 다른 축으로 서고, 둘 다 반대 방향에서
시험되는가.**

F03 문서 §2 가 *"둘을 분리한 것이 핵심이다"* 라고 적었다. 그 문장이 참이려면 두 값이
서로 다른 사건에 반응해야 한다 — 파일을 옮기면 `symbol_id` 만 움직이고, 포매팅만
바꾸면 **둘 다 안 움직인다.** 하나로 뭉치면 재결박 제안이 성립하지 않고([R-08]),
정규화를 안 하면 포매터 한 번에 결박이 전멸한다([R-07]).

그런데 이 저장소가 배운 것이 하나 더 있다 — **한 방향만 재면 아무것도 안 하는 구현이
만점을 받는다.** F02-3 이 그것을 *"A 만 보면 「항상 지운다」 가 통과한다"* 로 적었고,
F02-4 는 그 함정에 실제로 빠졌다(음성 대조가 공유 캐시로 꺼져 있었다). 그래서 이
기능의 판정 문장에 **「반대 방향에서」** 가 들어간다:

  · 정규화가 **지우는가** ↔ **안 지워야 할 것을 안 지우는가**(`ordinal` · 객체 리터럴 키)
  · 좌표가 **컨테이너로 갈리는가** ↔ **컨테이너가 같으면 순서를 바꿔도 안 갈리는가**([R-16])
  · 골든이 **움직인 것을 보이는가** ↔ **안 움직인 것을 안 보이는가**

**그리고 이 기능의 산출은 숫자가 아니라 「움직인 것의 목록」이다.** 좌표가 통째로
이동하는 것이 이 기능의 설계된 산출이므로(F03 §6.3), **건수만 적으면 회귀와 구별되지
않는다.**
"""

