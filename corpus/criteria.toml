# [f09.3] — 개체와 저장. **비코드 개체가 결박될 수 있는가**
#
# ⚠ 이 조각이 **결박의 스키마를 바꾸고 의도 저장소의 판을 올린다.** R-21 이 가장
# 무겁게 걸리는 자리다 — 이 제품에서 유일하게 재생 불가능한 데이터다.
# ═════════════════════════════════════════════════════════════════════════════

[f09.3]
judges = """
**비코드 개체가 결박될 수 있고, 판이 올라가도 옛 파일이 돌아오는가.**

문서 §4.3 이 *"지금 정하지 않으면 나중엔 마이그레이션이다. 비용이 지금은 0"* 이라고
적었다. **0 인 것은 개체가 아직 안 쌓였기 때문이고, 이 조각이 그 0 을 쓴다.**
"""

[f09.3.pass]

# ① EntityId + EntityKind 등록형
entity_kind_is_registry_not_enum = true
entity_grounds = """
**`EntityKind` 는 닫힌 열거가 아니라 등록형이다** — 문서 §4.3 이 근거를 적었다:
바로 아래 규칙이 *"노드·엣지 타입을 닫힌 열거로 하드코딩하지 않는다"* 인데
`Decision | … | Concept` 는 그 자체가 닫힌 열거이고, `Concept`(F18 · P3)을 미리
나열하는 것은 **"목록은 데이터"라는 결정을 코드로 부정하는 것**이다.

**코어가 부팅 시 등록하는 것**: `decision` · `plan` · `label` · `residual` ·
`scope-reduction`. **팩이 등록하는 것**: F18.

★ **반대 방향이 이 항목의 핵심이다**: **미등록 종류를 조용히 버리지 않는다.**
문서 §4.3 이 *"알 수 없는 종류의 결박 N건"* 으로 **보이게** 처리하라고 적었다.
검사: 등록되지 않은 `kind` 의 결박을 넣고 **① 결박·낡음 계산이 영향받지 않는지**
(그 계산은 `target` 과 반경만 쓴다) **② 표현에서 「알 수 없는 종류」로 세어지는지**를
각각 센다. 버려지면 반증이다.

**`cargo xtask check` 가 `EntityKind` 의 닫힌 열거화를 막는다** — 코어에
`enum EntityKind { … }` 형태가 생기면 CI 실패다.
"""

# ② 의도 저장소 판 올리기 — 왕복이 항등이다
jsonl_schema_version_bumped = true
roundtrip_identity_across_versions = true
schema_grounds = """
**`Binding` 에 `subject`·`radius` 가 생기면 판이 올라간다**(`JSONL_SCHEMA_VERSION` 1 → 2).

**2층은 스키마 버전이 없다** — 지우고 다시 만들면 되기 때문이다. **의도 저장소는 그
면제를 못 받는다**(F05 §2 · store.rs 머리). 그래서:

  · **판 2 의 왕복이 항등이다** — 내보내기 → 저장소 삭제 → 읽기 → **바이트로 같다**
  · ★ **판 1 파일을 읽을 수 있다.** 못 읽으면 그것은 유실이다 — 그리고 이 저장소에서
    **재생 불가능한 유일한 데이터**다([R-21])
  · ★ **판 2 파일을 판 1 코드가 읽으면 거부해야 한다** — `import_jsonl` 이 이미
    *"판이 다르다"* 로 거부한다. **그 경로가 살아 있는지 센다**

★ **반대 방향**: **내보내지 않은 것은 안 돌아온다**(`[f05.4]` ② 와 같은 형태).
그리고 **읽기는 더하기이지 바꿔치기가 아니다** — 파일에 없는 결박이 지워지면 반증이다.

**하한**: 왕복 표본의 결박이 **1 건 미만이면 멈춘다.**
"""

# ③ 재결박 일괄 승인 — 이 기능이 유일한 소유자
batch_rebind_approval = true
batch_grounds = """
**F03 은 제안 신호 계산까지이고 승인은 여기다** — 문서 §8 이 *"이 기능이 유일한
소유자"* 라고 적었다. `propose_with_shape` 가 이미 신호 셋을 낸다(F03-3).

**일괄의 단위는 「같은 경로 접두어 변경」이다** — 문서 §5 가 그렇게 적었다.

★ **반대 방향이 이 항목의 전부다**: **일괄 승인이 옳지 않은 것을 승인하면 반증이다.**
한 접두어 집합 안에 **본문 요약이 다른** 후보가 섞여 있으면 승인 대상이 아니다 —
F03 §5 가 기각한 *"의미가 다른 동일 코드에 잘못 붙는다"* 가 **일괄에서 N 배가 된다.**
검사: 섞인 집합을 일부러 만들고 **승인이 거부되는지** 센다.

**그리고 승인은 덧붙이기다** — 옛 결박을 지우지 않는다([R-21] · §4.4).
`pal-intent` 에 지우는 API 가 없다는 것이 그 대응이고 **이 명령이 그것을 안 깬다.**
"""
on_failure = """
어긋난 것을 **전부** 목록으로 — 왕복이면 **갈린 (결박 id, 필드)** 를, 일괄이면
**잘못 승인된 (옛 좌표, 새 좌표, 신호)** 삼중쌍을. **건수만 적는 것은 위반이다.**
"""

# ═════════════════════════════════════════════════════════════════════════════
# [f09.4] — 표면과 측정. **거짓 양성률이 합격선 안인가**
#
# 순서가 넷째인 이유: 앞 셋을 전부 요구한다. 그리고 **여기서 재는 값의 합격선은
# `[f09.pass]` 에 이미 등록돼 있다** — 재고 나서 정하지 않는다.
# ═════════════════════════════════════════════════════════════════════════════

[f09.4]
judges = """
**낡음이 켜져야 할 때 켜지고 켜지지 말아야 할 때 안 켜지는가 — 실물에서.**

앞 셋은 **장치**를 판정하고 이 조각은 **값**을 판정한다. 그리고 그 값의 합격선은
`[f09.pass]` 에 **재기 전에** 등록돼 있다.
"""

sample_selection = """
**표본 선정 규칙을 측정보다 먼저 등록한다** — 고르는 사람이 판정하는 사람과 같으므로
(R-18), 규칙을 먼저 고정하는 것이 줄이는 유일한 방법이다. `[f03.2.selection]` 과 같은
형태다.

**규칙:**

  1. 코퍼스 둘에서 **각각 10 건**, 합 **20 건**. 등급 축을 가르기 위해서다
     (`exact` = ditto · `ordinal` = portal-backend)
  2. 커밋은 **`--at <핀>` 에서 뒤로 세어 최신 순**으로 훑되, **결박된 심볼이 실린 파일을
     건드린 커밋**만 센다. 안 그러면 표본이 전부 「아무 일도 안 일어남」이 된다
  3. **머지 커밋을 뺀다** — 변경 집합이 부모에 따라 달라져 *"이 커밋이 무엇을 바꿨나"*
     가 하나로 안 정해진다
  4. **결박은 각 코퍼스에서 심볼 20 개에 건다.** 고르는 방법: 대장의 심볼을
     **`symbol_id` 사전순**으로 정렬해 **균등 간격**으로 뽑는다 — 우리가 고르지 않는다
  5. **판정은 결박마다 한 줄의 근거와 함께 게이트에 적는다.** 건수만 적는 것은 위반이다

**결과를 보고 이 규칙을 바꾸지 않는다.** 바꾸면 그 사실과 이유를 게이트에 적고,
**바꾼 뒤의 값은 통과의 근거가 될 수 없다.**
"""

[f09.4.pass]

# ① binding.status 질의 — 카탈로그 넷을 함께
catalog_moves_four_together = true
catalog_check_actually_blocks = true
catalog_grounds = """
**`binding.status` 가 상태 + 반경 + 무엇이 켰는가를 낸다** — 문서 §8.

**넷을 함께 움직인다**(`catalog_registration`): `QueryName` · `surface/queries.toml` ·
`cargo xtask query-doc` · `NamedQuery` + 실행 경로.

★ **그리고 이것이 F06 게이트의 사후 검증이다**: **넷 중 셋만 움직인 상태를 일부러 만들어
`cargo xtask check` 의 「카탈로그 정합」이 막는지 확인한다.** 막으면 게이트에 적는다 —
**남이 세운 장치가 실제로 일했다는 관측**이고 이 저장소에 그런 기록이 아직 적다.
**안 막으면 그것은 F06 의 반증**이고 F06 게이트에 소급해 적는다.

**그리고 이 이름은 질의 로그를 쓴다** — F06 이 F17 로 넘긴 공백을 **새 이름이 물려받지
않는다.**

**봉투를 진다** — 여섯 필드 전부. `[f05.pass]` 의 골든이 그것을 이미 센다.
"""

# ② 합성 포매팅 — 진행 불가. 값은 [f09.pass] 에 있다
synthetic_control_is_fresh_per_mutation = true
synthetic_control_grounds = """
**변형마다 작업 사본과 캐시를 새로 만든다** — F02-4 에서 공유 캐시가 대조를 껐고
`[f03.2].control_grounds` 가 그것을 합격선으로 올렸다. **여기서도 합격선이다.**

**그리고 변형을 `pal` 명령으로 하거나, 파일을 직접 만졌으면 그 변형이 실제로 먹었는지를
산출로 확인한다**(대조가 꺼지는 다섯째·열한째). 검사에 박는 것:
**바뀐 파일 수 · 바이트 차이 · 변형 뒤의 2층 엣지 수 · `built_for_this_snapshot`.**
"""

# ③ 등급별로 갈라 잰다
false_positive_split_by_identity_grade = true
split_grounds = """
**`exact` 좌표 위의 결박과 `ordinal` 좌표 위의 결박을 따로 적는다.**

`ordinal_is_not_undeterminable` 이 요구한 것이다 — 뭉치면 *"Kotlin 이라 높다"* 와
*"정규화가 샌다"* 가 **같은 숫자**가 되고, 그러면 이 값이 무엇을 재는지 알 수 없다.

**그리고 이것이 그 판단의 반대 방향이다**: `ordinal` 축의 거짓 양성률이 `exact` 축보다
**현저히** 높으면 *"비교가 가능하지만 못 믿는다"* 는 뜻이고, `Undeterminable` 이 아니라
**별도의 표시**가 필요하다는 신호다. **그때는 그 사실을 게이트에 적고 F09 문서에 되돌린다.**
"""

# ④ 반경별 비용 벤치
bench_by_radius = true
bench_grounds = """
**반경별 · 결박 수별로 잰다** — 문서 §7 · [R-24].

`[f05].criterion_decision` 이 `criterion` 을 안 들이기로 했고 **여기서 형태를 안 바꾼다** —
`#[ignore]` 로 두고 `cargo test --release -- --ignored` 로 돌린다.
**절대 시간이 아니라 비율과 선형성을 적는다**(기계에 의존하는 값은 합격선이 될 수 없다 ·
`[f04.pass].bench_ratio`).

**재는 것 넷**: `symbol` · `callers` · `closure(2)` · 증분 갱신. **두 규모**에서 재고
**회차 3 의 최솟값과 회차 간 분산**을 함께 적는다.

**합격선은 절대 시간이 아니라 이것이다**: **증분 갱신이 전체 재계산보다 빠르다.**
안 빠르면 `WATCH` 색인이 아무 값도 안 낸 것이고, 그러면 `watch_placement` 의 결정이
근거를 잃는다.
"""
on_failure = """
어긋난 것을 **전부** 목록으로 — 거짓 양성이면 **(코퍼스, 커밋, 결박, 왜 거짓인가)** 를
결박마다 한 줄로. **건수만 적는 것은 위반이다.** 그리고 ① 이 0 이 아니면 **그 자리에서
멈춘다** — ②③④ 를 먼저 채워 넘어가지 않는다(`[f03.2].on_failure` 와 같은 규율).
"""

