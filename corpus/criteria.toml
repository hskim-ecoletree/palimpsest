**세 갈래 중 하나를 골라야 하고, 고른다:**

| 갈래 | 결과 |
|---|---|
| 조용히 안 남긴다 | ❌ **F17 이 미조회를 과대 계상한다.** 이 제품이 고발하는 조용한 공백 그 자체다 |
