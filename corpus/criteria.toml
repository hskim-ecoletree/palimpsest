**이 검사가 고장 나면 어떻게 드러나는가**: 결박이 하나도 없으면 파일이 안 자라서
공짜로 통과한다. **결박을 넣은 뒤에 잰다.** 그리고 **먼저 옛 코드로 재서 110 바이트가
실제로 달라지는지 확인한다** — 안 달라지면 이 시험은 아무것도 안 고친 것이다.
"""

