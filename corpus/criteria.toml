judges = """
**문서가 실제로 좌표에 걸리는가. 그리고 걸리지 않은 것을 걸렸다고 하지 않는가.**

**「문서를 좌표에 건다」는 이 계획에서 말하기 가장 쉬운 문장이다.** 아무것도 안 거는
인입기도, 전부 거는 인입기도 그 문장을 만족한다. 그러므로 이 기능의 판정은 **한 방향의
숫자가 아니라 서로를 막는 다섯 방향**이다:

