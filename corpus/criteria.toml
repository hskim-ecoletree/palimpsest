    않는다. 문서 §3 의 표는 로드맵이지 이 파일의 부분집합이 아니다."*

**이 판단이 틀렸다면 어떻게 드러나는가**: 소비자가 `refs.callers` 를 부르고 종료 코드
1 을 받는데, **그것이 「없다」인지 「아직 안 만들었다」인지 구별되지 않으면** 이 판단이
틀린 것이다. 그래서 `[f06.1]` ④가 **모르는 이름과 미구축 능력의 답이 다른지**를 잰다.
