    ─────────────────────────────────────────────────────────────────────
    **실제로 느는 것 둘**                        pulldown-cmark · unicase
    워크스페이스 크레이트 수                      213 → 215
    proc-macro 0 · wasm 바인딩 0 · `getopts`·`html` 은 **기본 기능이라 끈다**

**판단: 들인다.** 근거 넷이고 **셋째가 가장 무겁다:**

