     상태처럼 읽힌다**
  4. **`introduced` 필드는 남긴다.** 여섯에 대해 값이 있고(F01~F05 · F22), 그것은
     로드맵이 아니라 **이미 일어난 사실**이다

**그러면 「26 개를 제공한다」로 읽히는 것을 무엇이 막는가** — 둘이 막는다:

  · **`pal query --list` 가 답하는 것과 아닌 것을 함께 낸다.** 아닌 것은 이름이 아니라
    **기능 번호와 능력 이름**으로 실린다(`CapabilitySet::not_built` — 지금 넷).
    이름을 안 적는 것이 요점이다 — 이름을 적으면 그것이 곧 스무 개의 빈 자리다
