fold_is_not_elision = """
**⚠ 접기는 절단이 아니다. 필드를 가른다 — 그리고 그것이 이 조각의 설계 결정이다.**

R-11 이 요구하는 것은 *"기본은 요약 한 줄, 전체는 `ledger.snapshot` 으로 뺀다.
**첨부 필수는 지키고 부피를 옮긴다**"* 다. F05 가 세운 [`Elision`] 은 **못 본 것**을
말한다. 둘은 다른 사건이다:

    Fold      값이 있다. 다른 질의로 옮겼다.   → **어느 질의가 펴는지**가 값이다
    Elision   값이 없다. 예산에 걸려 안 봤다.  → **어느 상한에 걸렸는지**가 값이다

**한 필드에 뭉개면** 소비자가 *"부피를 옮겼다"* 와 *"못 봤다"* 를 구별할 수 없고,
그 순간 `Elision` 이 F05 에서 지던 하중이 희석된다. 그래서 [`Fold`] 는 **[`Elision`]
과 같은 자격의 별도 필드**이고, [`Fold::none()`] 이 강제다(기본값을 두지 않는다).

**모집단이 이미 있다 — 만드는 것이 아니라 이름을 붙이는 것이다.** 지금 모든 봉투가
[`LedgerRef`] 를 싣는데, 그것은 대장 전체가 아니라 **요약 여섯 값**이다. 즉 **접기는
이미 일어나고 있고 그 사실이 산출에 안 실려 있다.** 그것이 이 조각이 닫는 구멍이다.

  · `ledger.snapshot` 의 답은 대장 자신이므로 **접힌 것이 없다**
  · 나머지 다섯은 대장이 접혀 있고 **`ledger.snapshot` 이 그것을 편다**

**이것이 하한이다** — 접힌 자리가 0 이면 `[f06.2]` 전부가 공짜로 통과한다.
"""

