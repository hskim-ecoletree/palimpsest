*"안 지웠다"* 가 공짜로 참이다.

**Tidy First**: 구조적 변경(두 표면이 2층을 세우는 자리를 한 함수로 모은다)을
**자기 커밋**으로 보내고, `rebuild` → `stitch` 를 그 위에 얹는다. 구조적 커밋에서는
**산출이 안 바뀌어야 한다** — `cargo test` 와 `f05-verify` 가 그 사이에서 그대로 돈다.
"""

