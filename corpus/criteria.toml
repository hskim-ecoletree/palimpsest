# [f05.4] — 의도 저장소 JSONL 내보내기/읽기
# ═════════════════════════════════════════════════════════════════════════════

[f05.4]
judges = """
**재구축 불가한 것이 밖으로 나갔다가 그대로 돌아오는가.**

문서 §2 의 넷째가 적었다 — *"2층은 캐시라서 자체 구현의 최대 비용(마이그레이션·백업)이
0 이다. **의도 저장소는 이 면제를 받지 못한다** — 거기만 스키마 버전과 JSONL 내보내기를
진다."* 그리고 §6 의 표: *"의도 저장소 손상 → **재구축 불가.** JSONL 내보내기에서
복구. 그래서 내보내기가 상시 유지된다."*

**상시 유지되지 않는 내보내기는 없는 것과 같다.** 그래서 이 조각의 판정은 「기능이
있다」가 아니라 **「왕복이 항등이다」** 이고, 그것을 CI 가 상시 돌린다.
"""

[f05.4.pass]

roundtrip_is_identity = """
**① 내보내고 지우고 읽으면 값이 그대로다.**

