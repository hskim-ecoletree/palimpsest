question = "[`s0.grammar`].`consequence` 의 틀린 문장을 `criteria.toml` 에 반영할 것인가"

decision = """
**반영한다. 단 지우지 않고 날짜를 달아 덧붙인다.**

틀린 문장은 이것이다:

> 최신이 곧 T7 이 쓴 그것이라 **문법 업그레이드로 고쳐질 수 없다.**

**앞부분은 참이고 뒷부분이 거짓이다** — upstream HEAD 가 곧 우리 핀인 것은 맞지만,
그것이 *"고쳐질 수 없다"* 를 함의하지 않는다. **포크가 여섯 있었고 다섯이 고쳤다.**
`consequence` 자신이 바로 다음 문단에서 포크 여섯을 세어 놓고도 그 결론을 냈다.

**형태는 `observing_correction` 의 선례를 그대로 쓴다** — 원문을 지우지 않고 아래에
`consequence_correction` 을 날짜와 함께 붙인다. 근거:

  · `criteria.toml` 은 **합격선의 사전 등록 증거**다. 지우면 등록이 사후 편집 가능한
    것이 되고, 그러면 이 파일 전체의 값어치가 사라진다
  · `observing_correction` 이 **결과 이전**에 고친 선례이고, 이번 것은 **결과 이후**다.
    그래서 같은 자리에 같은 형태로 붙이되 **그 차이를 명시한다** —
    이것은 *"등록을 고친 것"* 이 아니라 *"등록이 틀렸음을 등록에 적은 것"* 이다
  · 정정 전문은 [F02-2 게이트](../docs/gates/F02-2-partial.md) §5 에 이미 있고,
    여기서는 **가리키기만 한다.** 같은 것을 두 곳에 적으면 그것이 곧 drift 다
    (AGENTS.md 진행 규칙 4)

**[`s0.secondary`].`exposed_failures_73` 의 마지막 문장도 같은 병을 갖는다** —
*"문법 업그레이드로는 안 된다"*. 같은 형태로 붙인다.

**`[s0.grammar].judging` 은 건드리지 않는다.** S0 은 그 문법으로 판정됐고 그 판정은
끝났다. 새 핀은 `[g50]` 의 것이지 `[s0]` 의 것이 아니다 — **끝난 게이트의 등록값을
새 사실로 덮으면 그 게이트가 소급으로 다른 게이트가 된다.**
"""

