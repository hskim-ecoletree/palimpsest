**증분 경로가 이 조각에 있는 이유**: 1층 캐시가 이미 서 있고(S1), `FileGraph` 가 그
캐시의 값이 되는 순간 *"캐시에서 읽은 것"* 과 *"새로 뽑은 것"* 이 갈릴 수 있다.
ADR-0004 가 캐시 키에 경로와 선언된 언어를 넣은 것이 그 자리이고, **이 대조가 그
결정이 실제로 성립하는지 묻는다.**

증분 재추출 자체(`changed_between`)는 F05 다 — 여기서 대조하는 것은 **캐시 적중 경로와
미스 경로가 같은 답을 내는가**다.
