바뀌면 안 되고, 상태별 합은 여전히 997 이어야 한다. **제외는 파일을 없애는 것이 아니라
칸을 옮기는 것이다** — 합이 줄면 대장이 전수 분할을 잃은 것이고 그것이 이 제품의
정체성을 잃는 자리다(DESIGN §4).

**매니페스트가 없을 때 조용히 추정하면 `asserted` 와 추정이 같아 보인다.** 없으면
없다는 사실이 산출에 실려야 한다 — `Capable` 이 산출에 하는 일을 선언이 범위에 한다.
"""

# ⑤ 감지기 자신의 낡음이 실린다
detector_freshness_present = true
extractor_version_change_is_visible = true
head_move_is_visible = true
detector_check_is_constant_time = true
detector_grounds = """
**낡음 감지기 자신이 낡을 수 있다**(DESIGN §6.3 · F01 §4). 감지기가 3주 낡았으면
낡음 표시들도 3주 낡았다는 사실이 응답에 붙어야 한다.

`pal ledger` 화면의 마지막 줄이 지금 *"감지기 (이 빌드에 낡음 감지가 없습니다 —
F01 미구축)"* 이다. **그 줄이 값으로 바뀌는 것이 이 항목의 형태다.**

음성 대조 둘:
  · **추출기 버전을 바꾸면 그 사실이 드러나야 한다.** 안 드러나면 대장은 옛 추출기의
    산출을 새 것처럼 낸다 — 캐시 키에 버전이 들어 있는데 대장이 그것을 말하지 않으면,
    사용자는 자기가 보는 등급이 어느 추출기의 것인지 알 수 없다
  · **HEAD 가 움직이면 그 사실이 드러나야 한다.**

**상수 시간이어야 한다.** F01 §4 는 *"이 검사는 상수 시간(HEAD 비교)이므로 무한 후퇴하지
않는다"* 라고 적으면서 같은 문단에서 *"이후 커밋 수"* 를 필드로 요구했다 —
**커밋 수를 세는 것은 상수 시간이 아니다.** 이 자리는 문서 안에서 어긋나 있고,
어느 쪽으로 정정하든 **그 판단을 게이트에 목록으로 적는다.**
"""

# ⑥ 언어 인식 — 4단계가 실제로 켜는 것을 센다
recognition_stages_declared_vs_built = true
shebang_recognizes_gradlew = true
heuristic_decision_is_recorded = true
recognition_grounds = """
`recognize.rs` 가 스스로 적고 있다: *"S1 의 인식은 4단계 중 첫째뿐이다."*
F01 §3.3 이 정한 순서는 ① 확장자 ② 셔뱅 ③ `.gitattributes` 의 `linguist-language`
④ 내용 휴리스틱(최후) 이다.

**실물에서 각 단계가 무엇을 켜는지 세는 것이 합격선이다** — 단계를 넷 다 구현했다는
사실이 아니라. 등록 시점의 실측:

  · 코퍼스의 `unrecognized` 는 **7 건**이고 그 목록은
    `.gitattributes` · `.gitignore` · `docker/.env.example` · `gradlew` ·
    `banner.txt` · `*.kt.bak` · `test.http` 다
  · **② 셔뱅이 켜는 것은 `gradlew` 하나다** — 그것이 실물의 하중이다
  · **③ 은 이 코퍼스에서 하중이 0 이다.** `.gitattributes` 가 실재하지만 내용은
    `text eol=lf` · `binary` 뿐이고 `linguist-language` 가 **없다**. 그러면 이 단계는
    픽스처에서만 시험되고, **그 사실을 게이트에 적는다**(F22-4 가 불변식 여덟을
    실물 3 · 픽스처 5 로 가른 것과 같은 형태)
  · **④ 는 켜는 것이 없거나 오히려 대장을 거짓말하게 만들 수 있다.** 남는 후보는
    `*.kt.bak` 하나이고 그것을 Kotlin 으로 인식하면 백업 파일이 추출 대상이 된다.
    `recognize.rs` 자신이 *"틀리게 인식하는 것보다 모른다고 적는 것이 낫다"* 고 적었다.

**그러므로 ④ 를 세우는 것이 합격선이 아니다. 세울지 판단하고 그 근거를 적는 것이
합격선이다.** 안 세우기로 하면 F01 §3.3 을 정정하고 그 정정을 목록에 올린다 —
계획 §7.3 이 말한 *"설계가 틀렸다고 판정하고 근거를 적는 것"* 은 반증이 아니다.
"""

# ⑦ 골든 대장 스냅샷 — 조용한 회귀를 잡는 유일한 장치
golden_ledger_committed = true
golden_detects_grade_downgrade = true
golden_grounds = """
**추출 등급 하락 같은 조용한 회귀를 잡는 유일한 장치다**(F01 §7). 코퍼스의 대장을
커밋하고 차이가 나면 diff 를 보여준다.

**음성 대조**: 언어 능력 등급을 하나 낮춘(L1 → L0) 사본에서 골든 대조가 **실패해야**
한다. 실패하지 않으면 골든은 검사가 아니라 장식이다 — 등급이 조용히 떨어져도
`✓` 가 나온다.

**골든이 무엇을 담는지가 이 항목의 절반이다.** 캐시 통계처럼 회차마다 달라지는 값이
들어가면 골든은 매번 깨지고, 그러면 사람이 승인을 습관으로 누르게 된다. 담는 것은
**대장 자체**이고 회계는 아니다([`s1.pass`].`cache_grounds` 가 둘을 가른 것과 같다).
"""

# ⑧ 선형성 — **절대 시간은 합격선이 아니다**
scale_points_min = 4
cost_is_not_quadratic = true
per_file_time_recorded = true
linearity_grounds = """
**시간에 선을 긋지 않는다.** 예산 회귀는 F05 의 것이고 여기 숫자를 박으면 그것이
굳는다([`s1.secondary`].`timing` 과 같은 판단). §12.4 의 규모 목표(10⁵ 파일 10분)는
P1 종료 시점의 것이고 이 기능의 합격선이 아니다.

**합격선은 형태다: 제곱 비용이 아닐 것.** 규모가 10 배가 될 때 **파일당** 시간이
10 배 이상이 되면 그것은 O(n²) 이고, 10⁵ 에서 죽는다. 이 선은 근거 없는 숫자가 아니라
제곱의 정의에서 나온다 — 넉넉하지만 참이다. 실제 값은 전부 기록한다.

**규모 점은 실물에서 얻는다.** boxwood 의 저장소 여섯이 133 · 141 · 315 · 550 · 997 ·
1529 파일이다. 10³ 대역은 실물로 덮이고 **10⁴ 은 실물 코퍼스에 없다.**

**10⁴ 을 합성으로 보완하면 무엇이 왜곡되는지 함께 적는다** — 파일을 복제하면 blob 이
같아져 캐시가 과도하게 적중하므로 사본마다 내용을 고유하게 만들어야 하고, 그래도
언어·크기 분포는 원본을 따르므로 *"실물 10⁴ 저장소"* 와 같지 않다.
**합성으로도 못 재면 그 항목은 `대조 불가` 로 적고 대표값으로 채우지 않는다.**
"""

