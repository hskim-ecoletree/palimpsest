`ReadOnlyDatabase::open` = **공유**다. 그러므로 고치는 것은 **여는 방법 하나**다.

**그런데 그 순간 부딪히는 것이 질의 로그다.** F05 §5.3 이 못 박았다 — *"모든 질의
실행이 접근한 좌표를 `QUERY_LOG` 에 남긴다. **처음부터 켜지 않으면 F17 은 데이터가
