| `WatchMemberGone` | 원소가 사라지고 **대상은 살아 있다** | 반경 > `symbol` 필요 |
| `ProjectionStale` | `built_for_this_snapshot == false` (`--read-only`) | **난다** |

⚠ **`ordinal` 은 여기 없다.** `ordinal_is_not_undeterminable` 이 그 판단이고
