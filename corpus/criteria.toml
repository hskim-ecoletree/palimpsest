[s2]
issue = 39
risks = ["R-07", "R-22"]
registered_at = "2026-08-12"
registered_before_any_code = true
decided_by = "에이전트 (소유자 위임 · 2026-08-12)"

judges = """
**`Envelope` · 정규화 · 2층 셋이 붙는가** 하나다(계획 §3 의 S2 행).

그중 **정규화**가 이 슬라이스에서 가장 위험하다. `body_digest` 는 *"변했는가"* 에 답하고
그 답이 틀리면 제품이 죽는다 — 거짓 양성이면 포매팅 커밋 하나에 결박이 무더기로
`stale` 이 되어 사람이 표시를 무시하게 되고([R-07]), 거짓 음성이면 낡은 결정이 `live` 로
적극 보증된다. **둘 다 조용히 일어난다.**

그리고 **빈 답의 정직성**이다. 결박도 참조 해소도 판정도 아직 없는 상태에서 `touch` 를
부르면 화면이 비는데, 그 빈 자리가 `Finding 0` 이나 빈 배열로 나오면 이 도구는 자기가
고발한 문제를 스스로 저지른다(#39 인수 기준 ②).
"""

# ─────────────────────────────────────────────────────────────────────────────
# ⚠ 재판정 (2026-08-14 · #55) — **등록의 수정이 아니라 이행의 기록이다**
# ─────────────────────────────────────────────────────────────────────────────

restated_after_f05 = """
**⚠ 합격선 ①② 가 F05 이후 무엇을 요구하는지 다시 적는다. 합격선은 안 낮춘다.**

`scripts/s2-verify.py` 가 반증을 냈다(#55 · [F06 게이트](../docs/gates/F06.md) §0).
어긋난 셋이 **전부 F05 가 의도적으로 만든 것**이고 스크립트는 `46b3153`(F01) 이후 한
줄도 안 움직였다. **그러므로 고칠 것은 합격선이 아니라 스크립트다** — 그리고 그 구별을
여기 적는 것이 이 등록의 일부다.

**가르는 문장 하나:**

> **등록의 수정**은 합격선이 요구하는 것을 바꾸는 것이다.
> **이행**은 요구가 그대로 참인데, 그것을 재는 검사가 **요구를 그때의 모양으로 굳혀**
> 놓아서 모양이 바뀌자 요구까지 못 읽게 된 것이다.

**스크립트 자신이 이미 같은 처분을 두 번 적어 두었다** — `bindings`(S3 가 채웠다)와
`matches_worktree`(F01 이 채웠다). *"자리가 채워진 것은 합격선의 위반이 아니라 이행이다."*
**셋째와 넷째가 여기다.**

| 어긋난 값 | 언제 | 처분 | 근거 |
|---|---|---|---|
| `elision` 의 **모양** | `8de81c0` F05-1 | **모양이지 요구가 아니다** — 검사를 요구로 다시 쓴다 | 아래 ① |
| `facts` 가 값이 됐다 | F05-2 | **이행** — 다섯째 자리가 채워졌다 | 아래 ② |
| `rebuild` 가 값이 됐다 | `85251c6` F05-2 | **이행** — 그리고 뒤집는 조건이 스크립트에 적혀 있었다 | 아래 ③ |

**① `elision` — 요구는 「명시적 `none()`」이지 「`{dropped, reasons}`」가 아니다.**

`envelope_grounds` 가 요구한 것은 *"잘린 것이 없어도 **명시적으로** `none()` 이어야
한다(stack §5.4 — 조용한 절단 금지)"* 다. F05-1 이 `{dropped:0, reasons:[]}` 를
`{truncated:[], limits_hit:[]}` 로 바꿨고 그것은 **F05 문서 §5.2 가 요구한 것**이다.
**새 모양에서도 요구는 그대로 참이다.**

옛 검사는 요구를 **리터럴 하나로** 굳혔다(`!= {"dropped": 0, "reasons": []}`). 그래서
모양이 바뀌자 *"명시적이지 않다"* 라고 적었는데, 실제로는 명시적이었다. 다시 쓰는 형태:

    자리가 있고 · 선언된 통이 **1 개 이상**이고 · 그 통이 **전부** 비어 있다

**`{}` 는 실패다** — 선언된 통이 0 이면 그것은 *"안 잘랐다"* 가 아니라 *"아무 말도 안
했다"* 이고, `stack §5.4` 가 금한 바로 그것이다. **그리고 이 형태는 F0x 가 통을 하나 더
더해도 안 깨진다** — 리터럴이 아니라 요구를 재기 때문이다.

**② `facts` — 다섯째 자리가 채워졌다.**

F05-2 가 **파일 안**의 호출 관계를 값으로 만들었다. ②가 요구한 것은 *"빈 자리를 빈
배열로 내지 말 것"* 이고, 값이 생기면 값이 나가는 것이 맞다. `bindings`·`matches_worktree`
와 **글자 그대로 같은 일**이다.

**③ `rebuild` — 뒤집는 조건이 스크립트에 이미 적혀 있었다. 그 조건이 충족됐다.**

옛 주석이 이렇게 적었다:

> **재구축은 여전히 `NotBuilt` 다** — 관측 경로가 F05 이고, 그 자리가 **조용히**
> `Settled` 로 채워지면 *"재구축 중이 아니다"* 가 **관측 없이** 단언된다.

**조용히가 아니다.** [ADR-0010] 이 무대 테이블(`*.staging`)을 세웠고 **무대가 있으면
재구축 중이다** — 그것이 관측이다. 주석이 요구한 「관측 경로」가 실제로 생겼으므로 이행이다.
**관측 경로 없이 `Settled` 가 됐으면 그때는 위반이었다** — 그 구별이 이 항목의 전부다.

──────────────────────────────────────────────────────────────────────────────
**⚠ 그리고 이행으로 세지 않는 것 하나 — `facts` 의 모집단.** (넘긴다)

이 코퍼스에서 `facts` 가 `{callers: 0, callees: 0}` 이다. **Kotlin 추출기는 스코프
체인을 안 만들고**(`Capable::NotBuilt`) 그래서 파일 내 엣지가 0 이다. **[ADR-0002] 가
가른 바로 그 자리다** — 「없음」이 아니라 「안 만듦」인데, `crates/pal-cli/src/touch.rs`
가 `facts` 를 **무조건** `Capable::Present` 로 싣는다.

**[s2] ② 가 등록한 것의 다음 층이고 [s2] 의 합격선이 아니다** — ②는 *"빈 자리가 `[]`
가 아니라 `not_built{기능번호}`"* 를 요구했고 그것은 지켜졌다. 그러나 **같은 규율이 한
층 아래에서 안 지켜지고 있다.**

**여기서 안 고친다.** 고치면 산출이 움직이고(`portal-backend.ledger.json` 골든) 소유자가
다르다 — 파일 간 해소는 **F07**, 추출기의 능력을 자리에 싣는 것은 **F02-3 의 계약**이다.
**s2 검사는 이것을 통과로 세지 않는다** — `Present` 인 것은 확인하되 값이 0/0 이면
**발견으로 찍는다.** 조용히 넘기지 않는 것이 여기서 할 수 있는 전부다.
──────────────────────────────────────────────────────────────────────────────

**이 재판정이 고장 났다면 어떻게 드러나는가** (규율 2):
검사를 요구로 다시 쓰면 **아무것도 안 세는 검사**가 되기 쉽다 — `elision` 을 통째로
지워도, `not_built` 자리를 전부 `Present` 로 갈아 끼워도 통과할 수 있다. 그래서
`s2-verify.py` 에 **음성 대조를 넣는다**(`--self-test`): 방향마다 망가뜨린 봉투를
넣어서 **잡히는지** 센다. 안 잡히면 그 검사는 문장일 뿐이다.

**그리고 규율 하나를 더한다 — 이것이 #55 의 본체다.**
**핸드오프의 기준선은 「돌려서」 만든다. 앞 세션의 값을 옮겨 적지 않는다.**
`s2 6/6` 은 F05 종료 시점에 이미 거짓이었고 **두 핸드오프를 그대로 건너왔다.**
F05 의 규율 7(*"남의 측정을 근거로 삼을 때 그 측정에도 반대 방향을 걸어라"*)의 가장
얕은 형태이고, 이 저장소에서 **실제로 한 번 새어 나갔다.**

