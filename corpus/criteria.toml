정면으로 부딪힌다:**

> **없는 자리를 미리 만들지 않는다.** 빈 자리를 미리 만들면 그것이 곧 *"있는데 비어
> 있다"* 로 읽힌다. (`pal-store::projection` 의 머리 주석 · S2)

