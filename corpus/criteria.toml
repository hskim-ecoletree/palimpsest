아니라 목록으로** 적는다.

**주의**: `pal-core::budget` 으로 상수를 옮기는 것은 값이 아니라 **자리**를 바꾼다.
값이 하나라도 바뀌면 골든이 움직이고, 그것이 이 항목이 잡는 형태다.
