  · **F03-2 정규화** — *변했는가.* `body_digest` 가 무엇에 움직이고 무엇에 안 움직이는가
  · **F03-3 이동과 골든** — *좌표가 움직였을 때 그것이 보이고 흡수되는가*

**답이 서로 독립이다.** 정규화가 반증돼도 좌표는 컨테이너로 갈릴 수 있고, 좌표가
안 갈려도 정규화는 포매팅에 불변일 수 있다. 한 게이트에 넣으면 **하나가 다른 둘을
