[s2.secondary]
symbol_count = "2층에 들어간 심볼 수. S0 레퍼런스의 671 파일 선언 수 합과 대는 것이 자연스럽다"
collision = "`symbol_id` 충돌 건수. 0 이 기대값이지만 **합격선이 아니다** — blake3 에서 그것은 우리 코드가 아니라 해시의 성질이다"

falsified_if = """
**여섯 중 하나라도 어긋나면 반증이다.** 대조 불가로 적어야 하는 경우: 코퍼스에 닿지
못하거나, 2층을 세우지 못해 애초에 재구축을 시험할 수 없는 경우.
"""

