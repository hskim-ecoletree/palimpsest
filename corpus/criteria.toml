  · `cargo xtask check` 의 「의도 저장소 폐기 경로 부재」가 **그대로 통과한다**

**이 검사가 고장 나면 어떻게 드러나는가**: 읽기가 아무것도 안 해도 첫 항목은 통과한다
(A·B 가 원래 있었으므로). **그래서 둘째가 짝이다** — 읽기가 아무것도 안 하면
`[f05.4.pass].roundtrip_is_identity` 가 실패한다. **둘이 서로를 막는다.**
"""

corrupt_intent_is_not_silently_empty = """
**③ 의도 저장소가 깨지면 조용히 빈 채로 열지 않는다.**

문서 §6 의 표가 못 박았다 — *"사용자에게 유실 범위를 명시 — **조용히 빈 채로 열지
않는다**"*.

  · `intent.redb` 의 바이트를 망가뜨리면 `pal touch` 가 **오류**를 낸다.
    결박 0 건으로 답하지 않는다
  · 오류 문장이 **JSONL 내보내기에서 복구하라**고 말한다

**이 검사가 고장 나면 어떻게 드러나는가**: 저장 계층이 깨진 파일을 새 파일로 갈아치우면
「결박 0」이 나오고 그것이 정확히 이 항목이 막는 형태다. **깨뜨린 뒤 파일 크기가
0 이 아님을 함께 확인한다** — 0 이면 망가뜨린 것이 아니라 지운 것이다.
"""

readonly_open_does_not_write = """
**④ ★ 읽기만 하는 명령이 의도 저장소를 안 건드린다 — 바이트로.**

**F04 가 여기로 넘긴 것이다.** `pal-intent` 가 읽기에도 `Database::create` 로 열어서
**같은 `pal touch` 두 번에 1,056,768 바이트 중 110 바이트가 달라진다.** 그래서 F04 의
재구축 등가성 시험은 ③ 을 **바이트가 아니라 값으로** 재야 했고, 그 사실을 게이트에
