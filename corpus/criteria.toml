# ① 반경 넷이 각각 선언한 집합을 낸다
radius_kinds_built = 4
radius_grounds = """
**`symbol` · `callers` · `closure(k)` · `files` 넷이 각각 **선언한** 집합을 낸다.**

| 반경 | 감시 집합 | 검사 |
|---|---|---|
| `symbol` | 대상 하나 | 크기 == 1 |
| `callers` | + **직접** 호출자 | 2층의 역방향 조회와 **집합으로 같다** |
| `closure(k)` | + k-홉 의존 폐포 | k=1 이 `callers` 와 같다 · k 를 올리면 **커진다** |
| `files` | + 나열된 파일의 심볼 전부 | 그 파일들의 심볼 수와 같다 |

★ **반대 방향 둘**:
  · **`closure(k)` 의 k 를 올리면 집합이 커져야 한다.** 안 커지면 k 가 안 걸린 것이다
    (`[f05].sqlite_cte_oracle` 의 *"깊이 상한을 올리면 답이 늘어야 한다"* 와 같은 형태)
  · **`callers` 가 `symbol` 보다 커야 한다** — 표본 중 **하나 이상**에서. 전부 같으면
    호출자가 하나도 없는 표본을 고른 것이거나 엣지가 안 붙은 것이다

**하한**: 감시 집합 크기의 합이 **결박 수 미만이면 멈춘다.** 빈 감시 집합은 언제나
`Live` 다(`control_off_modes` 의 열다섯째 후보).
"""

