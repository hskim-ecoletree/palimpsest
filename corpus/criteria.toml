스코프 체인이 반증돼도 추출기는 선다. 병렬이 비결정적이어도 추출은 옳을 수 있다.
한 게이트에 넣으면 **하나가 다른 셋을 가린다** — F22 가 쪼갠 이유 그대로다.

**넷은 순서를 갖고 그 순서는 blocking 엣지로 트래커에 있다** — #46 → {#47, #48} · #48 → #49.
#47 과 #48 은 서로 막지 않는다(회복 지점과 스코프는 독립이다). 지붕(#5)은 넷이 다 닫힌 뒤
`docs/gates/F02.md` 로 판정한다.
"""

first_language = """
**첫 언어는 TypeScript 다 — 기능 문서 §3.3 이 맞다. 그리고 실물이 그것을 뒤집은 것이
아니라, F02 가 아직 시작되지 않은 것이다.**

핸드오프(#5)는 *"문서는 TypeScript 를 첫 언어로 적는데 실물은 반대다 — Kotlin 이 이미
섰다"* 라고 적었다. **절반만 맞다.** 서 있는 Kotlin 추출기는 F02 의 산출이 아니라
**S0 의 산출**이다:

  · 쿼리 방식이다 — **F02 §3.2 가 기각한 그것**이고, `source_file` 의 **직계 자식만** 본다
  · 산출이 `Vec<Symbol>` 이지 `FileGraph` 가 아니다. 포함 관계·참조·export 가 없다
  · `queries/kotlin/top-level.scm` 을 CLI 레퍼런스와 **공유해야** `s0-reference-vector.tsv`
    (1,126 줄) 대조가 성립한다. F01 의 골든 997 항목도 그 위에 선다

**그러므로 Kotlin 을 `FileGraph` 로 올리는 것은 F02 의 첫 걸음이 아니라 S0 대조와 F01
골든을 동시에 흔드는 일이다.** 등급이 L1 → L2 로 오르면 `body_digest` 정규화가 변수명을
지우기 시작하고 골든 997 항목이 통째로 움직인다 — F02 의 산출이 **회귀로 보인다.**

**그리고 TypeScript 에는 사전 등록된 오라클이 있다.** [stack §3.1](../docs/plan/00-stack.md)
의 표가 *"Java · JavaScript · TypeScript 는 대조값이 없다. 아무도 재본 적 없으므로 지금
숫자를 적지 않는다"* 라고 적었는데 **그 자리가 틀렸다** — [T10] 이 ditto(TypeScript ·
496 파일)에서 손으로 잰 값이 `corpus/tasks/outcomes.toml` 에 등록돼 있다. 선언 추출값이
아니라 **결함 계보값**이라 그 표에 안 잡혔을 뿐이다.

**stack §3.1 의 그 문장을 정정하고 그 정정을 게이트 목록에 올린다.** 계획 §7.3 이 말한
*"설계가 틀렸다고 판정하고 근거를 적는 것"* 은 반증이 아니다.

**Kotlin 은 이 기능에서 다시 짓지 않는다.** 넷이 다 닫힌 뒤 같은 골격 위로 옮기는 것은
별도 작업이고, 그때 움직이는 것은 좌표이므로 `ExtractorVersion` 이 그것을 진다.
그 사실을 빚으로 적는다.
"""

f22_debt = """
**F22 의 대조 불가를 F02 가 갚는다 — 다만 판정 항목이 아니라 재실행 의무로.**

[F22-3](../docs/gates/F22-3-chain-nodes.md) 이 **대조 불가**로 닫힌 이유는
*"P0-preflight 의 오라클(ditto · TypeScript)과 P0 가 실제로 만든 능력(Kotlin 추출기)이
겹치지 않는다"* 였다. `pal defect` 의 `digests_at` 을 읽어 확인했다 — 그것이 요구하는
것은 **`Vec<Symbol>` + `body_digest` 뿐이다.** 스코프 체인도 export 도 필요 없다.
그러므로 **#46 이 닫히는 날 `scripts/f22-3-verify.py` 를 재실행할 수 있다.**

**그런데 등록값(발현 4/5 · 도입 4/5 · 엄격 하한 2/5)을 F02 의 합격선으로 삼지 않는다.**
그 수치가 재는 것은 추출기 품질이 아니라 **결함 계보 알고리즘**이다. 3/5 가 나와도 그것은
F02 의 반증이 아니고, **F02 가 통제하지 못하는 값으로 F02 를 판정하는 꼴**이 된다.
[F22-3](../docs/gates/F22-3-chain-nodes.md) 자신이 *"T10 은 삭제된 줄을 blame 했고 이
구현은 body_digest 가 마지막으로 변한 조상을 본다 — 같은 질문에 다른 도구로 답한다"*
라고 적었다. 다른 도구의 값이 F02 의 합격선일 수 없다.

**그래서 합격선은 수치가 아니라 셋이다**(아래 `[f02.1.pass]` ⑥):
  1. 재실행했다
  2. 산출을 **건수가 아니라 목록으로** F02-1 게이트에 적었다
  3. **F22-3 게이트를 갱신했다** — 그 값의 정본은 거기다

**딸린 빚 하나를 함께 켠다.** F22-3 이 적었다: *"이 구현은 테스트와 실코드를 구별하지
않는다. TypeScript 추출기가 서면 `afcfefab` 은 '테스트 심볼이 발현 좌표' 로 결박될
것이고 **그것은 틀린 결박이다**."* 지금은 재어지지 않아 안 드러난다. **F02 가 서는 날
그 거짓말이 실제로 만들어진다.** 구별의 전부는 F15 의 몫이지만, **구별이 없다는 사실이
산출에 실리는 것**은 F02 가 진다(아래 ⑦).
"""

