  1. **스키마의 선례가 「적어도 된다」가 아니라 「짝이 있어야 적는다」이다.**
     `schema/graph.toml` 은 `UnresolvedRef`·`Journey` 를 `not_built` 로 적는데,
     그것이 허용되는 이유는 **코드에 짝이 있고 그 타입이 값을 만들 수 없기** 때문이다
     (`cargo xtask check` 의 방향 3 이 `uninhabited` 를 요구한다). 스무 개의 질의에는
     **코드 쪽 짝이 아예 없다** — 만들면 그것이 곧 「없는 자리를 미리 만드는 것」이고,
