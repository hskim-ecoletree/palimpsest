(stack §3.1 · §4.1 · [R-15]). 이것은 산출이 아니라 구조의 합격선이고, 기계로 검사한다.
접촉면이 새면 gix 가 API 를 바꿀 때 고칠 자리가 한 곳이 아니게 되고, R-15 의 대응
*"깨지면 그 모듈만 고친다"* 가 성립하지 않는다.
"""

on_failure = """
어긋난 것을 **전부** 게이트에 적는다. 경로 집합이면 어긋난 경로 목록을,
분류면 어느 파일이 어느 상태에서 샜는지를, 캐시면 미스/히트 실수(實數)를.
**건수만 적고 목록을 생략하는 것은 이 합격선의 위반이다** — `[s0.pass]` 와 같다.
"""

# ─────────────────────────────────────────────────────────────────────────────
# 기한을 두지 않는다 — S0 과 다른 점
# ─────────────────────────────────────────────────────────────────────────────

[s1.deadline]
has_deadline = false
grounds = """
**계획 §7.2 가 "일정을 두지 않는다"이고 그것이 기본값이다.** S0 에 기한이 있었던 것은
[R-01] 의 증상이 *"며칠이 사라진다"* 라서 기한이 그 증상의 **관측 장치**였기 때문이지
일정 관리가 아니었다.

R-01 은 S0 에서 *"이 규모에서는 막히지 않았다"* 까지 판정됐고 본래 판정 시점은 F01~F03 이다.
S1 은 그 두 번째 관측 자리다 — 여기서 처음으로 **수명 파라미터와 트레잇**이 등장한다
(`GitAccess` 트레잇 · gix 의 빌림). **막히면 그 사실과 어디서 시간이 갔는지를 게이트에
적는다.** 기한 대신 그것이 관측 장치다.
"""

# ─────────────────────────────────────────────────────────────────────────────
# 이 게이트가 증명하지 않는 것
# ─────────────────────────────────────────────────────────────────────────────

[s1.does_not_prove]
not_f01_completion = """
**F01 의 완료가 아니다.** 워킹트리 머클(`tree_digest`)·언어 인식 4단계(셔뱅·
`.gitattributes`·내용 휴리스틱)·`detector_freshness`·골든 대장 스냅샷·10³~10⁴ 벤치는
F01 완료 체크리스트의 것이고 S1 에서 판정하지 않는다.
"""
not_classification_correctness = """
**분류가 옳은지가 아니라 분류가 전수 분할인지만 본다.** 어떤 `.sql` 파일을
`unrecognized` 로 둘지 `unsupported{SQL}` 로 둘지는 우리가 정하는 규칙이고,
그 규칙이 좋은지에 대한 오라클은 없다. 있는 것은 *"모든 파일이 정확히 한 칸에 들어가고
그 칸이 무엇인지 사용자가 볼 수 있다"* 뿐이다.
"""
not_worktree_coordinates = """
**R-06 이 닫히지 않는다.** `TreeRef::Worktree` 를 세우는 것과 그것이 10⁵ 파일에서
성립하는 것은 다른 문제다. S1 은 `TreeRef` 가 **타입으로 존재하고 커밋 축이 돈다**는
것까지만 본다. 머클 비용과 인덱스 캐시는 F01 의 §3.2 다.
"""
not_multi_repo = """
저장소 **하나**다. 멀티레포 스티칭은 F14 이고, 대장 머리의 "선언된 저장소 N개"는
S1 에서 항상 1 이다.
"""

