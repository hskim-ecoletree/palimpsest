# [s3] — S3 슬라이스 `pal bind` + `pal touch` 의 합격선
#
# 이슈 #40 · 위험 R-21(의도가 파생층에 섞여 있다 · 치명) · R-07(낡음의 거짓 양성)
#
# **코드보다 먼저 등록한다.** 등록 시점에 `Binding` 도 의도 저장소도 없다.
#
# 판정 기록: docs/gates/S3-intent.md
# ═════════════════════════════════════════════════════════════════════════════

[s3]
issue = 40
risks = ["R-21", "R-07"]
registered_at = "2026-08-12"
registered_before_any_code = true
decided_by = "에이전트 (소유자 위임 · 2026-08-12)"

judges = """
**제품의 형태가 처음으로 보이는가** — 계획 §3 의 S3 행이 그렇게 적었다.
그런데 "형태가 보인다"는 반증 가능한 문장이 아니다. 반증 가능한 것으로 바꾼다:

> **사람이 손으로 넣은 것이 파생층을 지워도 살아남고, 코드가 변하면 그 사실이 표시된다.**

앞의 절반이 [R-21] 이고 뒤의 절반이 [R-07] 이다. 둘 다 **치명**으로 분류돼 있고,
이 슬라이스가 그것을 처음으로 실물에서 시험한다.

**R-21 이 특히 그렇다.** 지금까지 `pal-store` 가 `pal-intent` 에 닿지 않는지를 정적으로만
검사했다(xtask 검사 3). 의도 저장소가 비어 있었으므로 그것은 **빈 방에 자물쇠를 건 것**
이었다. S3 에서 처음으로 그 방에 사람의 노동이 들어간다.
"""

[s3.oracle]
unit = "결박의 생존과 낡음 표시"
why = """
여기에도 외부 정본이 없다. S2 와 같이 **불변식**이 오라클이다:
파생층을 지워도 결박 건수가 불변이어야 하고, 코드가 변하면 표시가 켜지고 안 변하면 꺼져야 한다.
**양방향을 함께 요구한다** — 언제나 `stale` 인 표시는 언제나 꺼진 표시만큼 쓸모없다.
"""

[s3.pass]

# ① R-21 — **이 게이트의 정수다**
bindings_survive_projection_wipe = true
survive_grounds = """
**2층(`index.redb`)을 통째로 지운 뒤에도 결박 건수와 내용이 그대로여야 한다.**

R-21 의 증상은 *"캐시 폐기가 승인 노동을 지운다"* 이고, 그것이 조용히 일어나는 이유는
**재구축 등가성 검사가 그 상태에서도 통과하기 때문**이다 — 2층은 1층에서 완벽히
복원되므로 검사는 초록이고, 사라진 것은 사람이 넣은 것뿐이다.

그래서 여기서 재는 것은 "2층이 복원되는가"(그것은 S2 합격선 ⑤ 였다)가 아니라
**"2층을 지웠는데 의도가 남는가"** 다.
"""

# ② 결박이 실제로 뜬다
touch_shows_binding = true
touch_grounds = """
`touch` 의 `bindings` 자리가 `NotBuilt` 가 아니라 **`Present` 이고 그 안에 결박이 있어야
한다.** S2 에서 그 자리는 비어 있었고, 채워지는 것이 이 슬라이스의 인수 기준 ② 다.
"""

# ③ 낡음 — **양방향이다**
fresh_when_unchanged = true
stale_when_changed = true
freshness_grounds = """
결박한 뒤
  · 코드가 그대로면 `Live`
  · 결박된 심볼의 `body_digest` 가 바뀌면 `Stale` 이고 **무엇이 켰는지(`triggered_by`)가 실려야 한다**

**양방향이다.** 언제나 `stale` 인 표시는 사람이 무시하게 되고([R-07]), 언제나 `live` 인
표시는 낡은 결정을 적극 보증한다. 둘 다 제품을 죽인다.
"""

# ④ 사라진 것과 변한 것은 다른 사건이다
orphaned_not_stale = true
orphaned_grounds = """
결박된 심볼이 **사라지면** `Stale` 이 아니라 `Orphaned` 여야 한다.
구현 제거는 코드 변경과 다른 사건이고 사람의 판단을 부른다(F09 §2).
뭉개면 "고치면 되는 것"과 "결정을 다시 해야 하는 것"이 같은 화면이 된다.
"""

# ⑤ 구조 — 지우는 API 가 의도에 닿지 않는다
intent_has_no_delete_api = true
structure_grounds = """
`pal-intent` 에 **지우는 공개 API 가 없어야 한다.** 없는 것이 대응이다(R-21).
`pal-store` 가 `pal-intent` 에 의존하지 않는 것은 xtask 검사 1·3 이 이미 센다.
"""

on_failure = "어긋난 것을 전부 게이트에 적는다 — `[s0.pass]` 와 같다."

[s3.deadline]
has_deadline = false
grounds = "계획 §7.2."

[s3.does_not_prove]
not_f09_completion = """
**F09 의 완료가 아니다.** 감시 집합의 **반경**(무엇까지 감시할 것인가) · `StaleDerived` ·
`Superseded` 축 · 승인 흐름은 F09~F12 의 것이다. S3 의 감시 집합은 **결박 대상 심볼
하나**뿐이다.
"""
not_narrative_intake = """
**문서 인입(F10)이 아니다.** 조각을 문서에서 잘라내 신호로 좌표를 찾는 일은 그 기능의
것이고, S3 는 **사람이 이름으로 직접 지정한 결박 하나**를 다룬다.
"""
not_false_positive_rate = """
**R-07 이 닫히지 않는다.** 거짓 양성률은 실제 커밋 이력에 대고 재야 한다.
S3 는 불변식 둘까지다.
"""

[s3.secondary]
export = "의도 저장소의 JSONL 내보내기(F05 §3.1)는 S3 범위 밖이다. 없다는 사실만 기록한다"

falsified_if = """
**다섯 중 하나라도 어긋나면 반증이다.** 특히 ① 이 어긋나면 그것은 슬라이스 실패가 아니라
**R-21 의 실현**이고, 그 경우 F05 착수 전에 저장 구조를 다시 본다.
"""

