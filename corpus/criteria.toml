**둘째가 반대 방향이다.** 흡수만 재면 *"무엇이든 흡수한다"* 가 만점을 받고, 그것은
F03 §5 가 기각한 *"파일 이동 시 자동 재결박"* — *"의미가 다른 동일 코드에 잘못 붙는다"* —
그 자체다.
