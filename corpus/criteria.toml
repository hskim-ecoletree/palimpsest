touch_grounds = """
`touch` 의 `bindings` 자리가 `NotBuilt` 가 아니라 **`Present` 이고 그 안에 결박이 있어야
한다.** S2 에서 그 자리는 비어 있었고, 채워지는 것이 이 슬라이스의 인수 기준 ② 다.
"""

