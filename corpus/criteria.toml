**사유 넷을 각각 만들어 `Live` 가 안 나오는지 센다.**

| 사유 | 어떻게 만드나 | 코퍼스에서 나나 |
|---|---|---|
| `IdentityGrade` | 감시 집합 원소의 등급이 **`Unavailable`(L0)** | **아마 안 난다** — 픽스처 |
