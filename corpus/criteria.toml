alias_survives_derived_wipe = true
alias_grounds = """
F03 §7 이 *"저장 위치는 **의도 저장소**([R-21])"* 라고 못박았다. 그 이유는 별칭이
**사람이 선언하는 것**이기 때문이다 — 저장소를 나눴다는 사실은 코드에서 유도되지 않는다.

**합격선 둘**:
  1. `pal-store`(파생층) 소스에 별칭 경로 언급이 **0 건** — `cargo xtask check` 의
     의도 저장소 검사가 이미 그 방향을 지킨다. 새 테이블이 그것을 깨지 않는다
  2. **★ 파생층을 통째로 지우고 재구축해도 별칭이 그대로다.** `[s3.pass]` 의 결박
     생존 시험과 같은 형태이고, 지우는 API 가 `pal-intent` 에 없다는 사실이 그 대응이다

**빈 방에 자물쇠를 거는 것이 아니다** — 별칭을 실제로 하나 넣고 재구축한다.
"""

