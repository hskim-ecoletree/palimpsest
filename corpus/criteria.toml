# [s3] — S3 슬라이스 `pal bind` + `pal touch` 의 합격선
#
# 이슈 #40 · 위험 R-21(의도가 파생층에 섞여 있다 · 치명) · R-07(낡음의 거짓 양성)
#
# **코드보다 먼저 등록한다.** 등록 시점에 `Binding` 도 의도 저장소도 없다.
#
# 판정 기록: docs/gates/S3-intent.md
# ═════════════════════════════════════════════════════════════════════════════

[s3]
issue = 40
risks = ["R-21", "R-07"]
registered_at = "2026-08-12"
registered_before_any_code = true
decided_by = "에이전트 (소유자 위임 · 2026-08-12)"

judges = """
**제품의 형태가 처음으로 보이는가** — 계획 §3 의 S3 행이 그렇게 적었다.
그런데 "형태가 보인다"는 반증 가능한 문장이 아니다. 반증 가능한 것으로 바꾼다:

> **사람이 손으로 넣은 것이 파생층을 지워도 살아남고, 코드가 변하면 그 사실이 표시된다.**

앞의 절반이 [R-21] 이고 뒤의 절반이 [R-07] 이다. 둘 다 **치명**으로 분류돼 있고,
이 슬라이스가 그것을 처음으로 실물에서 시험한다.

**R-21 이 특히 그렇다.** 지금까지 `pal-store` 가 `pal-intent` 에 닿지 않는지를 정적으로만
검사했다(xtask 검사 3). 의도 저장소가 비어 있었으므로 그것은 **빈 방에 자물쇠를 건 것**
이었다. S3 에서 처음으로 그 방에 사람의 노동이 들어간다.
"""

[s3.oracle]
unit = "결박의 생존과 낡음 표시"
why = """
여기에도 외부 정본이 없다. S2 와 같이 **불변식**이 오라클이다:
파생층을 지워도 결박 건수가 불변이어야 하고, 코드가 변하면 표시가 켜지고 안 변하면 꺼져야 한다.
**양방향을 함께 요구한다** — 언제나 `stale` 인 표시는 언제나 꺼진 표시만큼 쓸모없다.
"""

[s3.pass]

# ① R-21 — **이 게이트의 정수다**
bindings_survive_projection_wipe = true
survive_grounds = """
**2층(`index.redb`)을 통째로 지운 뒤에도 결박 건수와 내용이 그대로여야 한다.**

R-21 의 증상은 *"캐시 폐기가 승인 노동을 지운다"* 이고, 그것이 조용히 일어나는 이유는
**재구축 등가성 검사가 그 상태에서도 통과하기 때문**이다 — 2층은 1층에서 완벽히
복원되므로 검사는 초록이고, 사라진 것은 사람이 넣은 것뿐이다.

그래서 여기서 재는 것은 "2층이 복원되는가"(그것은 S2 합격선 ⑤ 였다)가 아니라
**"2층을 지웠는데 의도가 남는가"** 다.
"""

