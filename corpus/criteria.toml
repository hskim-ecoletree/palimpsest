parallel_runs_byte_identical = true
runs_min = 5
determinism_grounds = """
같은 입력을 **여러 번 병렬 추출**해 `FileGraph` 가 바이트 단위로 같아야 한다.
**한 번 더가 아니라 다섯 번이다** — 경합은 간헐적이고 두 번으로는 안 드러난다.

**순서 의존 버그는 이것 없이는 안 보인다**(F02 §6). 그리고 그 버그의 증상은
*"가끔 틀린 심볼"* 이 아니라 **`symbol_id` 가 회차마다 움직이는 것**이고, 그러면
결박이 조용히 `orphaned` 가 된다.

**직렬 산출과도 대조한다** — 병렬끼리만 같으면 *"병렬 경로 전체가 일관되게 틀린 것"* 이
통과한다.
"""

