    결박 건수 · id 집합 · 조각(note) · 감시 집합 · 별칭이 **전부 같다**
  · `pal touch` 의 답이 **바이트로 같다**
  · JSONL 이 **한 줄에 하나**이고 스키마 버전을 싣는다

**이 검사가 고장 나면 어떻게 드러나는가**: 결박이 0 건이면 왕복이 공짜로 항등이다.
**결박 최소 2 건 · 별칭 최소 1 건을 넣고 시작하고, 0 이면 멈춘다.**
"""

import_does_not_delete = """
**② ★ 읽기가 지우지 않는다. 그리고 내보내지 않은 것은 안 돌아온다.**

