  4. **반대 방향 넷을 서로 막게 넣는다**(`judges`). 하나가 다른 하나를 막는 구조가
     아니면 이 기능은 자기가 만든 감지기를 자기가 채점한다
  5. **`Undeterminable` 에 상한과 하한을 함께 건다.** 상한만 걸면 *"안 켜면 통과"* 이고
     하한만 걸면 *"많이 켜면 통과"* 다. **둘이 있어야 이 값이 무언가를 잰다**
  6. **대조가 꺼지는 형태가 열넷이다.** 이 기능에 걸리는 셋을 `control_off_modes` 에
     적고 각각에 **막는 장치**를 함께 등록한다
  7. 소유자가 이 값을 뒤집을 수 있다. 뒤집히면 그 사실이 게이트에 적힌다
