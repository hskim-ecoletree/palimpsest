tie_grounds = """
**`[f10.pass]` ④(동점 후보를 확정하지 않는다)를 이 절이 깨뜨리지 않는다.**

⚠ **그런데 그것을 재던 픽스처가 무력해진다.** F10 은 **스팬 동점**과 **경로 동점**으로
쟀는데, 이 절의 처분에서 **둘 다 확정할 수 없는 신호**다 — 동점이든 아니든 후보로
나가므로 *"동점을 확정하지 않았다"* 가 **공짜로 참**이 된다.
**그것이 `control_off_modes` 의 열아홉째이고 이 이슈에 직접 걸린다.**

**막는 장치 — 동점을 거리 0 인 신호로 다시 만든다:**

  1. **`attached` 동점** — 표식 주석 하나가 **선언 둘 이상**에 붙는 자리를 만든다
  2. **`frontmatter` 동점** — `grounds:` 에 **파일만** 적는다(`#` 뒤가 없으면 그 파일의
     심볼 전부이고, `by_ground` 가 이미 그렇게 만든다)
  3. ★ **확정 픽스처** — 거리 0 인 신호로 **유일하게** 해소되는 조각.
     **이것이 없으면 「전부 후보로 낸다」가 만점을 받는다**

**그리고 반대 방향의 반대 방향도 그대로다**: 동점을 **미결박으로 접으면 반증**이다.

⚠ **재료가 없으면 「대조 불가」로 적고 통과로 세지 않는다.** 특히 1 번은 **주석 하나에
선언 둘이 붙는** 자리가 코퍼스에 있어야 하고, 없으면 **픽스처로 만든다** —
`[f10.pass]` ④가 *"자연 발생을 기다리면 표본에 안 나올 수 있고, 안 나오면 이 대조가
조용히 꺼진다"* 라고 적은 그대로다.
"""

# ★ ⑥ 문서 변형 다섯 — [f10.1.pass] 가 등록했는데 스크립트가 안 세운 것
mutation_kinds = 5
