한다** — 셋 중 하나라도 빠지면 이것은 문장이다.

**타입** (`promotion_shape`):
  · `Binding.promoted_by: PromotedBy` — **`Option` 이 아니다.** `Hand` 와 `Proposal`
    둘뿐이고 **둘 다 사람의 행위다.** 셋째 길이 생기려면 열거를 늘려야 하고,
