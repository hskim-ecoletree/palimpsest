# [s2] — S2 슬라이스 `pal touch <좌표>` 의 합격선
#
# 이슈 #39 · 위험 R-07(낡음 표시의 거짓 양성 · 치명) · R-22(정규화 등급 승급 · 치명)
#
# **코드보다 먼저 등록한다.** 등록 시점에 `Coord` · `Envelope` · `SymbolId` 는 존재하지
# 않고 2층도 없다. S0 · S1 과 같은 규율이다.
#
# 판정 기록: docs/gates/S2-touch.md
# ═════════════════════════════════════════════════════════════════════════════

[s2]
issue = 39
risks = ["R-07", "R-22"]
registered_at = "2026-08-12"
registered_before_any_code = true
decided_by = "에이전트 (소유자 위임 · 2026-08-12)"

judges = """
**`Envelope` · 정규화 · 2층 셋이 붙는가** 하나다(계획 §3 의 S2 행).

그중 **정규화**가 이 슬라이스에서 가장 위험하다. `body_digest` 는 *"변했는가"* 에 답하고
그 답이 틀리면 제품이 죽는다 — 거짓 양성이면 포매팅 커밋 하나에 결박이 무더기로
`stale` 이 되어 사람이 표시를 무시하게 되고([R-07]), 거짓 음성이면 낡은 결정이 `live` 로
적극 보증된다. **둘 다 조용히 일어난다.**

그리고 **빈 답의 정직성**이다. 결박도 참조 해소도 판정도 아직 없는 상태에서 `touch` 를
부르면 화면이 비는데, 그 빈 자리가 `Finding 0` 이나 빈 배열로 나오면 이 도구는 자기가
고발한 문제를 스스로 저지른다(#39 인수 기준 ②).
"""

# ─────────────────────────────────────────────────────────────────────────────
# 오라클 — 정규화는 **불변식**이 오라클이다
# ─────────────────────────────────────────────────────────────────────────────

[s2.oracle]
unit = "정규화 불변식 + 봉투 필드 + 2층 재구축 등가성"
corpus = "boxwood-portal-kotlin @ a29cad0bf6a8 의 `.kt` 671 파일 (S1 이 이미 검증한 핀)"

why_invariants = """
**여기에는 `git ls-tree` 같은 외부 정본이 없다.** `body_digest` 가 옳은 값인지 말해 줄
바깥의 표가 존재하지 않는다 — 그 값은 우리 정규화 규칙의 산출이기 때문이다.

그래서 오라클을 **값**이 아니라 **불변식**으로 잡는다. 불변식은 반증 가능하다:
같은 코드를 포매팅만 바꿔 넣었을 때 digest 가 달라지면 그것이 곧 반증이고,
의미를 바꿨는데 같으면 그것도 반증이다. **양방향을 함께 요구하는 것이 핵심이다** —
한쪽만 보면 *"언제나 같은 값"* 을 내는 고장 난 digest 가 만점을 받는다(S1 의 캐시와
같은 함정이다).
"""

# ─────────────────────────────────────────────────────────────────────────────
# 합격선 — 여섯
# ─────────────────────────────────────────────────────────────────────────────

[s2.pass]

# ① 봉투 — 답만 돌려주는 경로가 존재하지 않는다
envelope_fields_missing = 0
envelope_grounds = """
표면 응답에 `Envelope` 의 필드가 **전부** 실려야 한다 — `snapshot` · `projection` ·
`coverage` · `capabilities` · `ledger` · `elision`. 하나라도 빠지면 반증이다.
`elision` 은 잘린 것이 없어도 **명시적으로** `none()` 이어야 한다(stack §5.4 —
조용한 절단 금지).
"""

# ② 빈 답의 정직성 — **이 게이트의 정체성이다**
empty_answers_must_be_not_built = true
empty_grounds = """
결박(F09) · 참조 해소(F07) · 효과(F13) · 판정(F15) 자리는 **빈 배열이 아니라**
`Capable::NotBuilt{capability}` 여야 하고, **기능 번호가 실려야 한다.**

JSON 산출에서 그 자리에 `[]` 가 나오면 반증이다. `Finding 0` 과 "감사를 안 만들었음"이
같은 출력이 되는 것이 목표 §3.1 의 정면 위반이고, 이 슬라이스가 그것을 처음으로
사용자 눈앞에서 시험한다.
"""

# ③ 정규화 — **양방향이다**
digest_stable_under_formatting = true
digest_changes_under_semantics = true
digest_grounds = """
`body_digest` 는
  · 공백 · 줄바꿈 · 들여쓰기 · 주석만 바뀌면 **같아야 하고**
  · 선언의 의미가 바뀌면 **달라야 한다**

**둘을 함께 요구한다.** 앞의 것만 보면 상수를 돌려주는 digest 가 통과하고, 뒤의 것만
보면 원문 해시가 통과한다. 원문 해시는 R-07 의 거짓 양성 그 자체다.

**지역 변수명 · 파라미터명은 지우지 않는다** — [R-22] 가 경고한 자리다. 그것을 지우려면
그 심볼의 스코프 해소가 성공해야 하는데 S0 추출기는 L1(구조)이라 스코프가 없다.
등급이 못 미치는데 지우면 **서로 다른 코드가 같은 digest 를 갖는다.**
"""

# ④ 정체성 — 이동과 변경이 다른 사건이다
symbol_id_stable_for_same_symbol = true
symbol_id_changes_on_move = true
identity_grounds = """
같은 저장소 · 같은 경로 · 같은 이름이면 `symbol_id` 가 같아야 하고,
**파일을 옮기면 `symbol_id` 가 바뀌되 `body_digest` 는 그대로여야 한다.**

둘을 분리한 것이 [R-08] 의 재결박 제안을 가능하게 하는 유일한 근거다 — 이동을
"정체성이 끊겼다"로만 읽으면 파일 하나 옮길 때마다 결박이 전멸한다.
"""

# ⑤ 2층 — 캐시임을 증명한다
rebuild_equivalence = true
rebuild_grounds = """
**2층을 통째로 지우고 1층에서 재구축했을 때 결과가 같아야 한다.** 2층이 캐시라는
주장(stack §2.3 의 "자체 구현의 최대 비용이 0")이 참인지가 여기서 갈린다. 다르면
2층에만 있는 상태가 존재한다는 뜻이고, 그 순간 2층은 캐시가 아니라 원본이 된다.

**의도 저장소는 이 검사의 대상이 아니다** — 그쪽은 지우면 유실이고([R-21]) S2 에는
아직 없다.
"""

# ⑥ 실물 — 코퍼스에서 실제로 찾아진다
resolves_real_symbol = true
resolves_grounds = """
S1 이 검증한 코퍼스에서 이름으로 심볼을 찾아 좌표를 낼 수 있어야 한다.
합성 입력만으로는 2층이 붙었다고 할 수 없다.
"""

on_failure = """
어긋난 것을 **전부** 게이트에 적는다. 정규화면 어긋난 입력 쌍을, 봉투면 빠진 필드를,
2층이면 재구축 전후의 차이를. **건수만 적는 것은 위반이다** — `[s0.pass]` 와 같다.
"""

[s2.deadline]
has_deadline = false
grounds = "계획 §7.2 가 기본값이다. `[s1.deadline]` 과 같은 이유."

# ─────────────────────────────────────────────────────────────────────────────
# 이 게이트가 증명하지 않는 것
# ─────────────────────────────────────────────────────────────────────────────

[s2.does_not_prove]
not_normalization_quality = """
**정규화가 "옳은지"가 아니라 불변식 둘을 지키는지만 본다.** 어디까지 지워야 의미
보존인가는 언어별·심볼별 판단이고 그 오라클은 F03 이 표본으로 만든다.
S2 는 *"포매팅에 불변 · 의미에 가변"* 이라는 최소 계약만 시험한다.
"""
not_reference_resolution = """
**참조 해소는 F07 이다.** `touch` 의 "호출자 / 호출" 자리는 S2 에서 `NotBuilt` 이고,
그것이 ② 가 시험하는 바로 그 자리다. 파일 간 해소는커녕 파일 내 참조도 아직 없다
(F02 §3.5 의 `local_refs` 는 S0 추출기에 없다).
"""
not_binding = """
**결박은 F09~F12 다.** 의도 저장소가 비어 있고 `BOUND_BY` 색인도 없다.
"이 좌표에 걸린 것"은 S2 에서 `NotBuilt` 다.
"""
not_budget = """
**예산 절단은 F05 의 것이다.** `Elision` 은 타입으로 서고 값은 언제나 `none()` 이다 —
자를 만큼의 답이 아직 없다. 예산 상수(stack §5.5)를 여기서 굳히지 않는다.
"""
not_r07_closure = """
**R-07 이 닫히지 않는다.** 거짓 양성률은 실제 커밋 이력에 대고 재야 하고 그것은
F03 의 오라클(코퍼스 차등 재추출)이다. S2 는 불변식 둘까지다.
"""

