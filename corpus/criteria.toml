judges = """
**낡음이 켜져야 할 때 켜지고 켜지지 말아야 할 때 안 켜지는가. 그리고 모르는 것을
안다고 하지 않는가.**

**「낡음을 감지한다」는 이 계획에서 말하기 가장 쉬운 문장이다.** 아무것도 안 켜는
감지기도, 전부 켜는 감지기도 그 문장을 만족한다. 그러므로 이 기능의 판정은 **한 방향의
숫자가 아니라 서로를 막는 네 방향**이다:

    ① 합성 포매팅 변형에서 `stale` **0**        ← 안 켜져야 할 때 안 켜진다
    ② 의미 변경에서는 **반드시** `stale`         ← ①의 짝. 없으면 ①이 「아무것도 안
                                                  켜는 감지기」로 만점을 받는다
    ③ `Undeterminable` 이 `Live` 로 **안 샌다**  ← 선행 구현이 `stale=False` 로 접었던
                                                  그 자리다([R-16])
    ④ `Orphaned` ≠ `Stale`                       ← 지우면 Orphaned · 고치면 Stale

**①만 있으면 상수 `Live` 를 내는 감지기가 통과하고, ②만 있으면 원문 해시가 통과한다.**
`[s2.pass]` ③ 이 *"둘을 함께 요구한다"* 로 적은 것과 같은 규율이고, 여기서는 축이
둘이 아니라 **넷**이다 — 이 기능은 상태를 하나가 아니라 **여러 값**으로 내기 때문이다.

그리고 이 기능이 거짓말하는 방향이 하나 더 있다. **`Undeterminable` 로 도망가는 것**이다.
판정 불가를 `Live` 로 접는 것이 [R-16] 이지만, **반대로 전부 `Undeterminable` 로 내면
①②③④ 를 전부 통과하면서 아무 쓸모가 없다** — DESIGN §15-42 의 *"지배하면 정직하지만
쓸모없다"* 다. 그래서 `Undeterminable` 비율에 **상한과 하한이 함께** 걸린다(`[f09.pass]`).

**F09 가 끝나면 무엇이 도는가**: `pal bind --radius <symbol|callers|closure:k|files:…>` ·
`pal query binding.status` 가 **상태 + 반경 + 무엇이 켰는가**를 낸다. 반경 밖의 변경은
여전히 안 잡히고, **그 사실이 산출에 실리는 것**이 이 설계의 요구다(§3).
"""

