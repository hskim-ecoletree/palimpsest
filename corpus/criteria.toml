# ③ 구조적 선행 — pal bind 가 엣지를 지우지 않는다
bind_preserves_edges = true
bind_grounds = """
**★ F06 이 실측해서 넘긴 결함이다**(`bind_erases_edges`). 검사의 형태:

    pal query graph.dump --json        → 엣지 E · built_for_this_snapshot true
    pal bind <이름> --note "…"
    pal query graph.dump --read-only   → 엣지 **E 그대로** · built_for_this_snapshot **true**

**`--read-only` 가 필수다.** 없으면 `pal query` 가 스티칭을 다시 돌려 증상을
**복구해 버린다** — F06 이 그것을 만들었기 때문에 이 검사가 가능하다.

