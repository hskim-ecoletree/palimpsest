queue_placement = """
**승인 큐를 저장하지 않는다. 거부 기록과 개체 이름만 의도 저장소에 둔다.**

`[f09].watch_placement` 가 같은 질문을 만났고 *"F05 의 반대 근거가 **2층 복제**에 걸린
것이라 의도 저장소 안에서는 안 걸린다"* 로 갈랐다. **여기서는 축이 다르다** —
가르는 것이 *"2층인가 의도인가"* 가 아니라 **「재생 가능한가」**다. [R-21] 이 그 축이다.

| 무엇 | 어디 | 근거 |
|---|---|---|
| 문서 조각 → 좌표 후보 (**제안**) | **저장하지 않는다. 다시 계산한다** | **결정론적 파생이다** — 같은 문서·같은 스냅샷·같은 신호 계단식이면 같은 후보다(자연어 유사도를 안 쓰는 것이 이것을 보장한다 · ③). 저장하면 **재생 경로를 하나 더 지어야 하고**, 재생 경로 없는 저장이 [R-21] 이 경고한 그것이다. ★ **그리고 2층에 두면 `[f05.2]` ④(*"2층의 모든 테이블이 1층+의도에서 재생되는가"*)의 모집단이 늘어 남의 게이트를 다시 판정해야 한다** — `[f09].watch_placement` 가 *"모집단이 안 늘어나는 것이 이 배치가 F05 의 합격선을 안 건드린다는 증거"* 라고 적은 그 자리다 |
| 개체 이름 (`origin` → `EntityId`) | **의도 저장소** | **민팅한 값은 재계산이 불가능하다**(`entity_identity`) |
| 승인 → `asserted` 결박 | **의도 저장소** (이미 있다) | `Binding` |
| **거부 기록** | **의도 저장소** | ★ **재생 불가.** *"사람이 이것을 거부했다"* 는 계산에서 안 나온다. 그리고 문서 §3.3 이 *"재질문 제거가 승인 비용 절감의 대부분"* 이라고 적었으므로 **지워지면 이 기능의 값이 사라진다** |
| **승인 큐 자체** | **저장하지 않는다 — 뷰다** | 큐 = 제안 − (승인 ∪ 거부). 셋 중 둘이 이미 저장되고 제안은 재계산되므로, 큐를 저장하면 그것이 **세 곳에 적힌 같은 것**이고 갈릴 자리가 생긴다(계획 §7 의 넷째) |

