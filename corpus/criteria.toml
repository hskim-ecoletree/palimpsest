axes_grounds = """
**`superseded ∧ stale` 조합이 실제로 산출된다** — 문서 §7 이 **픽스처**로 적은 그대로다.

**네 조합을 전부 만든다**: `(Current|Superseded) × (Live|Stale)`. 하나라도 표현되지
않으면 두 축이 아니라 한 축이다.

★ **반대 방향**: **대체된 결박의 코드 신선도가 계속 계산되는지**를 센다.
`Superseded` 가 되면 `code` 가 굳어 버리면 그것이 §6 이 기각한 *"한 열거에 다섯"* 과
같은 실패다 — 축이 둘인 이유가 그것이기 때문이다.

**만드는 경로는 픽스처뿐이고 그 사실을 게이트에 적는다**(`freshness_boundary` ⓒ).
승인 흐름은 F12 다.
"""

# ③ 커밋 시각을 표시용으로 동반 — 앵커로는 안 쓴다
commit_time_shown_not_anchored = true
time_grounds = """
**시각을 함께 싣되 앵커로 쓰지 않는다** — 문서 §6 이 선행 구현의 `code_bound_at` 을
기각하면서 *"다만 시각은 표시용으로 함께 싣는다"* 라고 적었다
(*"3주 전 코드 기준"* 이 *"12커밋 전"* 보다 읽힌다).

★ **반대 방향이 이 항목의 전부다**: **시각만 바뀌고 digest 가 그대로면 `Live` 여야
한다.** 같은 내용을 다른 커밋으로 다시 올린 경우가 그것이고, 켜지면 [R-07] 이 치명이라
부른 실패를 그대로 맞는다. **`cargo xtask check` 가 `state_of` 계산 경로에서 시각
낱말의 부재를 센다** — 표시 경로와 계산 경로가 갈려 있어야 한다.
"""

# ④ 감지기 신선도 연동
detector_freshness_linked = true
detector_grounds = """
**감지기 자신이 낡았을 수 있다** — 문서 §5 의 다섯째 행이다. `DetectorFreshness` 는
F01 이 **대장에** 세웠고, 여기서 **결박 상태와 잇는다**: 마지막 재추출 Snapshot ·
추출기 버전 · 이후 커밋 수가 `binding.status` 산출에 실린다.

**상수 시간 검사이므로 무한 후퇴하지 않는다** — 문서가 그렇게 적었고, 그것이 이 항목이
값싼 이유다.

★ **반대 방향**: **감지기가 낡았는데 결박이 `Live` 로 나오면** 그것은 *"유효하다"* 가
아니라 *"3주 전 기준으로 유효했다"* 다. 산출에 그 구별이 안 실리면 반증이다.
"""
on_failure = """
어긋난 것을 **전부** 목록으로 — 사유면 **어느 사유가 어떤 입력에서 `Live` 로 접혔는지**를,
축이면 **어느 조합이 표현되지 않는지**를. **건수만 적는 것은 위반이다.**
"""

