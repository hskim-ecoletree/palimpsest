judges = """
**「적중했다」가 참인가, 그리고 지우는 명령이 경계를 지키는가.**

두 문장이 아니라 하나다. 캐시는 **거짓말하기 가장 쉬운 부품**이고 —
`crates/pal-store/src/cache.rs` 자신이 *"「적중했다」고 말하는 코드는 아무것도 안 해도
짤 수 있다"* 라고 적었다 — 그 거짓말의 두 방향이 정확히 이 둘이다:

  · **덜 지키는 쪽**: 키가 새서 다른 파일의 산출을 돌려준다. 그러면 적중률이 높고
    답이 틀리다. [ADR-0004] 가 그 형태를 한 번 잡았다(빈 `.kt` 와 `.gitkeep`)
  · **더 지우는 쪽**: 지우는 명령이 파생층 밖으로 나간다. 그러면 사람의 노동이
    사라지고 **재구축 등가성 검사는 그 상태에서도 통과한다**([R-21])

그리고 이 기능에는 세 번째 거짓말이 있다 — **아무것도 안 하는 캐시가 만점을 받는
것**이다. 적중률을 재는 코드가 늘 `hit()` 를 부르면 숫자가 예쁘고 아무 일도 안 일어난
것과 구별되지 않는다. 그래서 아래 `pass` 의 넷에 ★(반대 방향)이 붙는다.

**이 기능의 산출은 「빨라졌다」가 아니라 「같다」이다.** 캐시를 켜고 끈 두 산출이
바이트로 같은 것이 이 부품의 정의이고, 속도는 그 다음이다.

[ADR-0004]: ../docs/adr/0004-cache-key-covers-every-input-that-decides-the-output.md
[R-21]: ../docs/plan/00-risks.md#r-21
"""

