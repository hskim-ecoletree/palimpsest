# [f22] — F22 그래프 스키마·무결성의 합격선
#
# 이슈 #3(에픽) · 하위 #42 · #43 · #44 · #45
# 위험 R-14(출처가 정체성의 성분이 아니면 판정이 붕괴한다) · R-29(D29 무결성)
#
# **코드보다 먼저 등록한다.** 등록 시점에 `schema/graph.toml` 도 `pal-core::schema` 도
# `pal doctor` 도 없다.
#
# 판정 기록: docs/gates/F22-1-schema.md · F22-2-derived-id.md ·
#            F22-3-chain-nodes.md · F22-4-doctor.md · F22.md(지붕)
# ═════════════════════════════════════════════════════════════════════════════

[f22]
issue = 3
sub_issues = [42, 43, 44, 45]
risks = ["R-14", "R-29"]
registered_at = "2026-08-12"
registered_before_any_code = true
decided_by = "에이전트 (소유자 위임 · 2026-08-12)"

# ─────────────────────────────────────────────────────────────────────────────
# 이 기능의 성격이 착수 시점에 바뀌었다 — 그 사실을 합격선의 머리에 적는다
# ─────────────────────────────────────────────────────────────────────────────

judges = """
F22 문서 §1 은 이렇게 적었다:

> **F01 이 첫 노드를 만드는 순간 스키마가 있어야 한다. 나중에 만들면 그것은 스키마가
> 아니라 이미 만들어진 것의 목록이다.**

**그런데 슬라이스 넷(S0~S3)이 먼저 갔고 스키마 없이 노드가 이미 만들어졌다.**
계획 §3 이 수직 슬라이스를 F01~F06 앞에 둔 구조적 결과이지 누구의 실수가 아니다.
그러나 결과로 F22 는 순수한 설계가 아니라 **"이미 있는 것의 정본화 + 나머지 설계"**
라는 이중 성격을 진다.

그래서 이 기능이 판정하는 것을 그 성격에 맞춰 적는다:

> **스키마를 코드에 맞추지 않고, 코드를 스키마에 맞출 수 있는가.**

후자가 아니면 F22 문서가 경고한 그 "목록"이 된다. 어긋나는 자리에서 **코드를 고치고**,
고칠 수 없으면 그 사실과 이유를 게이트에 **건수가 아니라 목록으로** 적는다.
조용히 스키마를 굽히는 것이 이 기능의 유일한 실패 방식이다.
"""

why_split = """
**한 이슈로 닫지 않고 넷으로 쪼갰다.** 근거는 둘이다.

1. **완료 체크리스트가 14 항목이고 슬라이스 하나보다 크다.** S0~S3 은 각각 합격선
   다섯 안팎이었다. 14 를 게이트 하나로 판정하면 *"통과, 단 ⑦⑧⑪ 제외"* 같은 기록이
   나오고 그것은 계획 §7.1 이 요구한 **셋 중 하나**가 아니다.
2. **넷이 서로 다른 것을 판정한다.** 정본화(#42)는 *어긋남이 있는가*를, id 규칙(#43)은
   *두 판정이 나란히 서는가*를, 사슬의 마디(#44)는 *T10 이 손으로 잰 것을 코드가
   재현하는가*를, `doctor`(#45)는 *깨진 것을 실제로 잡는가*를 판정한다.
   같은 게이트에 넣으면 하나가 다른 셋을 가린다.

**넷은 순서를 갖고 그 순서는 blocking 엣지로 트래커에 있다** — #42 → #43 → #44 → #45.
지붕(#3)은 넷이 다 닫힌 뒤 `docs/gates/F22.md` 로 판정한다.
"""

self_judged = """
[R-18](docs/plan/00-risks.md#r-18)(게이트를 스스로 판정한다 · 구조적·영구)이 여기에도
그대로 걸린다. **이 합격선을 정한 것도 판정할 것도 에이전트다.** S1~S3 과 같은 조건이고
같은 방식으로 줄인다 — 값을 결과보다 먼저 등록하고, 각 합격선에 **"이 검사가 고장 났다면
어떻게 드러나는가"** 를 통과 조건으로 함께 등록한다(음성 대조).

**F22 에서는 음성 대조가 특히 무겁다.** 이 기능의 산출은 *검사* 자체이므로,
음성 대조가 없으면 **아무것도 세지 않는 검사가 만점을 받는다.**
"""

# ═════════════════════════════════════════════════════════════════════════════
# [f22.1] — 스키마 파일과 정본화 (#42)
# ═════════════════════════════════════════════════════════════════════════════

[f22.1]
issue = 42
judges = "스키마를 코드에 맞추지 않고 코드를 스키마에 맞출 수 있는가"

[f22.1.oracle]
unit = "양방향 대조 + 로딩 거부"
why = """
**외부 정본이 없다.** *"이 그래프 스키마가 옳은가"* 를 말해 줄 바깥의 표가 존재하지
않는다 — 그 파일이 곧 정본이기 때문이다.

그래서 오라클을 **대조의 양방향성**과 **거부의 실재**로 잡는다. 둘 다 반증 가능하다:
스키마에서 노드 하나를 빼도 검사가 통과하면 그 검사는 아무것도 세지 않는 것이고,
어긋난 `producer` 를 넣었는데 로딩이 성공하면 정합 검사는 문장일 뿐이다.
"""

[f22.1.pass]

# ① 양방향 동기 — **양쪽 모두 0 이어야 한다**
code_not_in_schema = 0
schema_not_in_code = 0
sync_grounds = """
**양방향이다**(F22 §6). 코드에 있고 스키마에 없는 노드·엣지가 0 이어야 하고,
스키마에 있고 코드에 없는 것도 0 이어야 한다.

앞쪽만 보면 *"급할 때 코드에만 노드를 만든다"*(F22 §4)를 막지만, 뒤쪽을 안 보면
**스키마가 만들 수 없는 것을 선언한 채로 자란다** — 그것이 곧 온톨로지의 팽창이고
DESIGN §1.2 가 *"스키마가 자라는 것 자체가 관측 대상"* 이라고 적은 자리다.
"""

# ② 음성 대조 — **이 항목이 ① 의 0 을 의미 있게 만든다**
removing_one_node_from_schema_must_fail_check = true
negative_control_grounds = """
**이 검사가 고장 났다면 어떻게 드러나는가.**

①의 `0` 은 검사가 아무것도 세지 않아도 나온다. 그래서 **스키마에서 노드 라벨 하나를
지운 사본으로 검사를 돌리고, 그것이 실패하는 것**을 통과 조건으로 등록한다.
실패하지 않으면 ①은 측정이 아니라 장식이다.

**엣지 타입 하나를 지운 사본도 같이 시험한다** — 노드만 세고 엣지를 안 세는 검사가
있을 수 있고, 이 기능에서 엣지는 지금 코드에 **하나도 없어서** 특히 그렇다.
"""

# ③ producer ↔ provenance 정합은 **로딩 시점에 거부된다**
producer_provenance_mismatch_rejected_at_load = true
mismatch_fixtures_rejected = 6
mismatch_grounds = """
DESIGN §3.4: *"한 노드·엣지의 모든 속성은 같은 출처를 갖는다. 섞으려면 노드를 쪼개고
엣지로 잇는다."* 그리고 *"CI 검사가 아니라 파일 하나의 검사다 — 어긋나면 로딩 시점에
거부된다."*

**거부가 실제로 일어나는지 픽스처로 확인한다.** `producer` 여섯(`extractor` ·
`rule(좌표)` · `provider(id)` · `agent` · `human` · `machine-record`) 각각에 대해
그 `producer` 가 설 수 없는 `provenance` 를 가진 노드를 만들고, **여섯이 전부
로딩에서 거부되어야 한다.** `machine-record` 는 노드의 출처를 따르므로 그 자리는
*"어느 출처와도 어긋나지 않는다"* 가 통과 조건이다.
"""

# ④ 엣지 공통 넷 — 하나라도 없으면 등록 거부
edge_common_four_enforced = true
edge_missing_field_fixtures_rejected = 4
edge_grounds = """
**모든 엣지가 공통으로 지는 넷**: 해소 등급(§5.1) · 출처(§3) · 근거(§5.2, `inferred`
일 때 필수) · 발생 `Snapshot`. **넷이 없는 엣지 타입은 스키마에 등록되지 않는다**
(DESIGN §1.2).

넷 각각을 하나씩 뺀 픽스처 넷을 만들고 **넷이 전부 거부되어야 한다.**
`근거` 는 조건부 필수(`inferred` 일 때)이므로 그 조건에서 뺀 것으로 시험한다.
"""

# ⑤ 정본화의 어긋남은 **건수가 아니라 목록이다**
canonicalization_divergences_listed = true
divergence_grounds = """
**어긋난 자리를 전부 게이트에 적는다.** 건수가 아니라 목록이고, 각 항목이
**고쳤다 / 못 고쳤다 + 이유** 로 갈린다.

건수만 적으면 *"3건 어긋났고 고쳤다"* 가 되어 **무엇을 굽혔는지가 사라진다.**
이 기능의 유일한 실패 방식이 조용히 스키마를 굽히는 것이므로, 목록이 곧 판정 근거다.

**못 고친 것이 있어도 그 자체로 반증은 아니다.** 반증은 못 고친 것을 적지 않는 것이다.
"""

# ⑥ 스키마 규모는 매 게이트에 기록된다
schema_size_recorded = true
