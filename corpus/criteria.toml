entity_identity = """
**문서 조각의 `EntityId` 는 첫 인입에서 민팅하고, `(repo_id, path, anchor)` → `EntityId`
대응을 의도 저장소에 남긴다. 다시 인입하면 그 대응을 찾아 물려받는다.**

**왜 `EntityId::derived` 가 아닌가**: `entity.rs` 가 그 함수를 *"**옛 판을 올릴 때만
쓴다**. 새 개체는 이 함수로 만들지 않는다"* 로 못 박았다 — 씨앗이 같은 서로 다른 개체가
같은 이름을 갖기 때문이다. 그리고 씨앗을 경로로 잡으면 **경로 해시가 정체성이 되어**
`EntityId` 가 존재하는 이유(*"문서가 이동해도 유지"*)를 정면으로 깬다.

**왜 매번 민팅이 아닌가**: 같은 문서를 두 번 읽으면 개체가 둘이 된다. **의도 저장소의
읽기는 더하기이지 바꿔치기가 아니므로**(`[f05.4]` ②) 두 번 인입하는 것이 **정상 경로**다.

⚠ **그러므로 F10 이 세우는 것은 「`EntityId` 가 경로 해시가 아니다」까지이고, 문서가
실제로 **이동했을 때 다시 잇는 것**은 안 세운다.** 대응의 열쇠가 경로를 포함하므로,
이동은 새 열쇠 → 새 개체 → **옛 결박은 `orphaned`** 가 된다. **그것을 `does_not_prove`
에 적는다** — 미룬 것이 아니라 이 기능의 경계이고, 재료는 이미 있다
(`rebind::propose_with_shape` 가 심볼에 대해 하는 것의 문서판이다).

**이 결정이 틀렸다면 어떻게 드러나는가**: 같은 저장소를 두 번 인입했을 때 개체 수가
**두 배가 되면** 대응이 안 걸린 것이다. `[f10.1.pass]` 가 그것을 하한으로 센다 —
**두 번째 인입에서 새로 만들어진 개체가 0 이어야 한다.**
"""

