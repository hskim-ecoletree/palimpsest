★ **반대 방향**: **일괄 승인이 옳지 않은 것을 승인하면 반증이다.** 같은 파일로 묶인
조각 집합 안에 **후보가 여럿인 것**이 섞여 있으면 그것은 승인 대상이 아니다 —
`BatchRefusal::Ambiguous` 가 그것을 잡아야 한다.

⚠ **F09 의 `approve_batch` 는 `RebindProposal` 을 받는다.** 문서 조각의 제안은 다른
타입이므로 **그 함수를 재사용하려면 형태를 맞춰야 하고, 못 맞추면 규칙을 복제하게 된다.**
**복제하면 그것이 곧 두 곳에 적힌 같은 규칙이다**(계획 §7 넷째). 맞출 수 없으면
**그 사실과 이유를 게이트에 적는다** — 조용히 복제하지 않는다.
