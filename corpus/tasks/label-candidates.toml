"""
note = """
층 ②의 등록 패턴은 `[^{]*` 가 줄을 넘어가 **인터셉터·필터가 아닌 DTO를 잡는다**
(`ProcessSummaryDto` · `MessageResourceDto`). 풀 17건에 그 오탐이 섞여 있다.
**규칙을 고치지 않고 그대로 뽑았다** — 뽑은 뒤에 패턴을 조이면 그것이 사후 조정이다.
그리고 이 오탐은 판정 작업에 **해롭지 않다**: 판정자가 \"가드 아님\"을 골라야 하는
후보가 섞이는 것이 R-23의 과소추정 편향을 줄이는 쪽이다.
"""

