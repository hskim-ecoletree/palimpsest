# T2 — 라벨 판정의 후보 목록 (v2)
#
# **판단 성분만 잰다.** 후보 제시는 도구가 흡수하므로 측정 밖이다([R-23](../../docs/plan/00-risks.md#r-23)).
# 그래서 이 파일(후보 고정)이 **시간 측정 밖**에 있고, 측정은 이 커밋 이후에만 성립한다.
#
# **이 파일도 두 커밋으로 나뉜다.**
#   1) `[selection]` 만 담은 커밋 — 표집 규칙의 사전 등록  ← **지금 이 커밋**
#   2) `[[candidate]]` 를 채운 커밋 — 규칙을 돌린 결과. **이 커밋 시각이 측정 시작 이전이어야 한다**
#
# v1 은 은퇴했다: `label-candidates-v1-retired.toml`. 사유는 아래 `[selection.scope_defect]`.
# 정답 키는 이 파일에 없다 — `label-answer-key.toml` 로 분리했다.
#
# 판정 기록: docs/gates/preflight.md §T2

schema_version = 2
registered_at = "2026-08-11"
supersedes = "label-candidates-v1-retired.toml"

[selection]
corpus = "boxwood"
pin = "manifest.toml `[[corpus]] id=boxwood` 의 `[corpus.pin]`"   # 좌표는 경로가 아니라 (remote, SHA)
scope = "`.kt` · **git worktree 제외** · `src/main/` 만 (테스트는 제품 코드가 아니다) → 621개"

[selection.scope_defect]
# v1 을 죽인 결함. 재발을 막으려면 규칙이 무엇을 뜻했는지 적어 두어야 한다.
found_at = "2026-08-11"
statement = """
**v1 의 등록 범위는 자기모순이었다.** 문구는 `worktrees/ 제외` 였는데 수치 1,036 은
`portal-backend-aa-task/` 를 포함했다. 그 디렉터리는 별도 모듈이 아니라
`portal-backend` 의 **git worktree** 다(브랜치 `feat/aa-task`,
gitdir 이 `portal-backend/.git/worktrees/portal-backend-aa-task` 를 가리킨다).
`worktrees/` 디렉터리 **밖**에 놓여 있어 경로 규칙을 빠져나갔다.
"""
measured = """
· 범위 총계 1,036 = portal-backend 604 + portal-backend-aa-task 415 + boxwood-packages 17
· 두 worktree 가 **상대 경로까지 같은** 파일 397 건
· 그중 **바이트 단위로 동일** 289 건 → **풀의 27.9%가 클론**
· aa-task 전용(진짜 신규) 18 건
"""
why_it_matters = """
클론은 판정자에게 **구분 불가**하다. 두 번째로 만나는 것은 이미 읽은 코드라 판정이 빨리 끝난다 —
[R-23](../../docs/plan/00-risks.md#r-23)이 위험하다고 적은 **과소추정 방향**으로 정확히 작용한다.
그리고 한 브랜치가 이중 계산되어 표본의 대표성이 왜곡된다.
"""
resolution = """
**소유자 판단 A — 문구를 따른다.** 수치가 규칙을 돌린 결과여야지 규칙이 수치를 따라가면
그것이 사후 조정이다. worktree 를 제외하고 전면 재표집한다.
기록: docs/instructions/2026-08-11-owner-direction.md §1
**어느 쪽을 골라도 사후 선택이었다** — 그 사실을 지우지 않는다.
"""
exclusion_rule = """
앞으로 범위는 **경로 이름이 아니라 git 사실**로 정의한다:
`git -C <dir> rev-parse --show-toplevel` 이 자기 자신이 아니거나 `.git` 이 파일(gitdir 포인터)이면 worktree 다.
"""

# ── 층화 표집 ──
#
# 후보 풀은 세 층으로 나뉘고 크기가 극단적으로 다르다(①89 · ②10 · ③596).
# **합집합에서 그냥 뽑으면 대부분이 `@TenantTransactional` 한 종류로 찬다** — 판정이 반복
# 작업이 되고 '판단 성분'을 재는 목적을 잃는다.
#
# 그래서 층마다 몫을 정해 뽑는다. 이 선택은 [R-23](../../docs/plan/00-risks.md#r-23)이 경고한
# **과소추정 편향에 반대 방향으로 작용한다** — 층 ①·②에는 `validateSchema` 처럼
# 인가와 무관한 것이 많이 섞여 있어 **애매한 후보를 일부러 남긴다.**
#
# **층 ②의 정규식은 v1 그대로 둔다.** `[^{]*` 가 줄을 넘어가 인터셉터·필터가 아닌 DTO 를 잡는다.
# 뽑은 뒤에 패턴을 조이면 그것이 사후 조정이고, 이 오탐은 판정 작업에 **해롭지 않다**.
stratified = true

[[selection.stratum]]
id = "①"
name = "이름 규약"
pattern = 'fun\s+(check|validate|assert|require|ensure|verify)[A-Za-z0-9_]*'
pool = 89     # v1: 154
draw = 12
spacing_g = 7

[[selection.stratum]]
id = "②"
name = "인터셉터·필터 클래스"
pattern = 'class\s+([A-Za-z0-9_]+)[^{]*:[^{]*(Interceptor|Filter)\b'
pool = 10     # v1: 17
draw = 6
spacing_g = 1
degenerate = """
**등간격 규칙이 여기서 퇴화한다.** g = floor(10/6) = 1 이라 인덱스 0·1·2·3·4·5,
곧 **정렬 순서 앞에서 6개**를 자르는 것과 같다. 풀 10 이 전부 `portal-backend/` 한 모듈이라
모듈 편중은 새로 생기지 않지만, **`config/` 와 `shared/` 아래가 통째로 빠진다**
(`TenantInterceptor` · `WebSecurityConfig` · `MessageResourceDto` 가 후보에서 제외된다).
**draw 를 5 로 줄이면 g=2 가 되어 퍼지지만 등록된 몫을 사후에 바꾸는 것이라 하지 않았다.**
개입을 줄이는 쪽을 택하고 편향을 적는다.
"""

[[selection.stratum]]
id = "③"
name = "가드성 어노테이션"
pattern = '@([A-Za-z]*(Permission|Auth|Secure|Audit|Tenant)[A-Za-z]*)'
pool = 596    # v1: 1016
draw = 12
spacing_g = 49

[selection.draw_rule]
sort = "층마다 (경로, 줄번호) 오름차순. 후보 번호는 층 순서 ①→②→③ 로 이어 붙인 0..29"
spacing = "층마다 g = floor(pool / draw), 인덱스 0·g·2g·… 로 draw 건 (T7이 쓴 등간격 규칙과 동형)"
total_unique = 30
implementation_verified = """
**구현이 v1 의 추첨을 30/30 재현했다.** 같은 코드에 v1 의 범위(worktree 포함)를 주면
은퇴한 후보 30건이 순서까지 정확히 나온다 — 그래서 이 구현은 등록 규칙의 충실한 집행이고,
바뀐 것은 범위뿐이다.
"""

[selection.duplicates]
count = 3
blinding = """
**v1 의 블라인드는 깨졌다 — 에이전트가 심은 자리(11·22·33)를 소유자에게 공개했다.**
그래서 v2 는 자리를 **규칙의 형태로만** 사전 등록하고 **실례는 등록하지 않는다.**
씨앗과 그 결과는 `label-answer-key.toml` 에만 있다.
"""
method = """
씨앗 `seed` 로 결정되며, 판정이 끝난 뒤 누구나 다시 계산해 검증할 수 있다.

  h(k) = int(SHA256(f"{seed}|{k}").hexdigest(), 16),  k = 0,1,2,…

1. **중복 대상**: k 를 0 부터 올리며 `h(k) % 30` 을 취해 **서로 다른 3개**를 얻는다 → D
2. **재삽입 자리**: 이어지는 k 에서 `h(k) % 33 + 1` 을 취해 아래를 모두 만족하는 3개를 얻는다
     · 서로 다르고 **인접하지 않는다** (|p − p′| ≥ 2)
     · **8 이상** — 앞 7자리는 판정자가 손을 푸는 구간이라 비운다
     · 최종 시퀀스에서 **원본보다 최소 5 뒤**에 온다
3. 자리를 오름차순으로 놓고, 나머지 30 칸을 고유 후보의 추첨 순서대로 채운다 → 33건
"""
why = "같은 후보를 다시 만났을 때 판정자가 **다시 물었는가**(재질문율)를 잰다. 분모는 3이다"
presentation = """
**판정표는 33건을 한 화면에 보여주지 않는다.** v1 의 실패 경로였다 — 눈으로 훑으면 중복이 그냥 보인다.
v2 는 `corpus/tasks/t2-items/NN.md` 로 **한 건에 한 파일**이고, 판정표에는 후보의 정체가 없다.
"""

[selection.question]
asked = "이것이 **인가 가드**인가 · 근거 좌표는 어디인가"
answer_form = "가드 예/아니오 + 근거 좌표(파일·심볼) 또는 '없음'"

[selection.interpretation]
note = """
이슈는 '후보 목록 30건'과 '판정 30건'을 둘 다 적었다. 여기서는
**고유 후보 30건 · 판정 시퀀스 33건(중복 3건 포함)** 으로 읽는다.
'판정 30건'은 고유 30건을 가리키고, 재질문율의 분모 3은 그 위에 얹힌다.
"""

falsified_if = "라벨 판정이 감당 불가한 시간을 먹으면 감사(F15)·구조 평가(F20)를 산출 목록에서 내린다. 큐레이션·컨설팅만 남긴다."

[bias_direction]
statement = """
**이 측정은 판단 성분만 잰 것이고 후보 제시 비용은 도구가 흡수한다고 가정했다.
가정이 틀리면 F15·F18의 판정은 낙관적이다.**

[R-23](../../docs/plan/00-risks.md#r-23)이 적은 두 편향 중:
· **과대추정 방향**(손으로 후보를 찾는 시간이 더해짐)은 **제거했다** — 후보 고정이 측정 밖이다.
· **과소추정 방향**(애매한 후보를 자연히 건너뜀)은 **줄였으나 없애지 못했다** — 층화로
  인가와 무관한 후보를 일부러 남겼지만, 층 자체를 정규식으로 정의했으므로
  **정규식에 걸리지 않는 가드는 애초에 후보가 되지 않는다.** 그 몫은 여전히 과소추정이다.
· **클론 방향은 v2 에서 제거했다** — v1 에서는 풀의 27.9%가 바이트 동일 클론이라
  두 번째 판정이 부당하게 빨랐다. worktree 제외로 없앴다.
"""
residual = """
**남은 것 셋을 적는다.**
① 층 ②의 등간격 퇴화(위 `degenerate`) — `config/`·`shared/` 가 후보에서 빠진다.
② boxwood 는 편의 표본이다([R-19](../../docs/plan/00-risks.md#r-19)). v2 도 이것을 고치지 않는다.
③ 범위를 좁혀 풀이 1,036 → 621 로 줄었다. **층 ③은 596건이 여전히 대부분 `@TenantTransactional` 이다.**
"""
