**2026-08-11 재확인 — 30/30 해소.** `[corpus.pin]` 의 고정 SHA에서 `git show <sha>:<path>` 로
후보 30건의 (파일, 줄, 심볼)을 대조했다. 파일 없음 0 · 줄 불일치 0.
