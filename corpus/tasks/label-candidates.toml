defect_found = """
**2026-08-11 — 이 표집에 결함이 둘 있다. 판정 시작 전에 발견했다.**

① **`unique = 30` 이 사실과 다르다. 고유 좌표는 28 이다.**
   층화 표집이 층을 가로질러 같은 좌표를 두 번 뽑았다:
     · `MultiTenantTransactionManager.kt:166#validateTenantRegistration` (시퀀스 4·12)
     · `DashboardDto.kt:22#ProcessSummaryDto` (시퀀스 15·19)
   뒤엣것은 이 파일이 이미 오탐이라고 적어 둔 그 건이다(층 ② 의 `[^{]*` 가 줄을 넘어 DTO 를 잡았다).
   **오탐을 남긴 것은 의도였으나 같은 좌표를 두 번 뽑은 것은 의도가 아니다.**

② **재질문율의 블라인드가 깨졌다.** 판정자가 마주치는 반복은 3회가 아니라 5회이고,
   순서가 11(심은 것) → 12(사고) → 19(사고) → 22 → 33 이라 **22·33 은 이미 반복을
   세 번 겪은 뒤**다. 프라이밍이 걸린다.
   그리고 판정표가 33행을 한 화면에 보여주므로 눈으로 훑으면 중복이 그냥 보인다.

③ **그리고 2026-08-11 세션에서 심은 중복의 자리(11·22·33)를 소유자에게 공개했다.**
   결함을 보고하는 과정에서 났고, **이 판정표로 재질문율을 재는 길은 그 시점에 닫혔다.**
   숨기지 않고 적는다 — 측정을 못 하게 된 사실 자체가 기록되어야 한다.

**처분은 소유자 판단 대기.** docs/instructions/2026-08-11-pending-decisions.md §1
"""

