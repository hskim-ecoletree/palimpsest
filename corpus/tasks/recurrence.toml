# ── F11이 이 표에서 가져가야 할 것 ──
#
# 1. 재발 5건 중 3건(케이스 1·3·5)에서 **깨진 규칙이 그 좌표에 이미 글자로 있었다** —
#    주석 또는 직전 커밋. `touch` 가 그것을 띄우기만 하면 되는 형태다. 반대로 말하면,
#    글자가 코드 옆에 있어도 읽히지 않았다는 뜻이고 그것이 F11의 존재 이유다.
# 2. 재발의 지배적 형태는 '몰랐다'가 아니라 **'경로 하나를 빠뜨렸다'** 이다 (I1·I2 둘 다).
#    `touch(좌표)` 만으로는 부족하고 "이 규칙을 지켜야 하는 다른 좌표가 어디인가"라는
#    역방향 질의가 필요하다. F05 BOUND_BY 역색인이 그 질의를 받는 자리다.
# 3. 케이스 4의 `coord_caveat` — 결함 좌표를 '가장 많이 바뀐 파일'로 정하면 헬퍼를 가리킨다.
