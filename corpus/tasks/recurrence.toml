# T8 — 재발 사례 (커밋, 파일, 심볼, 떴어야 할 규칙)
#
# F11(적시 제시 `touch`)의 **유일한 직접 효능 측정**이 이 표에 걸려 있다.
# 나중에 고르면 결과를 보고 사례를 고르는 것이 되어 게이트가 무효가 된다(R-18).
#
# 이 파일은 두 커밋으로 나뉘어 만들어진다:
#   1) `[selection]` 만 담은 커밋 — 선정 규칙의 사전 등록. 이 커밋 해시가 등록 증거다.
#   2) `[[case]]` 를 채운 커밋 — 규칙을 기계적으로 적용한 결과.
#
# 판정 기록: docs/gates/preflight.md §T8

schema_version = 1
registered_at = "2026-08-11"   # [selection] 을 커밋한 날. 사례는 이 뒤에 채워진다.

# ─────────────────────────────────────────────────────────────────────────────
# [selection] — 선정 규칙. 사례를 하나도 보기 전에 고정한다.
# ─────────────────────────────────────────────────────────────────────────────

[selection]

# ── 모집단 U ──
# T10ⓐ와 같은 모집단을 쓴다. 한 번 고정하고 두 작업이 공유한다.
repo = "~/dev/projects/ditto"
head = "aded7ce7f88feb3c03238c5f9760f3a2ade4a6c1"   # main, 2026-07-24
universe = """
git log --no-merges <head> 로 도달 가능한 커밋 중
  · 제목이 `fix` 또는 `revert` 로 시작(대소문자 무시)하고
  · 스코프가 `(docs)` 가 아니며
  · 제목에 `비-코드` 가 없는 것.
문서 수정은 코드 결함이 아니므로 뺀다.
"""

# ── 재발 클래스를 만드는 축 ──
# 파일 축(같은 파일이 여러 번 고쳐졌다)은 "같은 종류의 실수"를 보장하지 않는다.
# 증상 축(수정 커밋이 스스로 이름 붙인 고장 이름)이 종류에 더 가깝다.
class_axis = "symptom-token"
tokenize = """
커밋 제목에서 ① 선행 `type(scope):` 와 ② 말미 괄호 트레일러 `(...)` 를 제거한 뒤,
정규식 `[A-Za-z][A-Za-z0-9_-]{5,}` 로 토큰을 뽑아 소문자화한다.
"""
stopwords = ["behavioral", "structural", "behaviour", "behavior", "non-behavioral"]
class_min_commits = 3          # |C(t)| >= 3 인 토큰 t 만 후보 클래스가 된다
class_order = "|C(t)| 내림차순 → C(t) 최초 커밋 시각 오름차순 → t 사전순"

# ── 검사 순서와 채택 ──
# 검사 '순서'를 규칙이 정하므로, 결과를 보고 사례를 고를 여지가 없다.
adopt = """
상위 클래스부터 순서대로 diff 를 읽는다.
  · 동일 불변식(좌표에 걸 수 있는 한 문장의 규칙) 위반인 커밋만 남긴다.
  · 남은 것이 2건 미만이면 그 클래스는 버리고 다음으로 간다.
  · 남은 커밋을 시각 오름차순으로 놓고 **최초 1건을 제외한** 나머지를 사례로 채택한다.
    최초 발생은 재발이 아니다 — 그 시점에 `touch` 가 띄울 선행 결정이 아직 없다.
  · 5건이 찰 때까지 다음 클래스로 넘어간다.
"""

# 각 사례의 좌표를 정하는 법 (사후 재량 금지)
coord_rule = """
파일  = 그 커밋 diff 에서 `src/**` 중 변경 줄 수가 가장 많은 파일 (동률이면 경로 사전순).
심볼  = 그 파일에서 변경 줄을 포함하는 최상위 선언명. 최상위 선언 밖이면 파일 수준으로
        적고 '심볼 없음'이라고 명시한다 — 대표값으로 채우지 않는다.
"""

# 떴어야 할 규칙의 자격
rule_rule = """
'떴어야 할 규칙'은 그 재발 시점에 **이미 존재하던** 근거에서만 도출한다
 (클래스의 최초 발생 커밋, 또는 그보다 앞선 ADR·설계 문서).
선행 근거가 없으면 그 사례는 `touch` 가 띄울 것이 없으므로 5건에 넣지 않는다.
근거의 해시 또는 경로를 사례마다 함께 적는다.
"""

falsified_if = "위 규칙으로 5건을 채우지 못하면 반증. F11의 직접 효능 측정이 성립하지 않고 대리 측정(F12 계획 이탈률)만 남는다 — 명시하고 진행한다."
