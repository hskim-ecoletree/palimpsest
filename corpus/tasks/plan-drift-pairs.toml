# T11 M2 — 계획 이탈률의 D·A 쌍 (부분 구제)
#
# **이것은 측정 원본이 아니다.** T11이 등록한 M2의 arm A는 **17쌍**이었고,
# 여기 담긴 것은 그 뒤 살아남은 **9쌍**이다. 8쌍은 이미 없다.
#
# 왜 잃었나: 선언 D(`change_surface`)는 ditto의 **gitignored** `.ditto/local/work-items/`
# 아래에만 있다(`.gitignore:479`). 실제 A(`changed_files`)는 `.ditto/work-items/` 로
# 커밋되지만 D는 안 된다. `criteria.toml` §M2 가 caveat에 적어 둔 취약함이 그대로 발동했다.
# tracked 위치에서 `change_surface` 를 가진 파일은 **0건**이다(2026-08-11 확인).
#
# 그래서 지금이라도 뜬다. 남은 9쌍도 `.ditto/local/` 한 번 지우면 사라진다.
#
# **이 파일로 M2를 계산하면 안 된다.** 17쌍 중 9쌍은 무작위 표본이 아니라
# '늦게 만들어져 아직 안 지워진 것' 쪽으로 치우쳐 있다(생존 편향).
# 쓸 수 있는 것은 하나뿐이다 — **D·A 쌍이 실제로 어떻게 생겼는지의 실물**.
#
# 판정 기록: docs/gates/preflight.md §T11
# 지표 정의: corpus/criteria.toml [outcome] M2

schema_version = 1
salvaged_at = "2026-08-11"
corpus = "ditto"
pin = "manifest.toml `[[corpus]] id=ditto` 의 `[corpus.pin]`"

registered_n = 17          # T11이 등록한 M2 arm A 의 쌍 수
salvaged_n = 9             # 지금 남아 있는 것
lost_n = 8
tracked_source_n = 0       # git 에 보존된 D 는 없다

# ── 뜨자마자 눈에 걸린 것 하나 ──
#
# 9쌍 중 **3쌍이 D 와 A 가 완전히 같다.** 이탈률 0 일 수도 있고,
# D 가 A 에서 사후 기입됐다는 뜻일 수도 있다. 후자면 **M2 는 아무것도 재지 않는다.**
# T11 은 D 가 '승인 시점에 동결'된다고 적었으나 그 동결을 이 데이터로 확인하지는 못했다.
# 관측만 적는다 — 9쌍은 판단하기에 얇고, 판정을 바꾸지 않는다.
identical_pairs = 3
identical_note = "F12(계획 결박)이 이탈률을 지표로 쓰기 전에 D 의 기입 시점을 먼저 확인해야 한다"

