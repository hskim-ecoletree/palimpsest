# T6 — 온톨로지 저작 가능성 (개념 20개 · 관계 · 지목 가능률)
#
# 개념 20개 중 코드를 지목할 수 있는 것이 소수면 **온톨로지 층은 결박 없는 덩어리다.**
# 자리만 비워 두고 층은 만들지 않는다.
#
# **이 파일도 두 커밋으로 나뉜다.**
#   1) `[[concept]]` · `[[relation]]` 만 담은 커밋 — 개념의 사전 등록. **코드를 찾기 전이다.**
#   2) `[applied]` 를 채운 커밋 — 지목을 시도한 결과.
#
# 순서가 뒤바뀌면 **지목 가능률이 정의상 100%가 된다** — 코드에서 개념을 뽑으면
# 그 개념은 언제나 코드에 있다. 그것이 이 작업의 가장 조용한 실패 경로다.
#
# 판정 기록: docs/gates/preflight.md §T6

schema_version = 1
registered_at = "2026-08-11"

[selection]
corpus = "boxwood"
pin = "manifest.toml `[[corpus]] id=boxwood` 의 `[corpus.pin]`"   # 좌표는 경로가 아니라 (remote, SHA)
source = "boxwood-workspace @ b4985d8fb93d:CONTEXT.md (339행 — `[ARCHIVED]` 표시가 붙은 제안서는 쓰지 않았다)"
source_reproduced = "2026-08-11 확인 — `git show b4985d8fb93d:CONTEXT.md | wc -l` = 339. 현행 팁(3a1cda8)의 판과도 동일하다"
rule = """
개념은 **제품 문서에서** 뽑는다. 코드에서 뽑지 않는다.
개념명은 **코드 식별자로 적지 않는다** — `ProcessMeta` 가 아니라 '프로세스 메타'.
관계는 (주어, 관계, 목적어) 삼항으로 적는다.
개념·관계를 커밋한 **뒤에** 코드를 찾는다.
"""
judged = """
지목 등급 셋 (경로/이름 수준. 심볼 인덱스가 없으므로 **좌표 정확도가 아니라 지목 가능 여부**를 센다):
  · 성공 — 이 개념을 담는 코드의 경로/이름을 댈 수 있고 그것이 실재한다
  · 부분 — 관련 코드는 있으나 그 개념 전용이라고 말할 수 없다 (여러 곳에 흩어짐 · 다른 것과 섞임)
  · 실패 — 담는 코드를 지목할 수 없다
"""

[bias_direction]
statement = """
**출처 문서(`CONTEXT.md`)는 일부 절에서 클래스·경로 이름을 함께 적는다**
(§'주요 도메인 모델' 표 · §'구조' 코드 트리 · §RBAC 모듈).
그 절들을 지우면 개념 집합이 대표성을 잃으므로 **지우지 않았고, 대신 편향을 여기 적는다.**

**이 측정의 지목 가능률은 위로 편향돼 있다** — 문서가 이미 코드 이름을 알려 준 개념이
섞여 있기 때문이다. 아래 각 `[[concept]]` 의 `doc_named_code` 가 그 여부를 표시하고,
`[applied]` 는 **그 표시가 없는 개념만의 지목 가능률을 따로 낸다.**
그 부분집합이 '문서가 도와주지 않을 때'의 값에 더 가깝다.
"""

falsified_if = "개념 20개 중 코드를 지목할 수 있는 것이 소수면 온톨로지 층은 결박 없는 덩어리다. 자리만 비워 두고 층은 만들지 않는다."

