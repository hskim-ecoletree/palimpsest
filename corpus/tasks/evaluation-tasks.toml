# 평가 과제 — palimpsest 가 무엇에 답해야 하는가
#
# **인수 기준: 과제 5건 이상이 각각 질문 / 기대 산출의 형태 / 채점 절차를 갖는다.**
# 여기 일곱 건이 있다.
#
# ── 이 파일이 등록하는 것과 등록하지 않는 것 ────────────────────────────────
#
# 등록한다  — 질문 · 기대 산출의 **형태** · 채점 **절차** · 쓰는 코퍼스 · 쓰는 대조군
# 등록 안 한다 — **수치 합격선.** 그것은 그 기능의 첫 코드 커밋 이전에 criteria.toml 에
#               등록한다(P0-preflight §5.1). 아무도 재본 적 없는 값에 지금 선을 그으면
#               그것은 근거가 아니라 소원이다.
#
# ── 왜 이 일곱인가 ──────────────────────────────────────────────────────────
#
# goals §2가 산출 여섯의 순위를 정했고 §0.1이 P1의 약속을 **(a)(d)** 로 줄였다.
# 과제는 그 둘에서 도출된다 — 임의로 고르지 않는다.
#
#   E1 큐레이션 ← 목표1(P1) · (a)        E5 낡음     ← §3.3 · G1
#   E2 컨설팅   ← 목표2(P1) · (d)        E6 도달하한 ← (c) 축소형 · T10ⓑ 처분
#   E3 재발     ← (d) · F11의 유일한 직접 효능    E7 규모 ← G5 · R-24
#   E4 미해소   ← §3.1 · G3
#
# **(b)에 걸린 과제는 없다.** T9가 조달을 반증해 P1의 약속에서 빠졌기 때문이다.
# 없는 것을 과제로 두면 그 자리가 빈 채로 통과한다.
#
# 판정 기록: docs/gates/preflight.md §T5

