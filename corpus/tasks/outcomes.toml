# 표본이 아니고 지목 가능률에 세지 않는다. R-27의 **처분**을 정할 때 쓰라고 적는다.
[journey_result.aside]
scope = "규칙 밖 · 표본 아님 · 판정에 넣지 않음"
observation = """
J2(`docs/features/<name>.md` ↔ `src/cli/commands/<name>.ts`)는 **38쌍**이 성립하고,
각 명령 파일이 `export const <name>Command` 라는 명명된 최상위 선언 하나를 갖는다
(`acg-review` → `acgReviewCommand`, `architecture` → `architectureCommand`, `autopilot` → `autopilotCommand`).
즉 **진입점 좌표 자체는 기계적으로 나온다.** 나오지 않는 것은 '이 진입점들이 한 여정이다'라는 선언이다.
R-27 §4가 예상한 그대로이고, 처분이 (c)를 '진입점에서 시작하는 도달 하한'으로 축소하라고
한 것과 방향이 맞는다.
"""

# ── R-27이 이 표에서 가져가야 할 것 ──
#
# 1. **저작 뿌리는 넷이 아니라 셋이다.** `Change`·`Actor`(git 결정론) + `Defect`(소급 결박 가능)
#    는 저작을 요구하지 않고, `Journey` 하나만 남는다. 16분의 1이 아니라 8분의 1이다.
# 2. **여정이 존재하는 곳에서도 그것은 새 저작의 산물이었다.** ditto가 가진 여정 3건은
#    e2e 기능을 실증하려고 사람이 새로 쓴 것이지, 이미 있던 것에 올라탄 것이 아니다.
#    "올라탈 곳이 있는가"의 답은 아니오다.
# 3. **`Defect` 를 코드 좌표에만 걸면 5건 중 1건을 잃는다** (afcfefab — 프롬프트 결함).
# 4. **도입 커밋 결박의 신뢰도는 삭제 줄 수에 걸린다.** 줄이 적으면 blame 과반은 신호가 아니다.

