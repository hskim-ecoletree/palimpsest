# T10 — 여정·결함의 올라탈 곳 (소급 결박 지목 가능률)
#
# R-27의 판정: `Journey`·`Defect` 를 **새 저작 없이** 기존 산출물에서 얻을 수 있는가.
# 없으면 저작 뿌리가 둘에서 넷으로 늘고, 남는 것은 4분의 1에서 16분의 1이 된다.
#
# 이 파일도 두 커밋으로 나뉜다:
#   1) `[selection]` 만 담은 커밋 — 선정 규칙의 사전 등록.
#   2) `[[defect]]` · `[[journey]]` 와 집계를 채운 커밋.
#
# 규칙을 고정하기 전에 조사한 것은 **어떤 산출물이 존재하는가**(구조)뿐이고,
# 지목 가능 여부(결과)는 규칙을 고정한 뒤에 쟀다.
#
# 판정 기록: docs/gates/preflight.md §T10

schema_version = 1
registered_at = "2026-08-11"

# ─────────────────────────────────────────────────────────────────────────────
# ⓐ 결함 5건 — 도입 커밋과 발현 좌표를 지목할 수 있는가
# ─────────────────────────────────────────────────────────────────────────────

[selection.defect]

repo = "~/dev/projects/ditto"
head = "aded7ce7f88feb3c03238c5f9760f3a2ade4a6c1"
universe = "T8(`recurrence.toml`)의 모집단 U와 동일 — `fix`/`revert` 커밋, `(docs)`·`비-코드` 제외"

# 수정 커밋 축으로 잡는다. 이슈 트래커 결박 여부는 커밋이 참조하는 `#\\d+` 로 함께 측정된다.
sample = """
U를 커밋 시각 **오름차순** 정렬해 N건. g = floor(N/5).
인덱스 0, g, 2g, 3g, 4g 의 5건을 뽑는다 (T7이 쓴 등간격 표본 규칙과 동형).
"""

# 판정 등급 — 사전 고정. 결과를 보고 등급을 만들지 않는다.
grade_symptom = """
발현 좌표:
  · 라인 수준 성공 — diff 에 `src/**` 파일의 삭제/수정 줄이 있고, 그 (파일, 수정 전 라인범위)를 낼 수 있다
  · 심볼 수준 성공 — 삭제 줄 없이 순수 추가만이면, 추가 지점을 감싸는 최상위 선언명까지
  · 실패        — `src/**` 파일 변경이 전혀 없다
"""
grade_origin = """
도입 커밋:
  · 성공          — 발현 좌표의 삭제 줄에 `git blame` 을 돌려 최빈 커밋이 삭제 줄의 과반(>=50%)을 차지
  · 실패(분산)    — 과반을 차지하는 커밋이 없다
  · 실패(누락형)  — 순수 추가라 blame 대상 줄이 없다. 별도로 표기한다
"""
grade_tracker = "커밋 제목·본문에 `#\\d+` 또는 `wi_[a-z0-9]+` 가 있으면 트래커/작업항목 결박 성공"

# ─────────────────────────────────────────────────────────────────────────────
# ⓑ 여정 3건 — 진입점 좌표를 지목할 수 있는가
# ─────────────────────────────────────────────────────────────────────────────

[selection.journey]

universe = """
계층으로 정의한다. 상위 계층을 먼저 소진하고 모자란 만큼만 아래로 내려간다.
  J1 — ditto 워킹트리의 `*.journey.md` (이미 '여정'이라고 선언된 e2e DSL 인스턴스). `dist/` 제외
  J2 — `docs/features/<name>.md` 중 `src/cli/commands/<name>.ts` 가 실제로 존재하는 것
각 계층 안에서 경로 사전순.
"""
sample = "J1 사전순 상위부터, 모자라면 J2 사전순 상위부터. 합계 3건."

grade = """
진입점 좌표:
  · 성공  — 여정의 시작 동작에 대응하는 **제품 코드의 최상위 선언**을 `repo:path#name` 으로 지목할 수 있고
            그 선언이 해당 저장소에 실제로 존재한다
  · 부분  — 파일까지만 지목 가능하고 심볼을 특정할 수 없다
  · 실패  — 대응하는 제품 코드가 이 저장소에 없다 (예: 외부 대상 앱)
"""

falsified_if = "소급 결박할 수 없으면 `Journey` 를 내리고 (c)를 '진입점에서 시작하는 도달 하한'으로 축소한다. `Defect` 는 자리만 두고 필수로 만들지 않는다. 축소했다는 사실을 goals §0.1에 적는다."
