# T3 — 절감 장치 측정의 후보 목록
#
# **이 커밋은 `[selection]` 만 담는다.** `[[candidate]]` 는 규칙을 돌린 결과이며
# 다음 커밋에 온다 — T2 가 지킨 두 커밋 분할과 같다(label-candidates.toml 머리말).
#
# 설계·지표·처분은 t3-protocol.md 에 있다. 여기는 **표집 규칙만** 적는다.
# 판정 기록: docs/gates/preflight.md §T3

schema_version = 1
registered_at = "2026-08-12"
task = "T3 — 단가 절감 장치 넷을 분리 측정"

[selection]
corpus = "boxwood"
pin = "manifest.toml `[[corpus]] id=boxwood` 의 `[corpus.pin]`"
scope = "T2 v2 와 **완전히 동일**하다 — `.kt` · `src/main/` 만 · git worktree 제외 → 621 파일"
strata = "T2 v2 의 층 정의(정규식)를 **그대로** 쓴다. 바꾸면 T2 의 22.9초와 나란히 놓을 수 없다"
pool_reproduced = """
등록 전에 T2 의 풀을 재현해 규칙이 같은지 확인했다 — **621 파일 · ①89 · ②10 · ③596.**
label-candidates.toml 의 등록값과 정확히 같다. 스캔은 파일 전체 텍스트를 대상으로 하며
(층 ②의 `[^{]*` 가 줄을 넘는 것이 T2 의 알려진 성질이다) 좌표는 경로가 아니라 (repo, SHA) 다.
"""

[selection.exclusion]
rule = "T2 v2 가 뽑은 **고유 30건의 (파일, 줄)** 을 제외한다"
why = """
같은 후보를 다시 내밀면 판정이 아니라 상기다. **절감 효과가 부당하게 커진다**(과대추정) —
장치가 낸 값과 기억이 낸 값을 구분할 수 없게 된다.
"""
remaining = "제외 후 잔여 — ① 77 · ② 4 · ③ 584"

[selection.stratum_2_dropped]
statement = """
**층 ②(인터셉터·필터)는 T3 에서 쓰지 않는다.** 풀 10 중 T2 가 6을 가져가 4만 남았고,
일괄 승인 묶음 하나(8건)도 채우지 못한다. 억지로 채우면 층 ② 가 사실상 전수조사가 되어
'표집'이 아니게 된다.
"""
consequence = "T3 의 결과는 층 ①·③ 위의 값이다. 층 ② 에서 절감이 다르게 나올지는 **모른다.**"

# ── 블록별 몫 ──
#
# 뽑는 순서가 재현성을 정한다. **D 를 먼저 확정하고 그 좌표를 제외한 뒤** 층별 등간격을 돌린다 —
# D 는 층이 아니라 파일 단위로 뽑으므로 나중에 돌리면 겹침 처리가 결과에 의존하게 된다.

[selection.block_d]
name = "D — 올라타기(대리: 문맥 재사용)"
draw = 8
rule = """
1. 층 ①·③ 의 잔여 후보를 파일별로 세어 **4건 이상인 파일**만 남긴다(경로 오름차순).
2. 그 목록에서 등간격 2개를 고른다 — g = floor(len / 2), 인덱스 0 · g.
3. 각 파일에서 **줄번호 오름차순 앞 4건**을 그 순서대로 쓴다.
"""
pool = 54          # 4건 이상 남은 파일 수. 등록 전에 셌다
why = "첫 건이 파일 문맥을 지불하고 후속 3건이 그 위에 올라탄다. **①의 하한이지 ①이 아니다**"

[selection.block_strata]
name = "A1 · A2 · C · B — 층별 등간격"
rule = """
층 ① 과 층 ③ 에서 **각각 15건**을 등간격으로 뽑는다 — g = floor(잔여 / 15), 인덱스 0·g·2g·….
잔여는 (T2 30건 + 위 D 8건)을 제외한 뒤의 수다.
뽑힌 순서대로 아래에 배분한다. **층 몫을 1:1 로 둔 것은 T2(①12 : ③12)와 같은 비율이다.**
"""
allocation = """
층 ① 15건 → A1 2 · A2 2 · C 3 · B 묶음2 8   (뽑힌 순서대로)
층 ③ 15건 → A1 2 · A2 2 · C 3 · B 묶음1 8   (뽑힌 순서대로)
"""
sequence = """
제시 순서는 t3-protocol.md 의 블록 순서를 따른다 — A1(4) → D(8) → B(16) → C(6) → A2(4) → E(2) → F(2).
A1·A2·C 안에서는 **층 ③ 을 먼저, 층 ① 을 뒤에** 놓는다(T2 의 층 순서 ①→③ 과 반대이며,
층 순서가 난이도 순서로 읽히지 않게 하기 위함이다).
"""

[selection.reuse]
name = "E · F — 재제시 (새 후보 아님)"
e_rule = "앞 블록에서 **'가드 아님'으로 판정된 것 중 시퀀스가 가장 이른 2건**. 판정 결과에 의존하므로 실행 중에 정해진다"
f_rule = "B **각 묶음의 3번째 건**. 결과와 무관하게 **지금 사전 지정된다** — 뒤에 고르면 뒤집힐 것을 골랐다는 의심을 지울 수 없다"
blinding = "재제시라는 사실을 판정자에게 알리지 않는다. 알리면 그 자리에서 상기가 일어난다"

[selection.question]
asked = "이것이 **인가 가드**인가 · 근거 좌표는 어디인가"
answer_form = "가드 예/아니오 + 근거 좌표(파일·심볼) 또는 '없음'"
same_as_t2 = true

falsified_if = "어떤 장치의 절감률이 0 이하면 그 장치는 만들지 않는다. F 에서 일괄 판정이 뒤집히면 ②를 채택하지 않는다."
