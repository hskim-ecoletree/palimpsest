# ─────────────────────────────────────────────────────────────────────────────
# [procurement] — T9 조달 가능성 실측 (2026-08-11)
#
# 네 항목을 코퍼스별로 센다:
#   ① CI가 도는가  ② 무엇이 도는가  ③ 산출 형식  ④ 그 산출이 파일:라인을 주는가
#
# 코드를 쓰지 않았다. CI 설정 파일과 GitHub Actions의 기존 실행 기록·로그를 읽었다.
# ①은 설정 파일의 존재가 아니라 **실제 실행 이력**으로 판정했다.
#
# 판정 근거와 서술은 docs/gates/preflight.md §T9
# ─────────────────────────────────────────────────────────────────────────────

[procurement]
measured_at = "2026-08-11"
method = "CI 설정 파일 + GitHub Actions runs/jobs/logs/artifacts API + code-scanning API"
verdict = "반증"
sast_sources = 0        # 코퍼스 4개 중 SAST 조달원을 가진 것의 수
usable_sources = 1      # 좌표 있는 진단을 실제로 내고 있는 코퍼스의 수 (ditto)
artifact_sources = 0    # 진단을 아티팩트로 보존하는 코퍼스의 수
sarif_sources = 0

# ── boxwood ──────────────────────────────────────────────────────────────────
[procurement.boxwood]
# ① CI가 도는가
ci_runs = true
ci_note = """
저장소 7개 중 워크플로가 있는 것은 5개, 그중 분석을 하는 것은 2개뿐이다.
나머지는 전부 CD(docker build + scp/ssh 배포)다.
"""
runs_by_repo = [
  { repo = "boxwood-packages",      workflow = "CI",           runs = 85, success = 84, failure = 1,  last = "2026-05-19" },
  { repo = "boxwood-packages",      workflow = "Publish",      runs = 15, success = 10, failure = 5,  last = "2026-05-19" },
  { repo = "boxwood-portal-svelte", workflow = "Automation CI", runs = 2, success = 0,  failure = 1,  last = "2026-06-11" },
  { repo = "boxwood-portal-svelte", workflow = "CD 3종",       runs = 98, success = 93, failure = 3,  last = "2026-08-04" },
  { repo = "boxwood-portal-kotlin", workflow = "CD 2종",       runs = 51, success = 41, failure = 9,  last = "2026-07-30" },
  { repo = "boxwood-automation-engine", workflow = "CD 2종",   runs = 22, success = 20, failure = 1,  last = "2026-07-29" },
  { repo = "hanwha-boxwood-external-client",       workflow = "없음", runs = 0 },
  { repo = "boxwood-external-task-client-teams",   workflow = "없음", runs = 0 },
  { repo = "boxwood-workspace",                    workflow = "없음", runs = 0 },
]

# ② 무엇이 도는가
linter = "부분 — frontend만 (eslint via turbo). Kotlin 쪽은 없다"
typechecker = "부분 — frontend만 (svelte-check + tsc)"
sast = false
tests = false  # boxwood-packages CI는 `mvn clean verify -DskipTests` — 테스트를 건너뛴다
analyzer_configs_found = [".eslintrc.js", ".eslintrc.cjs", "tsconfig.json x8"]
analyzer_configs_absent = ["detekt", "ktlint", "sonar", "spotbugs", "checkstyle", "pmd", "semgrep", "snyk", "trivy"]
code_scanning_enabled = false  # GitHub API: "Code scanning is not enabled"

# ③ 산출 형식
output_format = "콘솔 텍스트 (CI 실행 로그) 뿐"
artifacts = 0    # 분석 산출 아티팩트. CD의 dist 업로드는 진단이 아니다
sarif = false
on_disk_reports = "없음 — Gradle 바이너리 test-results, surefire dumpstream 1건, 빈 test-results 디렉터리"

# ④ 파일:라인을 주는가
file_line = "부분 — 로그에서만"
file_line_evidence = """
Automation CI 유일한 실패 실행(2026-06-11)의 로그에 svelte-check 진단이 남아 있다:
  "svelte-check found 495 errors and 958 warnings in 206 files"
  좌표 있는 진단 행 1,453개 (예: packages/ui/src/lib/basic/inputs/EcoletreeSlider.svelte:89:10)
좌표는 나온다. 그러나 이것은 아티팩트가 아니라 실행 로그이고,
그 워크플로는 지금까지 2회 돌았으며 한 번도 성공하지 못했다(실패 1 · 취소 1).
"""
kotlin_coverage = "없음"
kotlin_note = """
**T7이 파싱한 Kotlin 1,122파일이 있는 boxwood-portal-kotlin에는 분석 CI가 하나도 없다.**
CD만 51회 돈다. 린터·타입체커·테스트·SAST 전부 없다.
감사(F15)·효과 집합(F13)의 판정 대상이 바로 이 저장소다.
"""

