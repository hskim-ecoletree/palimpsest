# 이 파일은 아직 완성되지 않았다. **T5(코퍼스·과제·합격선 사전 등록)는 수행되지 않았고**,
# 지금 여기 있는 것은 T9(조달 가능성 실측)가 실제로 잰 것과, 그 측정에 필요했던
# 코퍼스 식별 사실뿐이다.
#
# 과제(`tasks/`)·대조군(`arms.toml`)·합격선(`criteria.toml`)은 T5·T11의 산출이며
# 여기에 미리 적지 않는다 — 적으면 그것이 곧 사전 등록을 가장한 사후 기입이다.
#
# 판정 기록: docs/gates/preflight.md
# 레이아웃 규약: docs/plan/features/P0-preflight.md §5

