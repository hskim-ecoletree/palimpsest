sast = false
tests = false
tests_note = """
ci.yml 주석이 이유를 명시한다 — 환경의존 테스트(citty help 출력이 bun 버전에 민감 등)가
CI에서 깨져 아직 게이트에 넣지 않았다. 테스트 CI 독립화는 별도 과제로 남아 있다.
"""
custom_gates = ["adr:guard", "check:no-design-doc-refs"]
code_scanning_enabled = false  # GitHub API: "no analysis found"
codeql_note = "reports/codeql/ 은 CodeQL 도입 조사·계획 문서이지 CodeQL 산출이 아니다"

# ③ 산출 형식
output_format = "콘솔 텍스트 (CI 실행 로그) 뿐"
artifacts = 0
sarif = false

# ④ 파일:라인을 주는가
file_line = "예 — 단, 규칙 종류에 따라 다르다"
file_line_by_tool = [
  { tool = "tsc --noEmit",           format = "file(line,col)", example = "tests/schemas/ac-oracle.test.ts(139,30): error TS2532", coordinates = true },
  { tool = "biome — lint 규칙",      format = "file:line:col",  example = "tests/gate-coverage/drive/harness.test.ts:6:46 lint/correctness/noUnusedImports", coordinates = true },
  { tool = "biome — format 규칙",    format = "file 만",        example = "scripts/build-bin.mjs format", coordinates = false },
]
file_line_caveat = """
biome의 format 진단은 헤더에 파일만 적고 행 번호는 diff 거터에만 나온다.
실패 20건을 표본으로 보면 19건이 Lint(biome), 1건이 Typecheck(tsc)였다.
biome은 --reporter=json/github 으로 좌표를 낼 수 있으나 현재 설정은 쓰지 않는다.
"""

