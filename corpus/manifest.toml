  # `git ls-tree`/`git grep` 을 SHA에 직접 걸면 된다(비파괴).
  [corpus.pin]
  verified_at = "2026-08-11"
  kt_bearing = [
    { repo = "portal-backend",         remote = "https://github.com/ecoletree/boxwood-portal-kotlin.git", sha = "a29cad0bf6a8", kt = 671, main = 604, test = 67 },
    { repo = "portal-backend-aa-task", remote = "https://github.com/ecoletree/boxwood-portal-kotlin.git", sha = "10185f804ad8", kt = 434, main = 415, test = 19 },
