  kt_main  = 1036
  kt_test  = 86
  context_md = "boxwood-workspace @ b4985d8fb93d:CONTEXT.md — 339행. T6의 출처"
  remote_reachable = """
2026-08-11 확인: 브랜치 팁은 움직였으나(`branch/dwp` → `d776ed8b5838`) 위 SHA들은
여전히 도달 가능하다(`git merge-base --is-ancestor`). force-push 없었다.
**팁을 쓰면 안 된다 — 코퍼스는 팁이 아니라 이 SHA다.**
"""
  procedure = """
클론 없이 세는 법 (SHA를 가진 클론이 있을 때):
  git -C <repo> ls-tree -r --name-only <sha> | grep '\\.kt$' | grep -c 'src/main/'
  git -C <repo> grep -I -P -n '<pattern>' <sha> -- '*.kt' | grep 'src/main/'
**`-P`(PCRE)가 필요하다** — 규칙 R2·R6·R7·R8의 `\\b` 는 POSIX ERE에서 조용히 0을 낸다.
새 기계라면: git clone --no-single-branch <remote> && git checkout <sha>
"""

