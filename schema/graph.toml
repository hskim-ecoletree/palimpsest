# ═════════════════════════════════════════════════════════════════════════════
# 그래프 스키마 — **모든 줄의 형태를 정하는 단일 진실**
#
# DESIGN §1.2 (D25) · F22 · 읽는 코드는 `pal-core::schema` 하나다.
#
# **여기서 다섯이 파생된다**: ① Rust 타입의 검사 ② JSON 스키마 ③ 문서 표
# ④ `pal export` 의 매핑 ⑤ `doctor` 의 불변식. **v1 이 실제로 세우는 것은 ①③ 둘이고**,
# 나머지 셋은 그것을 소비할 표면(F06)·내보내기(F05 §3.1)·`doctor`(#45)가 아직 없다.
# 없는 소비자를 위해 파생을 만들면 그것이 곧 검사되지 않는 산출이다.
#
# **코드에만 있고 여기 없는 노드·엣지는 CI 실패다. 그 반대도 같다**
# (`cargo xtask check` 의 "스키마 정합").
#
# ── 이 파일이 코드보다 늦게 왔다는 사실 ──────────────────────────────────────
#
# F22 문서 §1 은 *"F01 이 첫 노드를 만드는 순간 스키마가 있어야 한다"* 고 적었다.
# 실제로는 슬라이스 넷(S0~S3)이 먼저 갔고 스키마 없이 노드가 만들어졌다. 그래서 v1 은
# 설계가 아니라 **정본화**이며, 어긋난 자리에서 고친 것은 스키마가 아니라 코드다.
# 무엇을 고쳤는지는 `docs/gates/F22-1-schema.md` 에 목록으로 있다.
#
# ── 여기 없는 것 ─────────────────────────────────────────────────────────────
#
# **관측 범위 대장(`Ledger`)은 노드가 아니다.** DESIGN §4.1 은 그것을 *"`Snapshot` 마다
# 계산되는 파일 단위 상태의 집합"* 으로 정의했고 F05 의 저장 레이아웃은 `LEDGER` 를
# `FILE` 노드와 **다른 자리**에 두었다. 대장은 그래프의 마디가 아니라 **모든 응답에
# 첨부되는 범위 선언**이다(§4.2). 그래서 여기 등록하지 않는다.
#
# `File` 노드 자체는 아직 없다 — 그것을 만드는 것은 F05 이고 지금 코드에 `FileNode` 가
# 없다. **없는 것을 미리 선언하지 않는다.**
#
# ── 스키마 규모 ──────────────────────────────────────────────────────────────
#
# 노드 라벨 3 · 엣지 타입 1. **자라는 것 자체가 관측 대상이다**(DESIGN §1.2) —
# 늘어난 커밋은 `xtask/vocab.toml` 이 늘어난 커밋과 같은 자격으로 검토된다.
# 상한은 두지 않는다. 근거 없는 숫자이기 때문이다(F22 §4).
# ═════════════════════════════════════════════════════════════════════════════

schema_version = 1

# ─────────────────────────────────────────────────────────────────────────────
# Symbol — S0~S2 가 만든다. 이 빌드에서 값이 실제로 서는 유일한 노드다.
# ─────────────────────────────────────────────────────────────────────────────

[node.Symbol]
provenance = "extracted"
rust_type  = "SymbolNode"
# 정체성은 `symbol_id` 하나다. **`span` 은 여기 없다** — 줄 번호는 포매팅으로 움직이므로
# 정체성의 성분이 될 수 없다(DESIGN §2.1).
key = ["id"]
attrs = [
  { name = "path",     type = "repo_path",          producer = "extractor", required = true },
  { name = "name",     type = "string",             producer = "extractor", required = true },
  { name = "kind",     type = "enum:SymbolKind",    producer = "extractor", required = true },
  # **변했는가**에 답하는 값. 정체성(`id`)과 다른 축이다 — 합치면 이동 감지와
  # 포매팅 무시 중 하나를 잃는다(F03 §2).
  { name = "body",     type = "digest",             producer = "extractor", required = true },
  { name = "span",     type = "span",               producer = "extractor", required = true },
  # **언어 단위가 아니라 심볼 단위다** — R-22.
  { name = "identity", type = "enum:IdentityGrade", producer = "extractor", required = true },
]

# ─────────────────────────────────────────────────────────────────────────────
# Binding — S3 가 만든다. **의도 저장소가 소유한다**(R-21). 2층에는 색인만 있다.
#
# 출처가 `asserted` 인데 속성 셋 중 둘의 생산자가 `machine-record` 다. 그것이 어긋남이
# 아닌 이유는 DESIGN §3.4 의 표에 있다 — `machine-record` 는 **해당 노드를 따르는**
# 유일한 생산자이고, 그것이 §3.1 이 인정한 유일한 예외(기계가 채우며 채우지 못하면
# 쓰기 자체가 실패하는 필드)의 자리다.
# ─────────────────────────────────────────────────────────────────────────────

[node.Binding]
provenance = "asserted"
rust_type  = "Binding"
key = ["id"]
attrs = [
  # 사람이 넣은 것. **S3 에서는 텍스트 조각 하나다** — 문서 인입은 F10.
  { name = "note",     type = "string",        producer = "human",          required = true },
  # `BOUND_TO` 가 지는 **발생 Snapshot**. 공통 넷 중 넷째다.
  { name = "bound_at", type = "snapshot",      producer = "machine-record", required = true },
  # 감시 집합 — **엣지가 아니라 속성이다.** 결박 시점의 digest 스냅샷은 결박 자신의
  # 내용이고, 2층의 역방향 색인(F05 의 `WATCH`)이 그것의 파생이다. 엣지로 두면
  # 공통 넷을 지지 않는 엣지가 하나 생기거나 넷을 무의미하게 채우게 된다.
  { name = "watch",    type = "watch_entry[]", producer = "machine-record", required = true },
]

# ─────────────────────────────────────────────────────────────────────────────
# UnresolvedRef — **자리만 있다.** 값을 만드는 것은 F08 이다.
#
# `status = "not_built"` 인 노드의 Rust 타입은 **거주 불가**여야 한다(검사가 센다).
# 자리만 두고 값을 만들 수 있으면 그것이 곧 *"있는데 안 나오는"* 상태가 되고,
# 선행 구현의 `runs` 가 146 건 전부에서 비어 있던 자리가 정확히 그것이다([연구 E §7]).
#
# 아래 속성 목록은 **F08 에 대한 계약**이다 — DESIGN §5.3 이 정의한 넷을 옮겨 적었다.
# ─────────────────────────────────────────────────────────────────────────────

[node.UnresolvedRef]
provenance = "extracted"
rust_type  = "UnresolvedRef"
status     = "not_built"
built_by   = "F08"
key = ["site", "name"]
attrs = [
  # { 정의 없음 · 후보 과다 · 언어 등급 미달 · 범위 밖 · 동적 디스패치 · 문자열 기반 }
  { name = "reason",   type = "enum:UnresolvedReason", producer = "extractor",      required = true },
  # **해소돼도 지우지 않는다** — 정적 하한과 관측된 해소를 겹쳐 보이는 것이 정직한 형태다.
  { name = "attempts", type = "attempt[]",             producer = "machine-record", required = true },
]

# ─────────────────────────────────────────────────────────────────────────────
# 엣지 — **하나뿐이다. 그것이 지금의 사실이다.**
#
# 참조 엣지(`CALLS` · `REFERENCES`)는 F02 §3.5 와 F07 이 만들고 아직 없다.
# 없는 엣지를 미리 선언하면 스키마가 만들 수 없는 것을 선언한 채 자란다.
#
# **모든 엣지는 공통 넷을 진다**: grade · provenance · evidence · snapshot.
# 넷 중 하나라도 없으면 로딩에서 거부된다(DESIGN §1.2).
# ─────────────────────────────────────────────────────────────────────────────

[edge.BOUND_TO]
from        = "Binding"
to          = ["Symbol"]
# 결박 여럿이 심볼 하나에 걸릴 수 있고, 결박 하나는 대상 하나를 갖는다.
cardinality = "many-to-one"
# ① 해소 등급 — **구조상 `exact` 하나뿐이다.** `pal bind` 는 이름이 유일하게 해소될
#    때만 결박하고 후보가 여럿이면 거부한다(S3). 그래서 등급을 실을 자리가 필요 없다.
grade       = "exact"
# ② 출처 — 사람이 승인해 고정한 것이다.
provenance  = ["asserted"]
# ③ 근거 — `inferred` 로 설 수 없으므로 요구할 자리가 없다. 재결박 **제안**(F09)은
#    `inferred` 이고 그때 근거를 지는 별도의 엣지가 선다.
evidence    = "not_applicable"
# ④ 발생 Snapshot.
snapshot    = "bound_at"
# 이 엣지는 별도 자리가 아니라 `Binding` 의 필드로 실려 있다.
carried_by  = { rust_type = "Binding", field = "target" }
