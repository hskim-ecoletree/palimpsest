# ═════════════════════════════════════════════════════════════════════════════
# sunset — **MVP 가 서면 사라지는 문서**
#
# 소유자 지시 (2026-08-18 · 재고 처분 회차):
#   > 나중에 MVP 완성되었을 때 반드시 삭제 또는 정리될 수 있도록만
#   > 구조적으로 강제하거나 github 이슈로 남겨둬
#
# **표시가 아니라 장치다.** `cargo xtask check` 가 이 파일을 읽고 셋을 본다:
#   ① 트리거가 참인데 선언된 경로가 남아 있으면  → **실패**
#   ② 선언된 경로가 이미 없으면 (선언이 잔재다)   → **실패**
#   ③ 선언이 하나도 없으면 (파일이 빈 껍데기다)   → **실패**
#
# ─── 트리거 — 무엇이 참이면 MVP 인가 ─────────────────────────────────────────
#
# 소유자가 정했다: **`pal` 이 자기 저장소에서 회차를 한 번 돌렸을 때.**
#
# ★ **이름에 안 묶이게 잡는다.** 회차 레코드를 `pal` 이 어떤 파일명으로 쓸지는
#   병렬 회차 B 의 미결이다(*"잠긴 의도와 상태를 `pal` 이 소유하나 — redb 로 갈
#   것인가, 파일로 남을 것인가"*). 그래서 **이름 대신 갈래**를 고정한다:
#
#     사람이 쓰는 것 = `.md`   (`/round` 스킬이 쓰는 `intent.md` · `state.md`)
#     기계가 쓰는 것 = `.json` (`pal` 이 쓰는 회차 레코드)
#
#   `.palimpsest/rounds/*/*.json` 이 하나라도 생기면 트리거가 참이다.
#   **오늘 0 건이다** — 그래서 이 검사는 오늘 초록이고, 내일 하네스가 서면 빨개진다.
트리거 = ".palimpsest/rounds/*/*.json"

# 이것을 지는 이슈: https://github.com/hskim-ecoletree/palimpsest/issues/68

# ⚠ **이 파일도 검사 19 의 모집단이다** (독립 리뷰 13 라운드). `docs/` 아래지만
#   `cargo xtask check` 가 **실행 시점에 읽는 설정**이라 문서 제외에서 예외다 —
#   `schema/graph.toml` 을 넣은 것과 같은 사유다. 그 예외는 손으로 안 적고
#   `xtask` 소스의 `join("docs/…")` 에서 뽑는다.

# ─── 사라질 것 ───────────────────────────────────────────────────────────────

