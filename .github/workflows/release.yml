# **각 플랫폼 사용자가 받아서 쓸 수 있게 한다** — `[f24]` ⑩.
#
# # 왜 이것이 게이트의 항목인가
#
# *"여러 플랫폼에서 동작 가능"* 은 **각 플랫폼 사용자가 받을 수 있다**는 뜻을 포함한다.
# CI 가 세 플랫폼에서 초록인 것과 그 세 플랫폼의 사람이 **쓸 수 있는 것**은 다르다 —
# 앞의 것은 소스가 서는 것이고 뒤의 것은 **바이너리가 손에 오는 것**이다.
#
# 앞 회차는 이 항목을 *"저장소가 private 이라 대조 불가"* 로 뒀다. 소유자 결정
# (2026-08-17): **릴리스를 내고 저장소를 public 으로 한다.**
#
# # ★ 「받아서 쓸 수 있다」를 이 워크플로가 **직접 잰다**
#
# 릴리스를 만드는 것과 그것이 쓸모 있는 것은 또 다르다. 그래서 `toolchain-free` job 이
# **Rust 툴체인을 실패 shim 으로 막고** 받은 바이너리로 라이프사이클을 완주한다.
# 그것이 없으면 이 워크플로는 *"파일을 올렸다"* 까지만 말하고, 그것은 게이트가 묻는
# 문장이 아니다.
#
# # 무엇을 안 골랐는가
#
# | 후보 | 왜 안 골랐나 |
# |---|---|
# | `x86_64-unknown-linux-musl` | 정적 링크가 배포에는 낫지만 `zstd-sys` 와 tree-sitter 문법들이 **C 컴파일러를 탄다** — `musl-gcc` 를 얹는 축이 하나 더 는다. glibc 바닥은 아래 `무엇으로 세웠나` 가 적는다 |
# | 크로스 컴파일로 한 runner 에서 다 낸다 | 같은 이유다. C 의존이 있는 워크스페이스에서 크로스는 **툴체인 하나가 아니라 넷**을 뜻한다(이 회차의 실측: Windows→리눅스 `cargo check` 가 `x86_64-linux-gnu-gcc` 없음으로 죽었다) |
# | 서명·공증 | 이 빌드에 인증서가 없다. **없는 것을 근거로 삼지 않는다** — 대신 `SHA256SUMS` 를 같이 낸다 |

name: 릴리스

on:
  push:
    tags: ["v*"]
  # 태그 없이도 돌려 볼 수 있어야 한다 — 안 그러면 이 워크플로의 첫 실행이
  # 곧 되돌릴 수 없는 태그가 된다.
  workflow_dispatch:
    inputs:
      tag:
        description: "릴리스로 낼 태그 이름 (비우면 아티팩트만 만들고 릴리스는 안 낸다)"
        required: false
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ⚠ job id · matrix 키 · 아티팩트 이름은 **ASCII 다**(`ci.yml` 의 같은 주석 참조).
  build:
    name: 세운다 · ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 한 타깃이 죽어도 나머지를 끝까지 본다 — 「하나만 깨졌나 전부 깨졌나」를
      # 한 회차에 알아야 한다.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: pal.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: pal
          # macos-latest 는 arm64 다 — 이것이 네이티브다.
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: pal
          # Intel Mac 은 아직 실재하는 사용자층이다. 같은 runner 에서 타깃만 더한다 —
          # Apple 의 SDK 가 두 아키텍처를 다 갖고 있어서 C 의존도 선다.
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: pal

    steps:
      - uses: actions/checkout@v4

      - name: 타깃을 더한다
        run: rustup target add ${{ matrix.target }}

      - name: 무엇으로 세웠나
        shell: bash
        run: |
          rustc -V
          cargo -V
          # ★ **glibc 바닥을 적어 둔다.** `-gnu` 바이너리는 세운 기계의 glibc 를
          # 최소 버전으로 요구한다. 안 적으면 받는 사람이 왜 안 도는지 알 수 없다.
          if [ "${{ runner.os }}" = "Linux" ]; then ldd --version | head -1; fi

      - name: 세운다
        run: cargo build --release --locked --target ${{ matrix.target }} -p pal-cli --bin pal

      - name: 담는다
        shell: bash
        run: |
          set -euo pipefail
          out="pal-${{ matrix.target }}"
          mkdir -p "$out"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$out/"
          # ⚠ **저장소에 `README.md` 도 `LICENSE` 도 없다**(실측 2026-08-17). 없는 것을
          # 복사하는 줄을 두면 그 줄이 조용히 아무것도 안 하고, 그러면 아카이브에
          # **바이너리 하나만** 들어간 채로 「README 를 넣었다」고 믿게 된다.
          # 대신 **받는 사람이 지금 필요한 것**을 여기서 만든다.
          # ⚠ here-doc 본문은 **이 블록의 들여쓰기에 딱 맞춘다.** YAML 이 블록 공통
          # 들여쓰기를 떼므로 셸에는 왼쪽에 붙은 채로 간다 — `sed` 로 들여쓰기를 떼는
          # 후처리는 안 쓴다(GNU 와 BSD 의 `-i` 문법이 갈려서 그 자체가 플랫폼 축이다).
          cat > "$out/README.txt" <<TXT
          pal — ${{ matrix.target }}
          $(git rev-parse --short HEAD)

          놓기
            같이 든 실행 파일을 PATH 위의 아무 디렉터리에 두십시오.
            ★ 이름을 바꾸지 마십시오 — 훅 등록이 PATH 의 이름 'pal' 을 가리킵니다.
            유닉스에서는 실행 비트도 필요합니다:  chmod +x pal

          쓰기
            pal install            이 프로젝트에 놓는다
            pal doctor --install   여섯 검사를 본다   <- 놓은 뒤 반드시 한 번
            pal update             놓은 것을 갱신한다
            pal uninstall          놓은 것을 걷어낸다 (매니페스트에 적힌 것만)

          이 빌드가 요구하는 것
            git 이 PATH 에 있어야 합니다. .gitignore 등재를 git 에게 물어서
            판정하므로(텍스트로 안 읽습니다) 없으면 설치가 1단계에서 멈춥니다.

          서명이 없습니다. 릴리스에 같이 올라온 SHA256SUMS 로 대조하십시오.
          TXT
          # 유닉스는 tar.gz — **실행 비트를 지고 간다.** zip 은 그것을 못 지고,
          # 그러면 받는 사람의 `pal` 이 `PATH` 에 있어도 안 뜬다(`exe.rs` 의 그 축).
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$out.zip" "$out" >/dev/null
          else
            chmod +x "$out/${{ matrix.bin }}"
            tar czf "$out.tar.gz" "$out"
          fi
          ls -la pal-${{ matrix.target }}.*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: pal-${{ matrix.target }}.*
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # ★ **Rust 툴체인 없이 받아서 설치까지 완주하는가** — `[f24]` ⑩ 의 실제 문장
  # ───────────────────────────────────────────────────────────────────────────
  #
  # `cargo` 와 `rustc` 를 **실패 shim 으로 막고** 돌린다. 「없애기」가 아니라 「막기」인
  # 이유: runner 에서 툴체인을 지우는 것은 되돌리기 어렵고, 우리가 재려는 것은
  # *"우리 코드가 툴체인을 안 부른다"* 이므로 **부르면 죽는 상태**가 정확한 fixture 다.
  # 안 부르면 통과하고, 부르면 그 자리에서 빨개진다.
  toolchain-free:
    name: 툴체인 없이 · ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: pal.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: pal
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: pal
    steps:
      - name: 줄바꿈을 실사용자 환경과 같게 맞춘다 (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist

      - name: 받은 것을 푼다
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z x "pal-${{ matrix.target }}.zip" -o.. >/dev/null
          else
            tar xzf "pal-${{ matrix.target }}.tar.gz" -C ..
          fi
          cd ..
          mv "pal-${{ matrix.target }}/${{ matrix.bin }}" "bin/${{ matrix.bin }}"
          chmod +x "bin/${{ matrix.bin }}" 2>/dev/null || true
          ls -la bin/

      - name: 툴체인을 막는다
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shim
          for t in cargo rustc rustup; do
            printf '#!/usr/bin/env bash\necho "이 환경에는 Rust 툴체인이 없다(%s) — 그런데 불렀다" >&2\nexit 127\n' "$t" > "shim/$t"
            chmod +x "shim/$t"
          done
          # Windows 는 `.exe`/`.cmd` 가 아니면 안 뜬다 — 그 플랫폼의 규칙 그대로 막는다.
          if [ "${{ runner.os }}" = "Windows" ]; then
            for t in cargo rustc rustup; do
              printf '@echo 이 환경에는 Rust 툴체인이 없다(%%~n0) — 그런데 불렀다 1>&2\r\n@exit /b 127\r\n' > "shim/$t.cmd"
            done
          fi
          ls -la shim/

      - name: ★ 받은 바이너리 하나로 라이프사이클을 완주한다
        shell: bash
        run: |
          set -euo pipefail
          # shim 을 **앞에** 얹는다 — 툴체인을 부르면 여기서 죽는다.
          export PATH="$PWD/shim:$PWD/bin:$PATH"
          "${{ matrix.bin }}" --version
          # 툴체인이 정말로 막혔는지 먼저 본다. 안 막혔으면 이 job 은 아무것도 안 잰다.
          if cargo --version >/dev/null 2>&1; then
            echo "shim 이 안 걸렸다 — 이 job 이 재려는 상태가 아니다" >&2
            exit 1
          fi
          echo "✔ 툴체인이 막혔다"

          mkdir -p proj && cd proj
          printf 'hello\n' > README.md
          printf '# 내 규칙\n' > CLAUDE.md
          git init -q .
          git config user.email t@e
          git config user.name t
          git add -A && git commit -qm 첫

          "${{ matrix.bin }}" install --target .
          # ⚠ **진단 산출을 대상 **밖**에 쓴다.** 처음 판은 이것을 `proj/d.json` 으로
          # 썼고, 그래서 마지막 검사(`git status --porcelain` 이 비었는가)를 **측정
          # 자신이 깨뜨렸다** — `?? d.json`. 제거는 완벽했고 더럽힌 것은 우리였다.
          #
          # ★ 이 저장소가 제품에 요구하는 것(*"대상 바깥은 안 건드린다"*)의 뒷면이다:
          # **측정도 대상 안에 자기 흔적을 남기면 안 된다.** 남기면 그 측정은 자기가
          # 만든 상태를 제품의 결함으로 읽는다.
          "${{ matrix.bin }}" doctor --install --json > ../doctor.json
          cat ../doctor.json
          if grep -q '"outcome": *"failed"' ../doctor.json; then
            echo "받은 바이너리로 설치했는데 진단에 빨강이 있다" >&2
            exit 1
          fi
          "${{ matrix.bin }}" update --target .
          "${{ matrix.bin }}" uninstall --target .
          if [ -n "$(git status --porcelain)" ]; then
            echo "왕복 뒤 추적 파일이 더럽다" >&2
            git status --porcelain
            exit 1
          fi
          echo
          echo "✔ Rust 툴체인 없이 받아서 install·doctor·update·uninstall 을 완주했다"

  # ───────────────────────────────────────────────────────────────────────────
  # 릴리스 — **위 둘이 다 선 뒤에만 낸다**
  # ───────────────────────────────────────────────────────────────────────────
  publish:
    name: 릴리스를 낸다
    needs: [build, toolchain-free]
    runs-on: ubuntu-latest
    # 태그로 밀렸거나, 손으로 태그 이름을 준 회차에만 낸다.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: 해시를 낸다
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -la
          # 받는 사람이 **무엇을 받았는지 스스로 댈 수 있어야 한다.** 서명이 없으므로
          # 이것이 그 자리의 전부이고, 그 한계는 이 파일 머리말이 적고 있다.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 낸다
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/* \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag=false
