# **같은 결과를 앞으로 보증하는 유일한 장치.**
#
# 이 저장소는 2026-08-16 에 Windows 를 지원 대상으로 선언했고(AGENTS.md · 소유자 지시),
# 그 다음 회차가 실제로 Windows 에서 빌드·시험을 돌려 **진짜 결함 둘과 하네스 잡음 열셋**
# 을 찾았다. 그 작업이 1회용이 되지 않으려면 **세 플랫폼이 매 커밋마다 같이 서야** 한다.
#
# ⚠ **유닉스 쪽은 이 저장소에서 한 번도 컴파일된 적이 없다**(2026-08-17 실측).
# 그리고 그것이 이미 한 번 물었다 — `#[cfg(windows)]` 가 남은 채로 커밋됐고 Windows
# 빌드가 서니까 끝까지 안 걸렸다(`c19920e`). 로컬에서 `cargo check --target` 으로
# 대신할 수도 없다: `zstd-sys` 와 tree-sitter 문법들이 **C 컴파일러를 요구하고**
# 크로스 gcc 가 이 기계에 없다. **동작은 물론이고 컴파일조차 이 워크플로가 유일한 문이다.**
#
# ## 왜 `cargo test` 를 직접 안 부르나
#
# 이 저장소에는 **일부러 실패하는 시험**이 있다 — 짝 없는 `#[cfg(unix)]` 시험은 다른
# 플랫폼에서 조용히 사라지므로, 그 자리마다 시끄럽게 실패하는 짝을 단다. `cargo test` 를
# 그대로 돌리면 Windows 가 **영구히 빨갛고**, 그러면 사람이 **CI 의 빨강을 무시하는 법을
# 배운다.** `cargo xtask test` 가 그 대신 **등록된 외침 집합과 실제 실패 집합이 같은지**
# 를 판정한다. 새 실패도, 승격 뒤 남은 등록도 둘 다 걸린다.
#
# ⚠ **그 집합 판정만으로는 부족했다** (2026-08-17). 앞 판은 자식의 종료 상태를 어디서도
# 안 봤고, 그래서 stdout 에 `test … ... FAILED` 가 **한 줄도 안 나는 실패** — 컴파일이
# 서지 못한 경우가 대표다 — 가 「실패 0건 = 등록 0건」이 되어 **초록으로 통과했다.**
# 이 워크플로는 세 OS 를 그 명령 하나로 판정하므로 **셋이 함께 속았다.** 지금은
# `xtask` 의 `판정한다` 가 종료 상태와 집합을 **함께** 보고, 「시험이 실패했다」와
# 「시험을 돌리지도 못했다」를 **다른 문구로** 낸다.
#
# ## ⚠ `core.autocrlf` 를 실사용자 환경과 같게 맞춘다
#
# Git for Windows 의 기본은 `true` 이고 실측 기계도 `true` 였다. runner 가 다른 값이면
# 파생 문서 대조와 매니페스트 sha 대조가 **CI 에서 초록을 내면서 실사용자 환경에서만
# 깨진다** — 이 회차가 고친 결함 다섯 중 둘이 정확히 그 축이었다. **checkout 보다 먼저**
# 설정해야 한다(체크아웃이 워킹트리 바이트를 그때 정한다).
#
# 리눅스는 기본값(`false`)을 그대로 둔다. 거기서 `true` 는 실사용자 환경이 아니라
# 없는 환경을 흉내 내는 것이다.
#
# ## 액션을 최소로 쓴다
#
# `actions/checkout` 과 `actions/cache` 둘뿐이고 **둘 다 GitHub 자신의 것**이다.
# stack §3.4(의존 최소)가 크레이트에 대해 말하는 것을 CI 의존에도 그대로 적용한다 —
# 여기서 늘리는 것은 이 저장소가 무엇을 믿는지의 목록이다.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치의 앞 회차는 취소한다 — 마지막 것만 뜻이 있다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 실패 하나가 나머지를 감추지 않게 한다.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # ★ **한쪽이 죽어도 다른 쪽을 끝까지 돌린다.** 안 그러면 「Windows 만 깨졌나
      # 둘 다 깨졌나」를 한 회차에 알 수 없고, 그것이 이 매트릭스의 존재 이유다.
      fail-fast: false
      # ★ **셋이다.** 둘이었을 때 macOS 는 「유닉스니까 리눅스와 같겠지」로 덮여
      # 있었다. 그런데 이 저장소가 실제로 갈리는 축 둘이 정확히 거기서 갈린다 —
      # **대소문자를 안 가리는 파일시스템**(APFS 기본)과 **BSD 계열 도구**. 리눅스
      # 하나로 「유닉스가 선다」를 적으면 그것이 이 회차가 Windows 로 저지른 실수
      # (한 플랫폼에서 재고 「선다」고 적기)를 유닉스 쪽에서 반복하는 것이다.
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # ⚠ **checkout 보다 먼저다.** 체크아웃이 워킹트리 바이트를 그때 정한다.
      - name: 줄바꿈을 실사용자 환경과 같게 맞춘다 (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      # ★★ **이력 전부를 받는다.** 검사 22(「발견이 닫혔나」)가 회차 레코드의
      #    `닫은커밋` SHA 를 `git show` 로 읽는다. 기본값(`fetch-depth: 1`)에서는
      #    **그 SHA 들이 하나도 안 읽혀** 닫힘 행 전량이 「이 이력에서 안 보인다」로
      #    빨개진다 — 로컬은 초록이고 push 뒤에야 나므로 회차 안에서 안 보인다.
      #    ⚠ 이 잡만 그 축을 돌린다. 나머지 둘은 기본값 그대로 둔다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 무엇으로 빌드하는지 적어 둔다
        shell: bash
        run: |
          rustc -V
          cargo -V
          git --version
          echo "core.autocrlf = $(git config core.autocrlf || echo '(설정 없음)')"

      # 캐시가 없으면 `cargo install cargo-deny` 하나가 회차의 대부분을 먹는다.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      # 게이트의 다섯째 검사(의존 정책)가 이것 없이는 안 선다.
      - name: cargo-deny
        shell: bash
        run: command -v cargo-deny >/dev/null || cargo install --locked cargo-deny

      # 게이트 — 검사 수는 여기 안 적는다. ⚠ 앞 판은 「열여섯」이라 벤 거울을 두었고
      # 착수 전부터 낡아 있었다. **한 번 고쳤더니 그 자리가 다시 낡았다** — 고친 수마저
      # 손으로 벤 거울이었기 때문이다. **세는 자리는 `xtask` 의 `checks.len()` 이다.**
      # 여기에 `cargo-deny` 도 든다.
      - name: cargo xtask check
        run: cargo xtask check

      # 시험 + **외침 대조**. 이 명령의 판정 규칙은 `xtask/src/main.rs` 에 있다.
      #
      # ★ **「전수」라고 쓰지 않는다.** 이 명령은 `cargo test` 를 **두 번** 부른다 —
      # `--all-targets` 축과 `--doc` 축(둘은 같이 못 쓴다: `error: can't mix --doc with
      # other target selecting options`). 그래서 lib·bin·시험·doctest 를 다 돈다.
      # ⚠ **그래도 전수가 아니다**: `--doc` 은 **lib 타깃만** 보므로 `pal-cli` 와
      # `xtask` 의 doctest 는 **영원히 0** 이다(둘 다 lib 이 없다). 사용자가 만나는
      # 표면이 바로 `pal-cli` 라, 거기 `///` 예제를 적어도 아무도 컴파일하지 않는다.
      - name: cargo xtask test
        run: cargo xtask test

      - name: pal doctor full 구조 판정
        shell: bash
        run: cargo run -q -p pal-cli -- doctor --full --json | node scripts/check-round-doctor.mjs


  # ───────────────────────────────────────────────────────────────────────────
  # ★ **크로스 플랫폼 상호운용 — 한쪽이 놓고 커밋한 것을 다른 쪽이 받는다**
  # ───────────────────────────────────────────────────────────────────────────
  #
  # # 왜 위 매트릭스로는 부족한가
  #
  # 위의 셋은 **각 플랫폼이 혼자 서는가**를 잰다. 그것이 초록이어도 이 층의 실제
  # 소비자(**공유되는 프로젝트**)에 대해서는 아무것도 말하지 않는다 — 팀은 한 사람이
  # Windows 에서 `pal install` 하고 커밋한 저장소를 다른 사람이 리눅스에서 clone 한다.
  # 그 이동에서만 보이는 것이 셋 있다:
  #
  # | 이동에서만 보이는 것 | 왜 |
  # |---|---|
  # | 산출물에 실린 **기계 고유의 값** | 절대 경로·그 기계의 줄바꿈. 받는 쪽에서 **반드시** 틀린다 |
  # | 줄바꿈 왕복 | Windows 는 `core.autocrlf=true`, 리눅스는 `false`. 「있던 줄바꿈으로」 안 되쓰면 추적 파일이 **핑퐁**한다 |
  # | 매니페스트의 sha256 | 워킹트리 바이트가 갈리면 대조가 갈린다 |
  #
  # 앞 회차는 이것을 **Windows↔Windows 로만** 쟀다. 같은 기계의 같은 `core.autocrlf`
  # 로는 위 셋 중 **하나도** 안 드러난다.

  # ⚠ **job id · matrix 키 · 아티팩트 이름은 ASCII 다.** 이 저장소는 이름을 한국어로
  # 쓰지만 이 셋은 못 쓴다 — GitHub 이 job id 를 `[A-Za-z_][A-Za-z0-9_-]*` 로 받고,
  # 비ASCII 를 쓰면 워크플로가 **0초 만에 죽는다**(실측 2026-08-17). `name:` 은 자유롭다.

  # 1단계 — 각 플랫폼이 **설치하고 커밋한 저장소**를 하나씩 낸다.
  produce:
    name: 놓는다 · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 줄바꿈을 실사용자 환경과 같게 맞춘다 (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: pal 을 세운다
        run: cargo build --locked -p pal-cli --bin pal

      - name: 설치하고 커밋한다
        shell: bash
        run: bash scripts/interop-produce.sh produced

      # ⚠ **`.git` 을 같이 싣는다.** 받는 쪽이 `git clone` 으로 받아야 **git 이
      # 워킹트리 바이트를 정한다** — 그것이 이 측정의 대상이다. 아티팩트 압축이
      # 바이트를 정하게 두면 `core.autocrlf` 가 아예 안 걸리고, 그러면 재려던 축이 사라진다.
      - uses: actions/upload-artifact@v4
        with:
          name: installed-repo-${{ matrix.os }}
          path: produced
          include-hidden-files: true
          retention-days: 1

  # 2단계 — **다른 플랫폼**이 그것을 clone 해서 판정한다.
  receive:
    name: 받는다 · ${{ matrix.from }} → ${{ matrix.os }}
    needs: produce
    runs-on: ${{ matrix.os }}
    strategy:
      # ★ **양방향으로 잰다.** 한 방향만 재면 「받는 쪽이 관대한가」와 「놓는 쪽이
      # 깨끗한가」를 못 가른다.
      fail-fast: false
      matrix:
        include:
          - from: windows-latest
            os: ubuntu-latest
          - from: ubuntu-latest
            os: windows-latest
    steps:
      - name: 줄바꿈을 실사용자 환경과 같게 맞춘다 (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installed-repo-${{ matrix.from }}
          path: received

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'deny.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: pal 을 세운다
        run: cargo build --locked -p pal-cli --bin pal

      - name: 상호운용을 판정한다
        shell: bash
        run: bash scripts/interop-receive.sh received
