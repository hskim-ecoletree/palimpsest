# ═════════════════════════════════════════════════════════════════════════════
# 질의 카탈로그 — **표면이 계약이면 목록도 계약이다** (F06 §2)
#
# **여기 없는 것은 이 빌드가 답하지 않는다.**
# [F06 문서 §3](../docs/plan/features/F06-surface.md) 의 표는 **26 줄이고 로드맵이다** —
# 이 파일의 상위집합이 아니라 **다른 것**이다. 로드맵은 문서에 살고 상태는 이슈에 산다
# (계획 §7 의 넷째: *"같은 것을 두 곳에 적으면 그것이 곧 drift"*).
#
# ── 왜 여섯만 적는가 ─────────────────────────────────────────────────────────
#
# 정본은 `corpus/criteria.toml` `[f06].catalog_scope_decision` 이고 근거는 넷이다.
# 가장 무거운 것 하나만 옮겨 적는다:
#
#   **짝이 없으면 대조가 꺼진다.** `schema/graph.toml` 은 `UnresolvedRef`·`Journey` 를
#   `not_built` 로 적는데, 그것이 허용되는 이유는 **코드에 짝이 있고 그 타입이 값을
#   만들 수 없기** 때문이다(`cargo xtask check` 의 방향 3 이 `uninhabited` 를 요구한다).
#   아직 안 만든 스무 개의 질의에는 **코드 쪽 짝이 아예 없다.** 만들면 그것이 곧
#   「없는 자리를 미리 만드는 것」이고, 안 만들면 양방향 대조가 그 스무 개에 대해
#   **꺼진다.** 꺼진 대조는 `–` 가 아니라 실패다.
#
# 「26 개를 제공한다」로 읽히는 것은 **`pal query --list` 가 막는다** — 답하는 여섯과
# **아직 못 만든 능력**을 함께 낸다. 못 만든 것은 **이름이 아니라 기능 번호와 능력
# 이름**으로 실린다. 이름을 적으면 그것이 곧 스무 개의 빈 자리다.
#
# ── 이 파일은 손으로 쓴다 ────────────────────────────────────────────────────
#
# `cargo xtask` 에 이 파일을 **쓰는** 경로가 없다. 코드에서 생성하면 아래의 양방향
# 대조가 전부 항등식이 되어 **영원히 통과한다.** 생성되는 것은 문서 표뿐이다
# (`cargo xtask query-doc` → `docs/query-catalog.md` · `schema-doc` 과 같은 형태).
#
# **런타임에 안 읽힌다.** `schema/graph.toml` 과 같은 자격이다 — `pal query --list` 는
# 코드의 선언에서 렌더링되고 이 파일은 그것을 **대조**한다. 런타임에 읽으면 파일이
# 없을 때 답을 못 내고, 그것은 *"호스트 없이도 코어가 답한다"* 를 깨는 새 실패 경로다.
#
# **코드에만 있고 여기 없는 질의는 CI 실패다. 그 반대도 같다**
# (`cargo xtask check` 의 "카탈로그 정합" · 방향 넷을 **각각 자기 루프로** 돈다).
#
# ── 여기 없는 필드 ───────────────────────────────────────────────────────────
#
# **`direction` 을 안 만든다.** 문서 §2 의 규칙 4 가 *"`direction = "provide"` 인 질의는
# 조달 방향이며 그 사실이 카탈로그에 표시된다"* 라고 적었는데, **이 빌드의 여섯이 전부
# `consume` 이다.** 값이 하나뿐인 필드는 아무것도 안 가르고, 없는 값을 위해 자리를
# 만들면 위의 스무 개와 같은 형태가 된다. **조달 방향은 F16 이 세운다** — 그때 이
# 필드가 값을 갖고 태어난다.
#
# ── `returns` 가 답의 전부는 아니다 ──────────────────────────────────────────
#
# `args` 가 비어 있지 않은 질의는 **`Ambiguous` 와 `Unknown` 으로도 답한다** —
# *"여럿이라 하나로 못 좁혔다"* 와 *"이 스냅샷에서 못 찾았다"* 다. 둘 다 실패가 아니라
# **답**이고 종료 코드 0 이다(`[f06].exit_code_decision`). `returns` 는 **찾았을 때의
# 모양**이고, 나머지 둘은 `args` 가 비어 있지 않다는 사실에서 따라온다.
# ═════════════════════════════════════════════════════════════════════════════

catalog_version = 1

# ─────────────────────────────────────────────────────────────────────────────
# F01 — 관측 범위 대장
# ─────────────────────────────────────────────────────────────────────────────

[query."ledger.snapshot"]
summary    = "이 스냅샷의 관측 범위 대장"
args       = []
returns    = "Ledger"
introduced = "F01"

# ─────────────────────────────────────────────────────────────────────────────
# F02·F03 — 좌표
# ─────────────────────────────────────────────────────────────────────────────

[query."symbol.resolve"]
summary    = "이름 하나 → 후보 심볼들. **여럿인 것이 정상이다**"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Symbols"
introduced = "F03"

[query."symbol.contains"]
summary    = "이 심볼이 담는 것들 — 컨테이너 체인으로"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Symbols"
introduced = "F02"

# ─────────────────────────────────────────────────────────────────────────────
# F05 — 파일 **안**의 관계. 파일 밖은 F07 이다
# ─────────────────────────────────────────────────────────────────────────────

[query."symbol.callers"]
summary    = "이 심볼을 가리키는 것들 — 1홉 역방향"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Symbols"
introduced = "F05"

[query."symbol.reaches"]
summary    = "이 심볼에서 닿는 것들 — **예산 절단이 있는 BFS**"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Reached"
introduced = "F05"

[query."graph.dump"]
summary    = "노드와 엣지 전부 — 바깥 오라클이 읽는 창"
args       = []
returns    = "Graph"
introduced = "F05"
