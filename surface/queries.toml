# ═════════════════════════════════════════════════════════════════════════════
# 질의 카탈로그 — **표면이 계약이면 목록도 계약이다** (F06 §2)
#
# **여기 없는 것은 이 빌드가 답하지 않는다.**
# [옛 F06 문서 §3](../docs/plan/disposal-map.md) 의 표는 **26 줄이고 로드맵이다** —
# 이 파일의 상위집합이 아니라 **다른 것**이다. 로드맵은 문서에 살고 상태는 이슈에 산다
# (계획 §7 의 넷째: *"같은 것을 두 곳에 적으면 그것이 곧 drift"*).
#
# ── 왜 이 빌드가 답하는 것만 적는가 ─────────────────────────────────────────
#
# 정본은 `corpus/criteria.toml` `[f06].catalog_scope_decision` 이고 근거는 넷이다.
# 가장 무거운 것 하나만 옮겨 적는다:
#
#   **짝이 없으면 대조가 꺼진다.** `schema/graph.toml` 은 `UnresolvedRef`·`Journey` 를
#   `not_built` 로 적는데, 그것이 허용되는 이유는 **코드에 짝이 있고 그 타입이 값을
#   만들 수 없기** 때문이다(`cargo xtask check` 의 방향 3 이 `uninhabited` 를 요구한다).
#   아직 안 만든 스무 개의 질의에는 **코드 쪽 짝이 아예 없다.** 만들면 그것이 곧
#   「없는 자리를 미리 만드는 것」이고, 안 만들면 양방향 대조가 그 스무 개에 대해
#   **꺼진다.** 꺼진 대조는 `–` 가 아니라 실패다.
#
# 「26 개를 제공한다」로 읽히는 것은 **`pal query --list` 가 막는다** — 답하는 것과
# **아직 못 만든 능력**을 함께 낸다. 못 만든 것은 **이름이 아니라 기능 번호와 능력
# 이름**으로 실린다. 이름을 적으면 그것이 곧 스무 개의 빈 자리다.
#
# ── 이 파일은 손으로 쓴다 ────────────────────────────────────────────────────
#
# `cargo xtask` 에 이 파일을 **쓰는** 경로가 없다. 코드에서 생성하면 아래의 양방향
# 대조가 전부 항등식이 되어 **영원히 통과한다.** 생성되는 것은 문서 표뿐이다
# (`cargo xtask query-doc` → `docs/query-catalog.md` · `schema-doc` 과 같은 형태).
#
# **런타임에 안 읽힌다.** `schema/graph.toml` 과 같은 자격이다 — `pal query --list` 는
# 코드의 선언에서 렌더링되고 이 파일은 그것을 **대조**한다. 런타임에 읽으면 파일이
# 없을 때 답을 못 내고, 그것은 *"호스트 없이도 코어가 답한다"* 를 깨는 새 실패 경로다.
#
# **코드에만 있고 여기 없는 질의는 CI 실패다. 그 반대도 같다**
# (`cargo xtask check` 의 "카탈로그 정합" · 방향 넷을 **각각 자기 루프로** 돈다).
#
# ── 여기 없는 필드 ───────────────────────────────────────────────────────────
#
# **`direction` 을 안 만든다.** 문서 §2 의 규칙 4 가 *"`direction = "provide"` 인 질의는
# 조달 방향이며 그 사실이 카탈로그에 표시된다"* 라고 적었는데, **이 빌드의 여섯이 전부
# `consume` 이다.** 값이 하나뿐인 필드는 아무것도 안 가르고, 없는 값을 위해 자리를
# 만들면 위의 스무 개와 같은 형태가 된다. **조달 방향은 F16 이 세운다** — 그때 이
# 필드가 값을 갖고 태어난다.
#
# ── `returns` 가 답의 전부는 아니다 ──────────────────────────────────────────
#
# `args` 가 비어 있지 않은 질의는 **`Ambiguous` 와 `Unknown` 으로도 답한다** —
# *"여럿이라 하나로 못 좁혔다"* 와 *"이 스냅샷에서 못 찾았다"* 다. 둘 다 실패가 아니라
# **답**이고 종료 코드 0 이다(`[f06].exit_code_decision`). `returns` 는 **찾았을 때의
# 모양**이고, 나머지 둘은 `args` 가 비어 있지 않다는 사실에서 따라온다.
# ═════════════════════════════════════════════════════════════════════════════

catalog_version = 1

# ─────────────────────────────────────────────────────────────────────────────
# F01 — 관측 범위 대장
# ─────────────────────────────────────────────────────────────────────────────

[query."ledger.snapshot"]
summary    = "이 스냅샷의 관측 범위 대장"
args       = []
returns    = "Ledger"
introduced = "F01"

# ─────────────────────────────────────────────────────────────────────────────
# F02·F03 — 좌표
# ─────────────────────────────────────────────────────────────────────────────

[query."symbol.resolve"]
summary    = "이름 하나 → 후보 심볼들. **여럿인 것이 정상이다**"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Symbols"
introduced = "F03"

[query."symbol.contains"]
summary    = "이 심볼이 담는 것들 — 컨테이너 체인으로"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Symbols"
introduced = "F02"

# ─────────────────────────────────────────────────────────────────────────────
# F05 — 파일 **안**의 관계. 파일 밖은 F07 이다
# ─────────────────────────────────────────────────────────────────────────────

[query."symbol.callers"]
summary    = "이 심볼을 가리키는 것들 — 1홉 역방향"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Symbols"
introduced = "F05"

[query."symbol.reaches"]
summary    = "이 심볼에서 닿는 것들 — **예산 절단이 있는 BFS**"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Reached"
introduced = "F05"

[query."graph.dump"]
summary    = "노드와 엣지 전부 — 바깥 오라클이 읽는 창"
args       = []
returns    = "Graph"
introduced = "F05"

# ─────────────────────────────────────────────────────────────────────────────
# F09 — 결박과 낡음. **이 이름이 [ADR-0012] 의 첫 실전이다**
#
# > 각 기능이 **자기 이름을 자기 종료 시점에** 등록한다. F07 이 `refs.callers` 를,
# > F08 이 `refs.unresolved` 를. **그것이 그 기능이 실제로 섰다는 산출 수준의 표시다.**
#
# 그리고 그 장치가 실제로 일했다 — 코드 쪽만 먼저 더했더니 `cargo xtask check` 가 막았다:
#
#     코드가 `binding.status` 에 답하는데 카탈로그에 없다 —
#     질의 추가는 `surface/queries.toml` 변경으로만 일어난다(F06 §2 규칙 1)
#
# [ADR-0012]: ../docs/adr/0012-a-single-truth-file-declares-only-what-has-a-counterpart-in-code.md
# ─────────────────────────────────────────────────────────────────────────────

[query."binding.status"]
summary    = "결박마다 상태 + **반경** + 무엇이 켰는가"
args       = []
returns    = "Bindings"
introduced = "F09"

# ─────────────────────────────────────────────────────────────────────────────
# F10 — 서술물 인입
# ─────────────────────────────────────────────────────────────────────────────

# **좌표를 못 찾은 문서 조각들.** F10 §2 가 그것을 *"이것이 사람의 작업 목록"* 이라고
# 적었다.
#
# ── 왜 짝 질의를 안 적나 ─────────────────────────────────────────────────────
#
# `narrative.bound` 도 `narrative.candidates` 도 **안 적는다.** 이 빌드가 그 이름에
# 답하지 않고, 적으면 그것이 곧 두 개의 빈 자리다(ADR-0012). 결박된 것은
# `binding.status` 가 이미 낸다 — **같은 것을 두 곳에 적으면 그것이 곧 drift** 다.
#
# ── 인자를 안 받는다 ─────────────────────────────────────────────────────────
#
# 작업 목록은 **전부**를 내야 목록이다. 걸러 내면 사람이 무엇을 안 봤는지 모른다.
[query."narrative.unbound"]
summary    = "좌표를 못 찾은 문서 조각들 — **사람의 작업 목록**"
args       = []
returns    = "Narrative"
introduced = "F10"

# ─────────────────────────────────────────────────────────────────────────────
# F11 — 적시 제시. **목적이지 수단이 아니다**
#
# ── 왜 이제야 여기 오나 ──────────────────────────────────────────────────────
#
# `pal touch` 는 S2 부터 서 있었는데 **이 파일에 줄이 없었다.** 능력 목록
# (`capabilities.built`)에는 `binding.touch` 가 실려 나가고 있었고, 그러면 코드와
# 카탈로그의 양방향 대조가 이 이름에 대해 **꺼진 채로** 돈다.
# [ADR-0012] 가 막은 것은 *"짝 없는 이름을 적는 것"* 이고 여기는 그 **반대편** —
# **짝이 있는데 안 적힌 자리**다. 꺼진 대조는 `–` 가 아니라 실패다.
#
# ── 인자가 하나다 ────────────────────────────────────────────────────────────
#
# 이름 하나. **상한(`--binding-max`)은 인자가 아니다** — 이 파일은 `required = false`
# 를 금하고(자리를 미리 만들면 그것이 곧 빈 자리다), 상한은 질의의 **성분이 아니라
# 표면의 손잡이**다. 걸리면 그 사실이 `elision` 으로 답에 실린다.
#
# ── `returns` 가 답의 전부는 아니다 ─────────────────────────────────────────
#
# 못 찾으면 `Unknown` 이고 **근접 후보가 함께 실린다.** 여럿이면 `Ambiguous` 이고
# **하나를 고르지 않는다.** 둘 다 실패가 아니라 답이다.
# ─────────────────────────────────────────────────────────────────────────────

[query."binding.touch"]
summary    = "좌표 하나를 만진다 — **걸린 것**과 ★ **지켜보는 것**을 함께 낸다"
args       = [{ name = "name", type = "SymbolName", required = true }]
returns    = "Touch"
introduced = "F11"

# ─────────────────────────────────────────────────────────────────────────────
# F12 — 계획-구현 결박. **답이 넷이고 못 잰 것이 분리돼 있다**
#
# ── 인자가 좌표가 아니라 계획 문서다 ────────────────────────────────────────
#
# 이름을 받는 다른 다섯은 `SymbolName` 을 받는데 이것은 `RepoPath` 를 받는다.
# **기준선이 그 문서 안에 있기 때문이다** — [F12 §4] 가 *"어디부터가 이 계획의
# 변경인가"* 의 대응으로 *"계획 승인 시점의 Snapshot 을 계획에 기록"* 이라고 적었다.
#
# ⚠ **`--base <ref>` 를 안 만든다.** [F23 §7] 의 완료 체크리스트가 그 손잡이를
# `briefing · conformance · **deviation**` 셋에 대해 한 줄로 적었고 소유자가 거기다.
# 여기서 만들면 F23 을 당겨오는 것이고, 그 경계를 `[f12.pass]` ⑬ 이 잰다.
#
# ── `returns` 가 답의 전부는 아니다 ─────────────────────────────────────────
#
# 계획에 기준선이 없으면 이 질의는 **답을 안 낸다** — 조용히 HEAD 를 기준선으로
# 삼으면 이탈률이 언제나 0 이 되고, 그 0 이 *"계획대로 했다"* 로 읽힌다.
# ─────────────────────────────────────────────────────────────────────────────

[query."plan.deviation"]
summary    = "계획과 실제의 갈림 — 넷이고 ★ **못 잰 것이 분리돼 있다**"
args       = [{ name = "plan", type = "RepoPath", required = true }]
returns    = "Deviation"
introduced = "F12"

# DESIGN.md 가 이렇게 정했다
