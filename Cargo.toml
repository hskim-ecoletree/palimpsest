[workspace]
resolver = "3"
members = [
    "crates/pal-core",
    "crates/pal-extract",
    "crates/pal-git",
    "crates/pal-intent",
    "crates/pal-store",
    "crates/pal-query",
    "crates/pal-cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# 검사를 단계적으로 켠다 — stack §4.3. 단계 1 은 전부 S 규모다.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
pal-core = { path = "crates/pal-core" }
pal-extract = { path = "crates/pal-extract" }
pal-git = { path = "crates/pal-git" }
pal-store = { path = "crates/pal-store" }
pal-intent = { path = "crates/pal-intent" }
pal-query = { path = "crates/pal-query" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tree-sitter = "0.26"
streaming-iterator = "0.1"

# S1 에서 들어온 넷. stack §3.1 이 이미 고른 것들이고, 여기서 늘리지 않는다.
#   gix      — git 접근. **`pal-git` 만 직접 의존한다**(R-15 · criteria [s1.pass].gix_direct_dependents)
#   blake3   — 1층 캐시 키. `symbol_id`·`body_digest` 도 나중에 이것을 쓴다
#   postcard — 1층 캐시 값. 컴팩트한 바이너리. 스키마 버전이 이미 키에 있으므로 호환성 부담이 없다
#   zstd     — 캐시 압축. 레벨 3 고정
# `blame` 을 켜지 않는다 — F22-3 이 검토하고 기각했다(docs/gates/F22-3-chain-nodes.md).
#   ① 켜면 gix-diff/blob → gix-filter → **encoding_rs(BSD-3-Clause)** 가 돌아온다.
#      S1 이 정확히 그 크레이트를 features 를 좁혀 몰아냈고, deny.toml 은
#      *"예외를 늘리기 전에 의존을 줄이는 것이 순서"* 라고 적었다.
#   ② 그리고 애초에 **줄 단위 blame 은 이 좌표계가 아니다.** `Coord` 에 `span` 이 없고
#      (§2.1) 줄은 포매팅으로 움직인다. 소급 결박은 `body_digest` 위에서 심볼 단위로 한다.
gix = { version = "0.86", default-features = false, features = ["sha1", "revision"] }
blake3 = "1"
# `default-features = false` 가 필수다 — 기본 feature `heapless-cas` 가 heapless 를 끌고
# 오고 그것이 유지보수 중단된 `atomic-polyfill` 에 닿는다(cargo-deny 가 잡았다).
# 우리는 std 위에서 `alloc` 만 쓰므로 heapless 가 필요 없다.
postcard = { version = "1", default-features = false, features = ["alloc"] }
zstd = "0.13"

# 2층 인덱스 — stack §2.3. **1층은 여기 넣지 않는다**(§2.4)
redb = "4"

# F03-2 가 들인 하나 — **`dev-dependencies` 다. 산출 바이너리에 들어가지 않는다.**
#
# 근거(stack §3.4 — *"P0 에서 외부 크레이트 신규 추가는 커밋 메시지에 근거를 남긴다"*):
# 옛 F03 §6.1 이 요구하는 것은 **양방향 속성 검사**이고, 그 요점은 *"한쪽만 검사하면
# 「항상 같은 값 반환」도 통과한다"* 이다. 단위 시험으로 그것을 세우면 우리가 고른
# 입력에서만 참이 되고, **고르는 사람이 판정하는 사람과 같다**(R-18). 무작위 변형은
# 그 고르기를 우리 손에서 뺀다.
#
# 스스로 줄이기: 씨앗은 지어내지 않고 코퍼스에서 뜬다
# (`corpus/tasks/f03-normalize-seeds.ts`) — 무작위화하는 것은 **변형뿐이다.**
proptest = "1"

# 데이터 병렬. **`pal-cli` 만 직접 의존한다** — 병렬은 조립의 사실이지 도메인의 사실이
# 아니고, `pal-core` 가 그것을 알면 좌표계에 실행 모델이 샌다(stack §4.1).
#
# 근거(stack §3.4 — P0 의 신규 크레이트는 커밋 메시지에 근거를 남긴다):
#   · 파일 간 의존이 없어 추출이 완전 병렬이다(옛 F02 §3.6). 손으로 스레드를 관리하면
#     **작업 훔치기와 청크 크기를 우리가 다시 만들어야 하고**, 그 둘이 곧 rayon 이다
#   · `RAYON_NUM_THREADS` 하나로 스레드 수를 밖에서 바꿀 수 있다 — `[f02.4.pass]` ③ 의
#     **반대 방향**(스레드 수를 바꿔도 산출이 같다)이 그것 없이는 재어지지 않는다
#   · 라이선스 MIT/Apache-2.0 — `deny.toml` 의 예외를 **하나도 늘리지 않는다**
rayon = "1"

# F22 가 들인 하나. stack §3.4 는 "P0 에서 외부 크레이트 신규 추가는 근거를 남긴다" 고
# 적었고 그 근거는 이렇다: `schema/graph.toml` 이 노드·엣지의 **단일 진실**이고
# (옛 DESIGN §1.2 D25), §3.4 는 producer↔provenance 정합이 *"로딩 시점에 거부된다"* 고
# 못 박았으며, §12.7 은 `doctor` 의 불변식 여덟이 *"schema/graph.toml 에서 파생되며
# 손으로 세지 않는다"* 고 적었다. 즉 이 파일은 **실행 시점에 읽혀야 한다.**
# xtask 가 `vocab.toml` 을 손으로 읽은 것(한 줄짜리 허용 목록)과 다른 판단이고,
# 다른 이유는 대상이 한 줄이 아니라 스키마 전체이며 읽는 경로가 하나여야 하기 때문이다.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

# 판정용 문법을 커밋으로 고정한다 — corpus/criteria.toml [g50]
#
# **2026-08-13 · #50 — 문법을 갈았다.** 옛 핀은 `tree-sitter-kotlin-ng @ 3dea6df`
# (= v1.1.0 = 그 저장소의 HEAD · 2025-01-16 이후 정지)였고, 그것이 S0 코퍼스 1,122 중
# **56 파일을 못 읽었다.** 새 핀은 1,122 을 **전부** 읽는다(전수 실측 · `dda5bb5`).
#
# **어느 포크인가는 실측 표로 정하지 못했다.** `sg` 와 `brokk` 는 1,122 파일에서
# 파싱 성패·선언 수·**트리 S-표현식이 바이트로 같다.** 축 C(상류 추종)가 갈랐다 —
# `brokk` 는 upstream(fwcd)보다 뒤진 커밋이 **0** 이고 `sg` 는 **5**(그중 문법 3).
# 판정 전문: docs/gates/G50-kotlin-grammar-pin.md
#
# ⚠ **계보가 바뀌었다.** ng 는 amaanq 의 다시 쓰기이고 brokk 는 fwcd 계열이라
# **노드 이름이 통째로 다르다**(`identifier` → `simple_identifier`/`type_identifier`,
# `name:` 필드 없음). ADR-0007 이 정규형을 트리 직렬화로 바꿨으므로
# **Kotlin 의 `body_digest` 가 전부 이동한다.** 그것이 설계된 산출이다.
brokk-tree-sitter-kotlin = { git = "https://github.com/BrokkAi/tree-sitter-kotlin", rev = "acb96307d816618bd60e1e4d2fa3eaa793e97a2e" }
# **문법은 커밋으로 핀한다** — 위 Kotlin 과 같은 형태다. 핀이 곧 `ExtractorVersion` 의
# 문법 축이고, 움직이면 1층 캐시가 전량 무효화되며 좌표가 이동한다(stack §5.1).
# 그래서 이 rev 는 `corpus/criteria.toml` `[f02.1.grammar]` 에 `[s0.grammar]` 와 같은
# 자격으로 적혀 있다. **태그가 아니라 커밋인 이유**: 태그는 옮길 수 있다.
#
# 왜 v0.23.2(f975a62)가 아니라 75b3874 인가 — 그 사이 다섯 커밋에 **문법 변경이 하나도
# 없다**(LICENSE 추가·FUNDING·docs·CI). 그리고 75b3874 가 더한 것이 `LICENSE` 파일이다.
# 라이선스는 MIT 이고 `cargo deny` 의 licenses 를 그대로 통과한다 — **예외를 늘리지 않았다**.
tree-sitter-typescript = { git = "https://github.com/tree-sitter/tree-sitter-typescript", rev = "75b3874edb2dc714fb1fd77a32013d0f8699989f" }
