[workspace]
resolver = "3"
members = [
    "crates/pal-core",
    "crates/pal-extract",
    "crates/pal-git",
    "crates/pal-intent",
    "crates/pal-store",
    "crates/pal-cli",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

# 검사를 단계적으로 켠다 — stack §4.3. 단계 1 은 전부 S 규모다.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
pal-core = { path = "crates/pal-core" }
pal-extract = { path = "crates/pal-extract" }
pal-git = { path = "crates/pal-git" }
pal-store = { path = "crates/pal-store" }
pal-intent = { path = "crates/pal-intent" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tree-sitter = "0.26"
streaming-iterator = "0.1"

# S1 에서 들어온 넷. stack §3.1 이 이미 고른 것들이고, 여기서 늘리지 않는다.
#   gix      — git 접근. **`pal-git` 만 직접 의존한다**(R-15 · criteria [s1.pass].gix_direct_dependents)
#   blake3   — 1층 캐시 키. `symbol_id`·`body_digest` 도 나중에 이것을 쓴다
#   postcard — 1층 캐시 값. 컴팩트한 바이너리. 스키마 버전이 이미 키에 있으므로 호환성 부담이 없다
#   zstd     — 캐시 압축. 레벨 3 고정
# `blame` 을 켜지 않는다 — F22-3 이 검토하고 기각했다(docs/gates/F22-3-chain-nodes.md).
#   ① 켜면 gix-diff/blob → gix-filter → **encoding_rs(BSD-3-Clause)** 가 돌아온다.
#      S1 이 정확히 그 크레이트를 features 를 좁혀 몰아냈고, deny.toml 은
#      *"예외를 늘리기 전에 의존을 줄이는 것이 순서"* 라고 적었다.
#   ② 그리고 애초에 **줄 단위 blame 은 이 좌표계가 아니다.** `Coord` 에 `span` 이 없고
#      (§2.1) 줄은 포매팅으로 움직인다. 소급 결박은 `body_digest` 위에서 심볼 단위로 한다.
gix = { version = "0.86", default-features = false, features = ["sha1", "revision"] }
blake3 = "1"
# `default-features = false` 가 필수다 — 기본 feature `heapless-cas` 가 heapless 를 끌고
# 오고 그것이 유지보수 중단된 `atomic-polyfill` 에 닿는다(cargo-deny 가 잡았다).
# 우리는 std 위에서 `alloc` 만 쓰므로 heapless 가 필요 없다.
postcard = { version = "1", default-features = false, features = ["alloc"] }
zstd = "0.13"

# 2층 인덱스 — stack §2.3. **1층은 여기 넣지 않는다**(§2.4)
redb = "4"

# F22 가 들인 하나. stack §3.4 는 "P0 에서 외부 크레이트 신규 추가는 근거를 남긴다" 고
# 적었고 그 근거는 이렇다: `schema/graph.toml` 이 노드·엣지의 **단일 진실**이고
# (DESIGN §1.2 D25), §3.4 는 producer↔provenance 정합이 *"로딩 시점에 거부된다"* 고
# 못 박았으며, §12.7 은 `doctor` 의 불변식 여덟이 *"schema/graph.toml 에서 파생되며
# 손으로 세지 않는다"* 고 적었다. 즉 이 파일은 **실행 시점에 읽혀야 한다.**
# xtask 가 `vocab.toml` 을 손으로 읽은 것(한 줄짜리 허용 목록)과 다른 판단이고,
# 다른 이유는 대상이 한 줄이 아니라 스키마 전체이며 읽는 경로가 하나여야 하기 때문이다.
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }

# 판정용 문법을 커밋으로 고정한다 — corpus/criteria.toml [s0.grammar].judging
# 이 커밋이 곧 v1.1.0 이고 upstream HEAD 다 (2026-08-12 실측).
tree-sitter-kotlin-ng = { git = "https://github.com/tree-sitter-grammars/tree-sitter-kotlin", rev = "3dea6dfa9c0129deb7c4315afbda806c85c41667" }
# **문법은 커밋으로 핀한다** — 위 Kotlin 과 같은 형태다. 핀이 곧 `ExtractorVersion` 의
# 문법 축이고, 움직이면 1층 캐시가 전량 무효화되며 좌표가 이동한다(stack §5.1).
# 그래서 이 rev 는 `corpus/criteria.toml` `[f02.1.grammar]` 에 `[s0.grammar]` 와 같은
# 자격으로 적혀 있다. **태그가 아니라 커밋인 이유**: 태그는 옮길 수 있다.
#
# 왜 v0.23.2(f975a62)가 아니라 75b3874 인가 — 그 사이 다섯 커밋에 **문법 변경이 하나도
# 없다**(LICENSE 추가·FUNDING·docs·CI). 그리고 75b3874 가 더한 것이 `LICENSE` 파일이다.
# 라이선스는 MIT 이고 `cargo deny` 의 licenses 를 그대로 통과한다 — **예외를 늘리지 않았다**.
tree-sitter-typescript = { git = "https://github.com/tree-sitter/tree-sitter-typescript", rev = "75b3874edb2dc714fb1fd77a32013d0f8699989f" }
