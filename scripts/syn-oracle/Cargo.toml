# **음성 대조군** — 손 표본이 고장이면 여기서 드러난다.
#
# `corpus/tasks/rust-recall-sample.tsv` 는 사람이 소스를 읽어 만든 것이고,
# 그것이 정본이다. 이 크레이트는 **다른 파서**(`syn`)로 같은 규칙을 적용해
# 같은 집합이 나오는지 본다 — 두 방법이 갈리면 표본이 고장난 것이다.
#
# ⚠ **워크스페이스 멤버가 아니다**(루트 `[workspace].exclude`). `syn` 은 판정
# 도구의 의존이지 제품의 의존이 아니므로 `deny.toml` 의 모집단에 안 들어간다.
#
# 사용: cargo run --release --manifest-path scripts/syn-oracle/Cargo.toml -- <파일…>
[package]
name = "syn-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
syn = { version = "2", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
