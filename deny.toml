# 의존 정책 — stack §3.4 · §4.3 단계 1
#
# **`cargo xtask check` 가 이것을 부른다.** 검사가 저장소 밖 도구에 기대는 유일한 자리이고,
# 그래서 미설치일 때 조용히 건너뛰지 않고 실패한다 — 건너뛴 검사는 켜지지 않은 검사다.
#
# 정본은 stack §3.4 다: *"라이선스: MIT/Apache-2.0만. `cargo-deny` 로 CI 검사"*.
# **이 파일에 줄이 느는 것 자체가 관측 대상이다** — `xtask/vocab.toml` 과 같은 규율이다.

[graph]
all-features = true

# ── 라이선스 ────────────────────────────────────────────────────────────────
[licenses]
# 정본이 정한 둘.
allow = [
    "MIT",
    "Apache-2.0",

    # ── 예외 1 — 왜 필요한가 ──────────────────────────────────────────────
    # `unicode-ident` 가 `(MIT OR Apache-2.0) AND Unicode-3.0` 이다. `AND` 이므로
    # 위의 둘을 골라도 이것이 남는다. 이 크레이트는 `syn`·`proc-macro2` 의 전이 의존이고
    # (serde·clap·thiserror 의 파생 매크로가 전부 그것을 쓴다) 유니코드 문자 분류표의
    # 라이선스일 뿐이다. 배포에 제약을 더하지 않는다.
    "Unicode-3.0",

    # ── 예외 2·3 — S1 이 gix·blake3 를 들이면서 생겼다 ─────────────────────
    # **먼저 의존을 줄여서 없앨 수 있는 것을 없앴다.** gix 를 `default-features = false,
    # features = ["sha1", "revision"]` 로 좁히자 `uluru`(**MPL-2.0 · copyleft**)와
    # `encoding_rs`(BSD-3-Clause)가 트리에서 빠졌다. 예외를 늘리기 전에 의존을 줄이는
    # 것이 순서다 — 정책은 느슨해지면 되돌아오지 않는다.
    #
    # 남은 둘은 줄일 수 없고, 둘 다 **permissive 이며 copyleft 가 아니다**:
    #   Zlib          — `foldhash` ← hashbrown ← clru ← gix-pack. 팩 객체 읽기의 경로다
    #   BSD-2-Clause  — `arrayref` ← **blake3**. gix 가 아니라 우리가 고른 해시다(stack §3.1)
    #
    # **stack §3.4 는 "MIT/Apache-2.0만"이라고 적었고 이것이 그 문장의 첫 예외다.**
    # 그 문장은 P0 착수 전에 쓰였고, gix·blake3 를 고른 순간 결과가 정해졌다.
    # 배포 제약은 늘지 않는다(둘 다 고지만 요구한다). 소유자가 뒤집으면 대체 크레이트를
    # 찾는 일이 되고, 그 경우 gix 는 팩 읽기를 포기할 수 없으므로 git 접근 방식이 바뀐다.
    "Zlib",
    "BSD-2-Clause",
]
confidence-threshold = 0.9

# ── 보안 권고 ───────────────────────────────────────────────────────────────
[advisories]
# 기본이 `deny` 다. 알려진 취약점·유지보수 중단 크레이트가 들어오면 실패한다.
# **무시 목록은 비어 있고, 비어 있는 것이 정상 상태다.** 항목을 넣을 때는 왜인지 적는다.
ignore = []

# ── 출처 ────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# ── 예외 4 — git 출처 하나. **이것이 이 파일에서 가장 중요한 줄이다** ──────────
# Kotlin 문법을 crates.io 판이 아니라 **git rev 로 고정**한다. 레지스트리 판은
# 재게시될 수 있고 rev 는 그럴 수 없다. 문법이 바뀌면 1층 캐시가 전량 무효화되고
# 좌표가 움직이므로(stack §5.1) 이 고정은 성능이 아니라 **정체성**의 문제다.
#
# ⚠ **2026-08-13 · #50 — 이 줄이 옮겨졌다.**
#   옛것: `tree-sitter-grammars/tree-sitter-kotlin` @ `3dea6df` (`tree-sitter-kotlin-ng`)
#   새것: `BrokkAi/tree-sitter-kotlin` @ `acb9630` (`brokk-tree-sitter-kotlin`)
#
# 위 문단이 *"포크 채택 여부의 처분은 F02 가 지며, 그때 이 줄이 함께 움직인다"* 라고
# 적었고 **여기가 그 자리다.** 옛 핀은 S0 코퍼스 1,122 중 **56 파일을 못 읽었고**
# upstream 이 2025-01-16 이후 멈춰 있었다. 새 핀은 1,122 을 **전부** 읽는다.
#
# **예외 수가 늘지 않았다** — 출처 하나를 다른 하나로 바꿨다. 라이선스도 **MIT** 라
# `licenses` 예외를 **하나도 늘리지 않았다**(예외를 늘리기 전에 의존을 줄이는 것이
# 순서라는 아래 규율이 여기서는 걸리지 않는다). 판정: docs/gates/G50-kotlin-grammar-pin.md
#
# ── 예외 5 — git 출처 둘째. **2026-08-13 · F02-1(#46)** ──────────────────────
# `tree-sitter-typescript` 를 rev `75b3874` 로 고정한다. 같은 이유다 — 핀이 곧
# `ExtractorVersion` 의 문법 축이고, 움직이면 1층 캐시가 전량 무효화되며 좌표가
# 이동한다(stack §5.1). 그 rev 는 `corpus/criteria.toml` `[f02.1.grammar]` 에
# `[s0.grammar].judging` 과 **같은 자격으로** 적혀 있다.
#
# **예외를 늘리기 전에 의존을 줄이는 것이 순서다**(아래 licenses 절). 여기서는 줄일
# 것이 없었다 — 이 크레이트의 의존은 `tree-sitter-language`(빌드 시 `cc`) 하나이고,
# 라이선스는 MIT 라 licenses 예외를 **하나도 늘리지 않았다.**
#
# crates.io 에 0.23.2 가 있는데도 git 인 이유는 Kotlin 과 같다: 레지스트리 판은
# 재게시될 수 있고 rev 는 그럴 수 없다. 태그(v0.23.2)가 아니라 커밋인 이유도 같다 —
# 태그는 옮길 수 있다. 태그 이후 다섯 커밋에 **문법 변경이 없고**(LICENSE·FUNDING·
# docs·CI) 그중 하나가 LICENSE 파일을 더한 것이라 그쪽을 골랐다.
allow-git = [
    "https://github.com/BrokkAi/tree-sitter-kotlin",
    "https://github.com/tree-sitter/tree-sitter-typescript",
    # **셋째다.** `deny.toml:6` 이 *"이 파일에 줄이 느는 것 자체가 관측 대상"* 이라
    # 못 박았으므로 판정에 싣는다(#66 · `docs/gates/rust-extractor.md`).
    # 라이선스 예외는 **안 늘었다** — MIT 이고 의존은 이미 트리에 있다.
    "https://github.com/tree-sitter/tree-sitter-rust",
]

# ── 중복·금지 ───────────────────────────────────────────────────────────────
[bans]
# 같은 크레이트의 버전이 여럿 들어오는 것은 빌드 크기와 진단을 흐린다. 지금은 경고다 —
# 우리 것이 아닌 전이 의존에서 생기고, `deny` 로 올리면 상류가 정리될 때까지 막힌다.
multiple-versions = "warn"
wildcards = "deny"
# 워크스페이스 내부 `path` 의존은 버전을 달지 않는다(`publish = false` 이므로 달 이유가 없다).
# 그것을 와일드카드로 세면 우리 크레이트끼리의 의존이 전부 위반이 된다 — 검사가 잡으려는
# 것은 **외부** 크레이트의 `"*"` 다.
allow-wildcard-paths = true

# stack §3.1 이 기각한 것들. **기각을 문서에만 적으면 다음 사람이 다시 넣는다.**
deny = [
    { crate = "git2", reason = "stack §3.1 — C 의존. git 접근은 gix 로 하고 pal-git 이 감싼다" },
    { crate = "openssl", reason = "정적 링크 비용. 순수 Rust 경로를 유지한다" },
]
