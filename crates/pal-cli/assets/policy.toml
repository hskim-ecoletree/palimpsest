# 정책 금지역 — **이 프로젝트가 소유한다**
#
# 회차의 종료 조건(`/pal-round` §11 「끝을 정하는 자」 ②)이 이 목록을 읽는다.
# 여기 적힌 영역에 닿는 발견이 남아 있으면 **회차가 안 닫힌다** — 「막힘」이다.
#
# ★ **왜 프로젝트가 소유하는가.** 무엇이 「정책으로 닫아도 되는 것」인지는 프로젝트마다
# 다르다. 어떤 프로젝트에서는 성능 회귀가 금지역이고 어떤 프로젝트에서는 아니다.
# 도구가 정할 수 없다.
#
# ★ **정책으로 닫는 것은 사람의 판단이다.** 에이전트가 *"이건 정책으로 해결하시죠"* 를
# 스스로 올릴 수는 없다 — 무엇이 정책 사안인지를 모르기 때문이다. 그래서 이 파일이
# **미리** 선을 긋고, 회차는 그 선만 판정한다.
#
# 이 파일을 고쳐도 `pal update` 는 밟지 않고 보고한다.
# ⚠ `pal uninstall` 은 이 파일을 지운다(설치 전 상태로 되돌리는 것이 그 명령의 계약이다).
#   고친 내용이 있으면 「지운 사용자 수정」으로 보고된다. 필요하면 먼저 복사해 두어라.

[금지역]
# 회차가 이것들에 닿는 것을 남긴 채로 닫히지 않는다.
# 이름은 자유롭게 정한다. 각 항목에 「무엇이 걸리는가」를 한 줄로 적어라.

데이터_손실 = "사용자 데이터를 지우거나 손상시킨다. 되돌리기가 불가능하다"
측정이_죽은_가지 = "검사·시험이 있는데 실제로는 아무것도 재지 않는다. 통과가 거짓이 된다"
사실이_아닌_것을_사실로 = "모르는 것을 안다고 적는다. 추정을 조회인 척한다"
인증 = "신원·권한 경계"
대표_취약점 = "주입 · 경로 탈출 · 역직렬화 · 비밀 노출"

[허용]
# 이것들만 남았으면 **닫아도 된다.** 판정으로 적고 넘어간다.
거짓신호 = "안 깨지지만 사람이 잘못 믿게 된다 — 낡은 인용 · 틀린 수"
미관 = "아무것도 안 깨진다"
